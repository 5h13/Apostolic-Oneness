<style>

    --ink-700:#242833;

    --slate:#8890a2;
    --gold:#cda45e;
    --gold-dim:rgba(205,164,94,0.14);
    --green:#6fae82;
    --green-dim:rgba(111,174,130,0.14);
    --amber:#d9a441;

  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink-900);color:var(--paper);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  html,body{height:100vh;height:100dvh;}
  body{display:flex;flex-direction:column;overflow:hidden;}
  a{color:inherit;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;flex:1 1 auto;min-height:0;}
  .masthead{padding:40px 0 0;flex:0 0 auto;}
  .masthead-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;flex-direction:row;align-items:center;gap:14px;}
  .brand-link{cursor:pointer;}
  .brand-link:hover{opacity:0.85;}
  .brand-logo{width:44px;height:44px;border-radius:6px;object-fit:cover;flex-shrink:0;}
  .brand h1{font-family:'Fraunces',serif;font-weight:600;font-size:40px;letter-spacing:-0.01em;margin:0;}
  .brand .tagline{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--slate);}
  .rule-thick{border:none;border-top:2px solid var(--paper);margin:24px 0 0;}
  .auth-box{min-width:240px;}
  .auth-tabs{display:flex;gap:4px;justify-content:flex-end;margin-bottom:6px;}
  .auth-tab{background:none;border:none;color:var(--slate);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;padding:4px 8px;cursor:pointer;border-bottom:2px solid transparent;}

  .auth-tab:hover{color:var(--paper);}
  .auth-box .who{display:flex;align-items:center;gap:10px;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:8px;padding:8px 12px;font-size:13px;}

  .auth-box .role-admin{color:var(--gold);font-size:11px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.06em;}
  .auth-box .role-mod{color:var(--green);font-size:11px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.06em;}
  .auth-box .role-user{color:var(--slate);font-size:11px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.06em;}
  .auth-box .signout{margin-left:auto;background:none;border:none;color:var(--slate);cursor:pointer;font-size:12px;text-decoration:underline;padding:0;font-family:'Inter',sans-serif;}

  .login-form{display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .login-form .row{display:flex;gap:8px;}
  input[type=text],input[type=email]{background:var(--ink-800);border:1px solid var(--ink-line);color:var(--paper);border-radius:6px;padding:8px 10px;font-size:13px;font-family:'Inter',sans-serif;outline:none;}

  .login-form input{width:190px;}
  .btn{background:var(--paper);color:var(--ink-900);border:none;border-radius:6px;padding:8px 14px;font-family:'Inter',sans-serif;font-weight:500;font-size:13px;cursor:pointer;}

  .btn-ghost{background:none;border:1px solid var(--ink-line);color:var(--paper);}

  .btn-rust{background:none;border:1px solid var(--rust);color:var(--rust);}

  .split{display:flex;height:100%;}

  .split-detail{flex:1 1 auto;overflow-y:auto;min-height:0;padding:28px 40px 60px;}
  .list-row{padding:14px 20px;border-bottom:1px solid var(--ink-line);cursor:pointer;border-left:3px solid transparent;}
  .list-group-header{position:sticky;top:0;z-index:1;background:var(--ink-900);border-bottom:1px solid var(--ink-line);padding:8px 20px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--slate);}
  .list-group-header-clickable{cursor:pointer;}
  .list-group-header-clickable:hover{color:var(--paper);}
  .list-group-header.active{color:var(--gold);background:var(--ink-800);}
  .list-row:hover{background:var(--ink-800);}
  .list-row.active{background:var(--ink-800);border-left-color:var(--gold);}
  .list-row-title{font-family:'Fraunces',serif;font-size:15px;font-weight:600;line-height:1.3;margin-bottom:5px;}
  .list-row-meta{font-size:11px;color:var(--slate);font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .stamp-mini{display:inline-block;padding:1px 7px;border-radius:8px;font-size:9px;letter-spacing:0.04em;text-transform:uppercase;}
  .stamp-mini.approved{color:var(--green);background:var(--green-dim);}
  .stamp-mini.pending{color:var(--amber);background:var(--amber-dim);}
  .stamp-mini.rejected{color:var(--rust);background:var(--rust-dim);}

  .detail-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:18px;color:var(--slate);text-align:center;overflow-y:auto;}
  .welcome-message{max-width:560px;line-height:1.7;color:var(--slate);text-align:left;}
  .welcome-heading{margin:0 0 10px;color:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;}
  .welcome-copy{margin:0 0 14px;color:var(--paper);}
  .feed-tools{padding:14px 16px;border-bottom:1px solid var(--ink-line);background:var(--ink-900);display:flex;align-items:center;gap:8px;}
  .feed-search-wrap{flex:1 1 auto;}
  .feed-search{width:100%;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:8px;padding:10px 12px;color:var(--paper);font-size:13px;font-family:'Inter',sans-serif;outline:none;}
  .feed-search:focus{border-color:var(--gold);}
  .clear-search{background:none;border:1px solid var(--ink-line);color:var(--slate);border-radius:6px;padding:8px 10px;font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;}
  .clear-search:hover:not(:disabled){border-color:var(--gold);color:var(--paper);}
  .clear-search:disabled{opacity:0.4;cursor:not-allowed;}
  .detail-article h2{font-family:'Fraunces',serif;font-weight:600;font-size:26px;line-height:1.25;margin:0 0 8px;}
  .engage-row{display:flex;gap:10px;margin-top:24px;align-items:center;}
  .reaction-bar{display:flex;gap:12px;margin:16px 0;}
  .reaction-btn{background:transparent;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;gap:4px;opacity:0.8;transition:transform 0.15s ease,opacity 0.15s ease;}
  .reaction-btn:hover{opacity:1;transform:scale(1.1);}
  .reaction-btn.active{color:#d9534f;transform:scale(1.2);opacity:1;}
  .comments-section{margin-top:34px;padding-top:22px;border-top:1px solid var(--ink-line);}
  .comment{padding:12px 0;border-bottom:1px solid var(--ink-line);}
  .comment-meta{font-size:12px;color:var(--slate);font-family:'IBM Plex Mono',monospace;display:flex;gap:8px;align-items:center;}
  .comment-meta b{color:var(--paper);font-weight:500;font-family:'Inter',sans-serif;}
  .comment-body{margin-top:6px;font-size:14px;color:#d6d8de;line-height:1.55;white-space:pre-wrap;}
  .comment-actions{margin-top:8px;display:flex;gap:10px;align-items:center;}
  .comment-reply{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
  .comment-reply textarea{min-height:70px;}
  .reply-actions{display:flex;justify-content:flex-end;gap:8px;}
  .comment-form{margin-top:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .comment-form textarea{min-height:70px;}
  .back-link{display:none;color:var(--gold);text-decoration:none;font-size:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;margin-bottom:18px;}
  .article{padding:26px 0;border-bottom:1px solid var(--ink-line);}
  .article:first-child{padding-top:0;}
  .article-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
  .article h2{font-family:'Fraunces',serif;font-weight:600;font-size:24px;line-height:1.25;margin:0 0 8px;cursor:pointer;}
  .article h2:hover{color:var(--gold);}
  .byline{font-size:12px;color:var(--slate);font-family:'IBM Plex Mono',monospace;}
  .byline b{color:var(--paper);font-weight:500;font-family:'Inter',sans-serif;}
  .excerpt{margin-top:12px;color:#c3c6cf;font-size:15px;line-height:1.65;}
  .body-text{margin-top:16px;color:#d6d8de;font-size:16px;line-height:1.75;white-space:pre-wrap;}
  .toggle-link{color:var(--gold);text-decoration:none;font-size:0.9em;white-space:nowrap;cursor:pointer;}
  .toggle-link:hover{text-decoration:underline;}
  .article-actions{margin-top:14px;display:flex;gap:8px;}
  .stamp{flex-shrink:0;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;border:1.5px solid currentColor;transform:rotate(-8deg);line-height:1.2;}
  .stamp.approved{color:var(--green);background:var(--green-dim);}
  .stamp.pending{color:var(--amber);background:var(--amber-dim);}
  .stamp.rejected{color:var(--rust);background:var(--rust-dim);}
  .empty{padding:60px 0;text-align:center;color:var(--slate);}
  .empty .glyph{font-family:'Fraunces',serif;font-size:32px;color:var(--ink-line);margin-bottom:10px;}
  .empty p{margin:4px 0;font-size:14px;}
  .panel{background:var(--ink-800);border:1px solid var(--ink-line);border-radius:10px;padding:24px;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .stat-card{background:var(--ink-800);border:1px solid var(--ink-line);border-radius:10px;padding:16px;text-align:center;}
  .stat-value{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--gold);}
  .stat-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--slate);margin-top:4px;}
  .user-table{width:100%;border-collapse:collapse;}
  .user-table th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--slate);padding:8px 10px;border-bottom:1px solid var(--ink-line);}
  .user-table td{padding:10px;border-bottom:1px solid var(--ink-line);vertical-align:top;font-size:13px;}
  .user-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .suspend-menu{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .msg-header{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--slate);margin-bottom:14px;}
  .msg-thread{display:flex;flex-direction:column;gap:10px;max-height:50vh;overflow-y:auto;padding-bottom:10px;}
  .msg-bubble{max-width:70%;padding:10px 14px;border-radius:10px;border:1px solid var(--ink-line);}
  .msg-bubble.mine{align-self:flex-end;background:var(--ink-800);border-color:var(--gold-dim,var(--ink-line));}
  .msg-bubble.theirs{align-self:flex-start;background:transparent;}
  .msg-body{font-size:14px;line-height:1.5;white-space:pre-wrap;}
  .msg-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--slate);margin-top:4px;}
  .msg-composer{display:flex;gap:10px;margin-top:16px;align-items:flex-end;}
  .msg-composer textarea{flex:1;min-height:60px;background:var(--ink-800);border:1px solid var(--ink-line);color:var(--paper);border-radius:8px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;resize:vertical;}
  @media (max-width:700px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .user-table thead{display:none;}
    .user-table tr{display:block;border-bottom:1px solid var(--ink-line);padding:10px 0;}
    .user-table td{display:block;border-bottom:none;padding:4px 0;}
  }
  .panel label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--slate);margin-bottom:6px;}
  .field{margin-bottom:18px;}
  .field input[type=text]{width:100%;font-size:15px;padding:10px 12px;}
  .field-row{display:flex;gap:16px;flex-wrap:wrap;}
  .field-row .field{flex:1;min-width:180px;}
  .field select{width:100%;background:var(--ink-900);border:1px solid var(--ink-line);color:var(--paper);border-radius:6px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;outline:none;}

  .category-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .category-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold);border:1px solid var(--ink-line);border-radius:20px;padding:3px 10px;}
  .category-tag-sub{color:var(--slate);}
  .feed-filters{display:flex;gap:8px;padding:0 16px 12px;flex-wrap:wrap;border-bottom:1px solid var(--ink-line);background:var(--ink-900);}
  .filter-select{background:var(--ink-800);border:1px solid var(--ink-line);color:var(--paper);border-radius:6px;padding:6px 8px;font-family:'Inter',sans-serif;font-size:12px;flex:1;min-width:110px;}
  .row{display:flex;}
  .category-pill-list{display:flex;flex-wrap:wrap;gap:8px;}
  .category-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:20px;padding:5px 6px 5px 12px;}
  .category-pill-remove{color:var(--rust);text-decoration:none;font-size:15px;line-height:1;padding:0 6px;}
  .category-pill-remove:hover{color:var(--paper);}
  textarea{width:100%;min-height:220px;resize:vertical;background:var(--ink-900);border:1px solid var(--ink-line);color:var(--paper);border-radius:6px;padding:12px;font-family:'Inter',sans-serif;font-size:15px;line-height:1.6;outline:none;}
  textarea:focus{border-color:var(--gold);}
  .submit-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:16px;flex-wrap:wrap;}
  .field-note{font-size:12px;color:var(--slate);}
  .review-note-field{margin:16px 0;}
  .review-note-field label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--slate);margin-bottom:6px;}
  .review-note-field textarea{width:100%;min-height:70px;background:var(--ink-900);border:1px solid var(--ink-line);color:var(--paper);border-radius:6px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:13px;resize:vertical;box-sizing:border-box;}
  .review-note-box{margin-top:14px;padding:12px 16px;border-left:2px solid var(--gold);background:var(--ink-800);border-radius:0 6px 6px 0;font-size:14px;}
  .review-note-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;}
  .queue-item{background:var(--ink-800);border:1px solid var(--ink-line);border-radius:10px;padding:20px;margin-bottom:14px;}
  .queue-item h3{font-family:'Fraunces',serif;font-size:19px;margin:0 0 6px;font-weight:600;}
  .queue-actions{display:flex;gap:8px;margin-top:14px;}
  .locked-msg{padding:40px 0;text-align:center;color:var(--slate);font-size:14px;}
  .locked-msg .glyph{font-family:'Fraunces',serif;font-size:28px;color:var(--ink-line);margin-bottom:8px;}
  .banner-note{font-size:13px;border-radius:6px;padding:10px 12px;margin-bottom:18px;}
  @media(max-width:520px){
    .brand h1{font-size:30px;}
    .masthead-top{flex-direction:column;}
    .login-form{align-items:stretch;}
  }
  @media(max-width:760px){
    .split-detail{display:none;padding:20px 20px 60px;}
    .split.has-selection .split-list{display:none;}
    .split.has-selection .split-detail{display:block;}
    .back-link{display:inline-block;}
  }
</style>
</head>

  reviewGroupFilter: null,
  reviewNoteDraft: ""
};

function isEditor(){
  return !!state.session && state.session.user.email === EDITOR_EMAIL;
}
function isModerator(){
  return !!state.session && !!state.profile && state.profile.role === 'moderator';
}
// "Staff" = editor or moderator — everything a moderator can do, an
// editor can do too. Use isEditor() specifically only for things a
// moderator should NOT get (User Desk / profile management).
function isStaff(){
  return isEditor() || isModerator();
}

// Editors are never locked out by their own moderation actions — avoids
// a self-suspend/self-block accident bricking the only admin account.
function accountLocked(){
  if(isEditor()) return false;
  return !!state.profile && state.profile.status !== 'active';
}
function lockedMessage(){
  if(!state.profile) return "";
  if(state.profile.status === 'suspended'){
    const until = state.profile.suspended_until
      ? ` until ${fmtDate(state.profile.suspended_until)}`
      : '';
    return `Your account is suspended${until}. You can still read published articles, but you can't submit, comment, or react.`;
  }
  return "";
}

async function loadOwnProfile(){
  if(!state.session){
    state.profile = null;
    return;
  }
  const { data, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', state.session.user.id)
    .maybeSingle();

  if(error || !data){
    state.profile = null;
    return;
  }
  state.profile = data;

  // Revoked accounts ("blocked" in the DB) are force-signed-out on
  // every load, not just once. Since a static site with only the anon
  // key can't stop the sign-in call itself (that needs the service-role
  // Admin API), this is the closest equivalent to "can no longer sign
  // in": Supabase issues them a session, and we immediately kill it
  // again before they can do anything with it, every single time,
  // until an editor reinstates them.
  if(data.status === 'blocked'){
    await sb.auth.signOut();
    state.session = null;
    state.profile = null;
    state.err = "Your access has been revoked by the editor.";
  }
}

function displayName(){
  if(!state.session) return "";
  return state.session.user.user_metadata && state.session.user.user_metadata.full_name || "";
}
function initials(name){
  if(!name) return "?";
  const parts = name.trim().split(/\s+/);
  return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
}
function fmtDate(iso){
  return new Date(iso).toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'});
}
function escapeHtml(s){
  const d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}

async function sendMagicLink(){
  const email = state.loginEmail.trim().toLowerCase();
  if(!email || !email.includes("@")){
    state.err = "Enter a valid email.";
    render();
    return;
  }
  state.err = "";
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.origin + window.location.pathname }
  });
  if(error){
    state.err = error.message;
  } else {
    state.magicLinkSent = true;
  }
  render();
}

function setAuthMode(mode){
  state.authMode = mode;
  state.err = "";
  state.resetSent = false;
  render();
}

async function signInWithPassword(){
  const email = state.loginEmail.trim().toLowerCase();
  const password = state.loginPassword;
  if(!email || !email.includes("@")){
    state.err = "Enter a valid email.";
    render();
    return;
  }
  if(!password){
    state.err = "Enter your password.";
    render();
    return;
  }
  state.err = "";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    state.err = error.message;
    render();
  }
  // On success, onAuthStateChange handles the redraw.
}

async function signUpWithPassword(){
  const email = state.loginEmail.trim().toLowerCase();
  const password = state.loginPassword;
  if(!email || !email.includes("@")){
    state.err = "Enter a valid email.";
    render();
    return;
  }
  if(!password || password.length < 6){
    state.err = "Choose a password with at least 6 characters.";
    render();
    return;
  }
  state.err = "";
  const { data, error } = await sb.auth.signUp({
    email,
    password,
    options: { emailRedirectTo: window.location.origin + window.location.pathname }
  });
  if(error){
    state.err = error.message;
    render();
    return;
  }
  if(data.session){
    // Email confirmation is off; signed in immediately, onAuthStateChange handles redraw.
    return;
  }
  state.err = "";
  state.magicLinkSent = true; // reuse the "check your inbox" notice for the confirmation email
  render();
}

async function sendPasswordReset(){
  const email = state.loginEmail.trim().toLowerCase();
  if(!email || !email.includes("@")){
    state.err = "Enter your email above first.";
    render();
    return;
  }
  state.err = "";
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });
  if(error){
    state.err = error.message;
  } else {
    state.resetSent = true;
  }
  render();
}

function toggleSetPassword(){
  state.showPasswordSet = !state.showPasswordSet;
  state.passwordDraft = "";
  state.passwordSaved = false;
  state.err = "";
  render();
}

async function savePassword(){
  const password = state.passwordDraft;
  if(!password || password.length < 6){
    state.err = "Choose a password with at least 6 characters.";
    render();
    return;
  }
  state.err = "";
  const { error } = await sb.auth.updateUser({ password });
  if(error){
    state.err = error.message;
  } else {
    state.passwordSaved = true;
    state.passwordDraft = "";
  }
  render();
}

async function saveName(){
  const name = state.nameDraft.trim();
  if(!name){
    state.err = "Enter a name for your byline.";
    render();
    return;
  }
  state.err = "";
  const { error } = await sb.auth.updateUser({ data: { full_name: name } });
  if(error){
    state.err = error.message;
  } else {
    await sb.auth.refreshSession();
    if(state.session){
      await sb.from('profiles').update({ display_name: name }).eq('id', state.session.user.id);
      state.profile = { ...(state.profile || {}), display_name: name };

async function handleSignOut(){
  await sb.auth.signOut();
  state.session = null;
  state.view = "feed";
  state.loginEmail = "";
  state.loginPassword = "";
  state.magicLinkSent = false;
  state.resetSent = false;
  state.showPasswordSet = false;
  state.passwordDraft = "";
  state.passwordSaved = false;
  state.nameDraft = "";
  state.submitTitle = "";
  state.submitBody = "";
  state.editingArticleId = null;
  state.draftSaved = false;
  state.selectedId = null;
  state.likeCount = 0;
  state.userLiked = false;
  state.comments = [];
  state.commentDraft = "";
  state.replyTargetId = null;
  state.replyDrafts = {};

async function loadArticles(){
  let query = sb.from('articles').select('*').order('created_at', { ascending: false });
  const { data, error } = await query;
  if(!error){
    state.articles = data || [];
  }
}

async function saveDraft(){
  if(accountLocked()){
    state.err = lockedMessage();
    render();
    return;
  }
  const title = state.submitTitle.trim();
  const body = state.submitBody.trim();
  if(!title && !body){
    state.err = "Write something before saving a draft.";
    render();
    return;
  }
  state.err = "";
  const categoryPatch = {
    category_id: state.submitCategoryId || null,
    subcategory_id: state.submitSubcategoryId || null
  };
  if(state.editingArticleId){
    const { error } = await sb.from('articles')
      .update({ title, body, ...categoryPatch })
      .eq('id', state.editingArticleId);
    if(error){
      state.err = error.message;
      render();
      return;
    }
  } else {
    const { data, error } = await sb.from('articles')
      .insert({
        title,
        body,
        author_email: state.session.user.email,
        author_name: displayName(),
        status: 'draft',
        ...categoryPatch
      })
      .select()
      .single();
    if(error){
      state.err = error.message;
      render();
      return;
    }
    state.editingArticleId = data.id;
  }
  state.draftSaved = true;
  await loadArticles();
  render();
}

function newSubmission(){
  state.editingArticleId = null;
  state.submitTitle = "";
  state.submitBody = "";
  state.submitCategoryId = "";
  state.submitSubcategoryId = "";
  state.draftSaved = false;
  state.err = "";
  render();
}

function editDraft(id){
  const a = state.articles.find(x => x.id === id);
  if(!a) return;
  state.editingArticleId = id;
  state.submitTitle = a.title;
  state.submitBody = a.body;
  state.submitCategoryId = a.category_id || "";
  state.submitSubcategoryId = a.subcategory_id || "";
  state.draftSaved = false;
  state.selectedId = null;
  state.err = "";
  state.view = "submit";
  render();
}

async function deleteDraft(id){
  const { error } = await sb.from('articles').delete().eq('id', id);
  if(error){
    state.err = error.message;
  }
  if(state.editingArticleId === id) newSubmission();
  state.selectedId = null;
  await loadArticles();
  render();
}

async function submitArticle(){
  if(accountLocked()){
    state.err = lockedMessage();
    render();
    return;
  }
  const title = state.submitTitle.trim();
  const body = state.submitBody.trim();
  if(!title || !body){
    state.err = "Both a title and article text are required.";
    render();
    return;
  }
  state.err = "";
  const categoryPatch = {
    category_id: state.submitCategoryId || null,
    subcategory_id: state.submitSubcategoryId || null
  };
  let error;
  if(state.editingArticleId){
    const patch = { title, body, status: isStaff() ? 'approved' : 'pending', ...categoryPatch };
    if(isStaff()) patch.approved_at = new Date().toISOString();
    ({ error } = await sb.from('articles').update(patch).eq('id', state.editingArticleId));
  } else {
    ({ error } = await sb.from('articles').insert({
      title,
      body,
      author_email: state.session.user.email,
      author_name: displayName(),
      ...categoryPatch
    }));
  }
  if(error){
    state.err = error.message;
    render();
    return;
  }
  state.submitTitle = "";
  state.submitBody = "";
  state.submitCategoryId = "";
  state.submitSubcategoryId = "";
  state.editingArticleId = null;
  state.draftSaved = false;
  state.selectedId = null;
  state.view = isStaff() ? "feed" : "desk";
  await loadArticles();
  render();
}

async function saveArticleEdit(){

    title,

    category_id: state.submitCategoryId || null,

  }).eq('id', state.editingArticleId);

    render();
    return;

  state.submitTitle = "";
  state.submitBody = "";
  state.submitCategoryId = "";
  state.submitSubcategoryId = "";
  state.editingArticleId = null;

}

async function setStatus(id, status){
  const note = (state.reviewNoteDraft || '').trim();
  const patch = { status };
  if(status === 'approved') patch.approved_at = new Date().toISOString();
  if(note) patch.review_note = note;
  const { error } = await sb.from('articles').update(patch).eq('id', id);
  if(error){
    state.err = error.message;
  }

  state.selectedId = null;

  render();

// ===== User management dashboard (editor only) =====

async function loadUsers(){
  if(!isEditor()) return;
  const { data, error } = await sb
    .from('profiles')
    .select('*')
    .order('created_at', { ascending: false });
  if(error){
    state.err = error.message;
    return;
  }
  state.users = data || [];
  state.usersLoaded = true;
}

function getFilteredUsers(){
  const q = state.userSearchTerm.trim().toLowerCase();
  return state.users.filter(u => {
    if(state.userStatusFilter !== 'all' && u.status !== state.userStatusFilter) return false;
    if(!q) return true;
    const haystack = [u.email, u.display_name].join(' ').toLowerCase();
    return haystack.includes(q);
  });
}

function toggleSuspendMenu(userId){
  state.suspendMenuFor = state.suspendMenuFor === userId ? null : userId;
  render();
}

async function suspendUser(userId, hours){
  const suspended_until = hours ? new Date(Date.now() + hours * 3600 * 1000).toISOString() : null;
  const { error } = await sb.from('profiles')
    .update({ status: 'suspended', suspended_until })
    .eq('id', userId);
  if(error){ state.err = error.message; }
  state.suspendMenuFor = null;
  await loadUsers();
  render();
}

async function reinstateUser(userId){
  const { error } = await sb.from('profiles')
    .update({ status: 'active', suspended_until: null, force_logout_at: null })
    .eq('id', userId);
  if(error){ state.err = error.message; }
  state.suspendMenuFor = null;
  await loadUsers();
  render();
}

// "Revoke access" — the hard action. Sets status to 'blocked' (kept as
// the DB value for backward compatibility with existing policies) and
// stamps force_logout_at so any currently-open session is kicked out
// immediately. loadOwnProfile() then force-signs-out on every future
// load while status stays 'blocked' — the closest we can get to
// "can no longer sign in" without a service-role Admin API.
async function revokeUser(userId){
  const { error } = await sb.from('profiles')
    .update({ status: 'blocked', suspended_until: null, force_logout_at: new Date().toISOString() })
    .eq('id', userId);
  if(error){ state.err = error.message; }
  state.suspendMenuFor = null;
  await loadUsers();
  render();
}

// Only the true editor can change this (enforced both by not showing
// the button anywhere else, and — the real boundary — the DB trigger
// that clamps role/status changes back unless the caller is the editor).
async function setUserRole(userId, role){
  const { error } = await sb.from('profiles').update({ role }).eq('id', userId);
  if(error){ state.err = error.message; }
  await loadUsers();
  render();
}

function userRoleBadge(role){
  if(role === 'moderator') return `<span class="stamp-mini pending">Moderator</span>`;
  return `<span class="hint" style="margin:0;">Contributor</span>`;
}

function userStatusBadge(status){
  const label = status === 'active' ? 'Active' : status === 'suspended' ? 'Suspended' : 'Revoked';
  const cls = status === 'active' ? 'approved' : status === 'suspended' ? 'pending' : 'rejected';
  return `<span class="stamp-mini ${cls}">${label}</span>`;
}

function userActionsHtml(u){
  if(u.email === EDITOR_EMAIL){
    return `<span class="hint" style="margin:0;">You (editor)</span>`;
  }
  const menuOpen = state.suspendMenuFor === u.id;
  const buttons = [];
  buttons.push(`<button class="btn btn-ghost btn-small" onclick="messageUser('${u.id}')">Message</button>`);

  if(u.role === 'moderator'){
    buttons.push(`<button class="btn btn-ghost btn-small" onclick="setUserRole('${u.id}','user')">Remove moderator</button>`);
  } else {
    buttons.push(`<button class="btn btn-ghost btn-small" onclick="setUserRole('${u.id}','moderator')">Make moderator</button>`);
  }

  if(u.status !== 'active'){
    buttons.push(`<button class="btn btn-ghost btn-small" onclick="reinstateUser('${u.id}')">Reinstate</button>`);
  }
  if(u.status !== 'suspended'){
    buttons.push(`<button class="btn btn-ghost btn-small" onclick="toggleSuspendMenu('${u.id}')">Suspend${menuOpen ? ' ▴' : ' ▾'}</button>`);
  }
  if(u.status !== 'blocked'){
    buttons.push(`<button class="btn btn-rust btn-small" onclick="revokeUser('${u.id}')" title="Signs them out immediately and blocks sign-in until reinstated">Revoke access</button>`);
  }

  const menu = menuOpen ? `
    <div class="suspend-menu">
      <button class="btn btn-ghost btn-small" onclick="suspendUser('${u.id}', 24)">24 hours</button>
      <button class="btn btn-ghost btn-small" onclick="suspendUser('${u.id}', 24*7)">7 days</button>
      <button class="btn btn-ghost btn-small" onclick="suspendUser('${u.id}', 24*30)">30 days</button>
      <button class="btn btn-ghost btn-small" onclick="suspendUser('${u.id}', null)">Indefinitely</button>
    </div>` : '';

  return `<div class="user-actions">${buttons.join('')}</div>${menu}`;
}

function renderUsersDashboard(main){
  const users = state.users;
  const total = users.length;
  const activeCount = users.filter(u => u.status === 'active').length;
  const suspendedCount = users.filter(u => u.status === 'suspended').length;
  const blockedCount = users.filter(u => u.status === 'blocked').length;

  const draftCount = state.articles.filter(a => a.status === 'draft').length;
  const pendingCount = state.articles.filter(a => a.status === 'pending').length;
  const approvedCount = state.articles.filter(a => a.status === 'approved').length;
  const rejectedCount = state.articles.filter(a => a.status === 'rejected').length;

  const stat = (label, value) => `
    <div class="stat-card">
      <div class="stat-value">${value}</div>
      <div class="stat-label">${label}</div>
    </div>`;

  const filtered = getFilteredUsers();
  const rows = filtered.length
    ? filtered.map(u => `
      <tr>
        <td>
          <div style="font-weight:500;">${escapeHtml(u.display_name || '(no name yet)')}</div>
          <div class="hint" style="text-align:left;margin:0;">${escapeHtml(u.email)}</div>
        </td>
        <td>${fmtDate(u.created_at)}</td>
        <td>${userStatusBadge(u.status)}</td>
        <td>${userRoleBadge(u.role)}</td>
        <td>${userActionsHtml(u)}</td>
      </tr>`).join('')
    : `<tr><td colspan="5" class="hint" style="text-align:center;padding:24px 0;">No users match.</td></tr>`;

  const categoryPillHtml = (c) => `
    <span class="category-pill">
      ${escapeHtml(c.name)}
      <a href="javascript:void(0)" onclick="deleteCategory('${c.id}')" title="Remove category" class="category-pill-remove">×</a>
    </span>`;
  const subcategoryPillHtml = (s) => `
    <span class="category-pill">
      ${escapeHtml(s.name)}
      <a href="javascript:void(0)" onclick="deleteSubcategory('${s.id}')" title="Remove topic" class="category-pill-remove">×</a>
    </span>`;

  main.innerHTML = `
    <div class="scroll-panel"><div class="narrow">

      <div class="stat-grid">
        ${stat('Total users', total)}
        ${stat('Active', activeCount)}
        ${stat('Suspended', suspendedCount)}
        ${stat('Revoked', blockedCount)}
        ${stat('Draft articles', draftCount)}
        ${stat('Pending review', pendingCount)}
        ${stat('Published', approvedCount)}
        ${stat('Rejected', rejectedCount)}
      </div>

      <div class="panel" style="margin-top:20px;">
        <div class="feed-tools" style="margin-bottom:14px;">
          <div class="feed-search-wrap" style="flex:1;">
            <input type="search" id="userSearch" class="feed-search" value="${escapeHtml(state.userSearchTerm)}" placeholder="Search by name or email...">
          </div>
          <select id="userStatusFilter" style="background:var(--ink-800);border:1px solid var(--ink-line);color:var(--paper);border-radius:6px;padding:8px 10px;font-family:'Inter',sans-serif;font-size:13px;">
            <option value="all" ${state.userStatusFilter==='all'?'selected':''}>All statuses</option>
            <option value="active" ${state.userStatusFilter==='active'?'selected':''}>Active</option>
            <option value="suspended" ${state.userStatusFilter==='suspended'?'selected':''}>Suspended</option>
            <option value="blocked" ${state.userStatusFilter==='blocked'?'selected':''}>Revoked</option>
          </select>
        </div>
        <table class="user-table">
          <thead><tr><th>User</th><th>Joined</th><th>Status</th><th>Role</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>

      <div class="panel" style="margin-top:20px;">
        <div class="field-note" style="margin-bottom:10px;text-transform:uppercase;letter-spacing:0.08em;">Categories</div>
        <div class="category-pill-list">
          ${state.categories.length ? state.categories.map(categoryPillHtml).join('') : `<span class="hint">None yet.</span>`}
        </div>
        <div class="row" style="margin-top:12px;gap:8px;">
          <input type="text" id="newCategoryName" placeholder="New category, e.g. Apologetics" style="flex:1;">
          <button class="btn btn-ghost btn-small" onclick="addCategory()">Add</button>
        </div>

        <div class="field-note" style="margin:20px 0 10px;text-transform:uppercase;letter-spacing:0.08em;">Topics (subcategories)</div>
        <div class="category-pill-list">
          ${state.subcategories.length ? state.subcategories.map(subcategoryPillHtml).join('') : `<span class="hint">None yet.</span>`}
        </div>
        <div class="row" style="margin-top:12px;gap:8px;">
          <input type="text" id="newSubcategoryName" placeholder="New topic, e.g. Prayer & Fasting" style="flex:1;">
          <button class="btn btn-ghost btn-small" onclick="addSubcategory()">Add</button>
        </div>
        <div class="hint" style="text-align:left;margin-top:12px;">These power the Category/Topic dropdowns on Submit and the filters on the Feed — add as many as you like, any time, from right here.</div>
      </div>

  document.getElementById('userSearch').oninput = e => { state.userSearchTerm = e.target.value; renderUsersDashboard(main); };
  document.getElementById('userStatusFilter').onchange = e => { state.userStatusFilter = e.target.value; renderUsersDashboard(main); };
  document.getElementById('newCategoryName').onkeydown = e => { if(e.key==='Enter') addCategory(); };
  document.getElementById('newSubcategoryName').onkeydown = e => { if(e.key==='Enter') addSubcategory(); };

// ===== Internal messaging (editor <-> contributor, one thread each) =====

async function loadUnreadTotal(){
  if(!state.session){ state.unreadTotal = 0; return; }
  const { count, error } = await sb
    .from('messages')
    .select('id', { count: 'exact', head: true })
    .is('read_at', null)
    .neq('sender_id', state.session.user.id);
  if(!error) state.unreadTotal = count || 0;
}

async function loadThreads(){
  if(!isStaff()) return;
  const { data, error } = await sb
    .from('messages')
    .select('*')
    .order('created_at', { ascending: false });
  if(error){ state.err = error.message; return; }

  const byContributor = new Map();
  (data || []).forEach(m => {
    if(!byContributor.has(m.contributor_id)){
      byContributor.set(m.contributor_id, {
        id: m.contributor_id,
        lastBody: m.body,
        lastAt: m.created_at,
        unread: 0
      });
    }
    const t = byContributor.get(m.contributor_id);
    if(m.sender_id !== state.session.user.id && !m.read_at) t.unread++;
  });

  const ids = Array.from(byContributor.keys());
  if(ids.length){
    const { data: profiles } = await sb.from('profiles').select('id,email,display_name').in('id', ids);
    (profiles || []).forEach(p => {
      const t = byContributor.get(p.id);
      if(t){ t.email = p.email; t.name = p.display_name || p.email; }
    });
  }

  state.threads = Array.from(byContributor.values())
    .sort((a, b) => new Date(b.lastAt) - new Date(a.lastAt));
  state.threadsLoaded = true;
}

async function loadThread(contributorId){
  if(!contributorId || !state.session) return;
  const { data, error } = await sb
    .from('messages')
    .select('*')
    .eq('contributor_id', contributorId)
    .order('created_at', { ascending: true });
  if(error){ state.err = error.message; return; }
  state.messages = data || [];

  const selfId = state.session.user.id;
  const unreadIds = state.messages.filter(m => m.sender_id !== selfId && !m.read_at).map(m => m.id);
  if(unreadIds.length){
    const nowIso = new Date().toISOString();
    await sb.from('messages').update({ read_at: nowIso }).in('id', unreadIds);
    state.messages.forEach(m => { if(unreadIds.includes(m.id)) m.read_at = nowIso; });
  }
  await loadUnreadTotal();
  if(isStaff()) await loadThreads();
}

function selectThread(contributorId){
  state.selectedThreadId = contributorId;
  render();
  loadThread(contributorId).then(render);
}

function messageUser(contributorId){
  state.view = 'messages';
  loadThreads().then(() => selectThread(contributorId));
}

function clearThreadSelection(){
  state.selectedThreadId = null;
  render();
}

async function sendMessage(){
  if(!state.session) return;
  const body = (state.messageDraft || "").trim();
  if(!body) return;

  const selfId = state.session.user.id;
  const contributorId = isStaff() ? state.selectedThreadId : selfId;
  if(!contributorId) return;

  state.messageDraft = "";
  const { error } = await sb.from('messages').insert({
    contributor_id: contributorId,
    sender_id: selfId,
    body
  });
  if(error){
    state.err = error.message;
    render();
    return;
  }
  await loadThread(contributorId);
  render();
}

function stampHtml(status){
  const label = status === "approved" ? "Approved" : status === "pending" ? "Pending" : "Declined";
  return `<div class="stamp ${status}">${label}</div>`;
}

function stampMini(status){
  const label = status === "approved" ? "Published" : status === "pending" ? "Pending" : status === "draft" ? "Draft" : "Declined";
  return `<span class="stamp-mini ${status}">${label}</span>`;
}

function slugify(str){
  return (str || '')
    .toString()
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 60);
}

function shortCode(id){
  return (id || '').replace(/-/g, '').slice(0, 8);
}

function articleSlug(a){
  const parts = [slugify(a.author_name || a.author_email), slugify(a.title)].filter(Boolean);
  return parts.join('-') + (parts.length ? '-' : '') + shortCode(a.id);
}

function selectArticle(id){
  state.selectedId = id;
  state.likeCount = 0;
  state.userLiked = false;
  state.comments = [];
  state.commentDraft = "";
  state.replyTargetId = null;
  state.replyDrafts = {};
  state.reviewNoteDraft = "";
  state.err = "";
  render();
  if(state.view === 'feed'){
    const a = state.articles.find(x => x.id === id);
    const slug = a ? articleSlug(a) : id;
    if(window.location.hash !== '#article-' + slug) window.location.hash = 'article-' + slug;
    loadArticleExtras(id);
  }
}

function clearSelection(){
  state.selectedId = null;
  state.err = "";
  if(state.view === 'feed' && window.location.hash){
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }
  render();
}

function openArticleFromHash(){
  const m = window.location.hash.match(/^#article-(.+)$/);
  if(!m) return;
  const raw = m[1];
  const code = raw.split('-').pop();
  const a = state.articles.find(x => shortCode(x.id) === code) || state.articles.find(x => x.id === raw);
  if(!a) return;
  if(state.selectedId === a.id && state.view === 'feed') return;
  state.view = 'feed';
  state.selectedId = a.id;
  state.likeCount = 0;
  state.userLiked = false;
  state.comments = [];
  state.commentDraft = "";
  render();
  loadArticleExtras(a.id);
}

async function loadArticleExtras(articleId){
  const [likesRes, commentsRes] = await Promise.all([
    sb.from('article_likes').select('user_email').eq('article_id', articleId),
    sb.from('article_comments').select('*').eq('article_id', articleId).order('created_at', { ascending: true })
  ]);
  const likeRows = likesRes.data || [];
  state.likeCount = likeRows.length;
  state.userLiked = state.session ? likeRows.some(r => r.user_email === state.session.user.email) : false;
  state.comments = commentsRes.data || [];
  render();
  loadReactionCounts(articleId);
  setupReactionHandlers();
  const { data: { user } } = await sb.auth.getUser();
  loadUserReaction(articleId, user);
}

async function loadReactionCounts(articleId) {
  // NOTE: PostgREST/supabase-js has no .group() aggregate method, so we pull
  // the raw rows for this article and tally reaction_type counts client-side.
  const { data, error } = await sb
    .from('reactions')
    .select('reaction_type')
    .eq('article_id', articleId);

  if (error) {
    console.error('Error loading reactions:', error);
    return;
  }

  const counts = {};
  (data || []).forEach(row => {
    counts[row.reaction_type] = (counts[row.reaction_type] || 0) + 1;
  });

  document.querySelectorAll('#reaction-bar .reaction-btn').forEach(btn => {
    const span = btn.querySelector('span');
    if (span) span.textContent = counts[btn.dataset.type] || 0;
  });
}


// Delegated handler: bound once, so it keeps working even after the
// #reaction-bar DOM gets replaced by a re-render (e.g. the realtime
// 'articles-changes' subscription firing render() for anyone's edit).
let reactionHandlerBound = false;
function setupReactionHandlers(){
  if(reactionHandlerBound) return;
  reactionHandlerBound = true;

  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('#reaction-bar .reaction-btn[data-type]');
    if(!btn) return;

    const articleId = state.selectedId;
    if(!articleId) return;

    if(!state.session){
      state.err = "Sign in above to react.";
      render();
      return;
    }

    if(accountLocked()){
      state.err = lockedMessage();
      render();
      return;
    }

    const { data: { user } } = await sb.auth.getUser();
    if(!user) return;

    const reactionType = btn.dataset.type;
    highlightUserReaction(reactionType);

    const { error } = await sb
      .from('reactions')
      .upsert({
        article_id: articleId,
        user_id: user.id,
        reaction_type: reactionType
      }, { onConflict: 'article_id,user_id' });

    if(error){
      console.error('Error saving reaction:', error);
      state.err = "Couldn't save that reaction — try again.";
      render();
      return;
    }

    loadReactionCounts(articleId);
  });
}

async function loadUserReaction(articleId, user){
  if(!user){
    highlightUserReaction(null);
    return;
  }

  const { data, error } = await sb
    .from('reactions')
    .select('reaction_type')
    .eq('article_id', articleId)
    .eq('user_id', user.id)
    .maybeSingle();

  if(error){
    highlightUserReaction(null);
    return;
  }

  highlightUserReaction(data ? data.reaction_type : null);
}

function highlightUserReaction(reactionType){
  document.querySelectorAll('#reaction-bar .reaction-btn')
    .forEach(btn => btn.classList.toggle('active', btn.dataset.type === reactionType));
}

async function toggleLike(articleId){
  if(!state.session){
    state.err = "Sign in above to like this article.";
    render();
    return;
  }
  const email = state.session.user.email;
  if(state.userLiked){
    state.userLiked = false;
    state.likeCount = Math.max(0, state.likeCount - 1);
    render();
    await sb.from('article_likes').delete().eq('article_id', articleId).eq('user_email', email);
  } else {
    state.userLiked = true;
    state.likeCount += 1;
    render();
    await sb.from('article_likes').insert({ article_id: articleId, user_email: email });
  }
  await loadArticleExtras(articleId);
}

async function shareArticle(id){
  const a = state.articles.find(x => x.id === id);
  const slug = a ? articleSlug(a) : id;
  // Share the pre-rendered preview page (real og:title/description that
  // link-preview crawlers can read), not the bare #hash URL — crawlers
  // never see anything after '#', and never run JS to find out.
  const basePath = window.location.pathname.replace(/[^/]*$/, '');
  const url = window.location.origin + basePath + 'a/' + slug + '.html';
  if(navigator.share){
    try { await navigator.share({ title: a ? a.title : 'Article', url }); }
    catch(e) { /* user cancelled — ignore */ }
    return;
  }
  try {
    await navigator.clipboard.writeText(url);
    state.shareCopied = id;
    render();
    setTimeout(() => { if(state.shareCopied === id){ state.shareCopied = null; render(); } }, 2000);
  } catch(e) {
    state.err = "Couldn't copy the link — copy it from the address bar instead.";
    render();
  }
}

async function postComment(articleId){
  if(!state.session){
    state.err = "Sign in above to comment.";
    render();
    return;
  }
  if(accountLocked()){
    state.err = lockedMessage();
    render();
    return;
  }
  const body = (state.commentDraft || "").trim();
  if(!body){
    state.err = "Write something before posting.";
    render();
    return;
  }
  state.err = "";
  const { error } = await sb.from('article_comments').insert({
    article_id: articleId,
    author_email: state.session.user.email,
    author_name: displayName(),
    body
  });
  if(error){
    state.err = error.message;
    render();
    return;
  }
  state.commentDraft = "";
  await loadArticleExtras(articleId);
}

async function deleteComment(commentId, articleId){
  const { error } = await sb.from('article_comments').delete().eq('id', commentId);
  if(error){ state.err = error.message; }
  await loadArticleExtras(articleId);
}

function startReply(commentId){
  const comment = state.comments.find(c => c.id === commentId);
  if(!comment){ return; }
  const name = comment.author_name || comment.author_email || 'user';
  const tagged = '@' + name + ' ';
  state.replyTargetId = comment.id;
  state.replyDrafts[comment.id] = state.replyDrafts[comment.id] && state.replyDrafts[comment.id].trim() ? state.replyDrafts[comment.id] : tagged;
  state.err = "";
  render();
  const input = document.getElementById('replyInput-' + comment.id);
  if(input){
    input.focus();
    const target = tagged;
    const open = input.value.startsWith(target) ? target.length : 0;
    const end = input.value.length;
    input.setSelectionRange(open, end);
  }
}

function cancelReply(){
  state.replyTargetId = null;
  render();
}

async function postReply(articleId, commentId){
  if(!state.session){
    state.err = "Sign in above to reply.";
    render();
    return;
  }
  if(accountLocked()){
    state.err = lockedMessage();
    render();
    return;
  }
  const parent = state.comments.find(c => c.id === commentId);
  if(!parent){
    state.err = "That comment is no longer available.";
    render();
    return;
  }
  const raw = (state.replyDrafts[commentId] || "").trim();
  if(!raw){
    state.err = "Write a reply before posting.";
    render();
    return;
  }
  const mention = '@' + (parent.author_name || parent.author_email || 'user');
  const body = raw.startsWith(mention) ? raw : mention + ' ' + raw;
  state.err = "";
  const { error } = await sb.from('article_comments').insert({
    article_id: articleId,
    author_email: state.session.user.email,
    author_name: displayName(),
    body
  });
  if(error){
    state.err = error.message;
    render();
    return;
  }
  state.replyDrafts[commentId] = "";
  state.replyTargetId = null;
  await loadArticleExtras(articleId);
}

function renderSplit(main, items, opts){
  let listBody;
  if(opts.groupBy){
    const groups = new Map();
    items.forEach(a => {
      const key = opts.groupBy(a);
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(a);
    });
    const order = opts.groupOrder || Array.from(groups.keys());
    const activeGroup = opts.activeGroup || null;
    listBody = order
      .filter(k => groups.has(k) && groups.get(k).length)
      .map(k => {
        const groupItems = groups.get(k);
        const label = (opts.groupLabels && opts.groupLabels[k]) || k;
        const isActive = activeGroup === k;
        const showRows = !activeGroup || isActive;
        const clickAttr = opts.onGroupClick ? ` onclick="${opts.onGroupClick(k)}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${opts.onGroupClick(k)};}" role="button" tabindex="0"` : '';
        const headerClass = `list-group-header${opts.onGroupClick ? ' list-group-header-clickable' : ''}${isActive ? ' active' : ''}`;
        return `<div class="${headerClass}"${clickAttr}>${escapeHtml(label)} (${groupItems.length})</div>` +
          (showRows ? groupItems.map(a => opts.rowHtml(a, a.id === state.selectedId)).join('') : '');
      }).join('');
    if(!listBody){
      listBody = `<div class="empty"><div class="glyph">†</div><p>${opts.emptyTitle}</p>${opts.emptySub ? `<p>${opts.emptySub}</p>` : ''}</div>`;
    }
  } else {
    listBody = items.length
      ? items.map(a => opts.rowHtml(a, a.id === state.selectedId)).join('')
      : `<div class="empty"><div class="glyph">†</div><p>${opts.emptyTitle}</p>${opts.emptySub ? `<p>${opts.emptySub}</p>` : ''}</div>`;
  }

  const selected = items.find(a => a.id === state.selectedId) || null;
  const defaultWelcome = `
        <p class="welcome-heading">The Flint<br>Welcome message</p>
        <p class="welcome-copy">The Flint is an apostolic oneness articles‑of‑faith publishing site dedicated to proclaiming the revelation of the One God. This platform exists to strengthen believers, equip ministers, and preserve the doctrine handed down by the apostles. Every article published here aims to uphold biblical truth with clarity, conviction, and reverence.</p>
        <p class="welcome-copy">At the heart of our faith is the declaration that Jesus Christ is the one God manifest in the flesh. He is the fullness of the Godhead bodily, the visible image of the invisible God, the Father revealed to humanity through the Son. This site stands firmly upon that foundation and invites all who share this conviction to contribute to the growing library of teaching, study, and proclamation.</p>
        <p class="welcome-copy">Oneness believers may create an account to submit their articles. All submissions are reviewed and approved by the editor before publication. Only articles that uphold apostolic doctrine and sound biblical teaching will be published.</p>
        <p class="welcome-copy">The Flint is also a community. Readers can react to articles, leave comments, and share teachings across social media platforms. Every article becomes a conversation — a place where believers can encourage one another, ask questions, and grow deeper in the truth of the One God.</p>
        <p class="welcome-copy">As you explore the articles on the left, may every page deepen your understanding of Jesus Christ, our Lord and Savior, and strengthen your walk in the apostolic faith.</p>
        <p class="welcome-copy" style="margin-bottom:0;">Select an article on the left to begin reading.</p>`;
  const detailHtml = selected
    ? `<a class="back-link" onclick="clearSelection();return false;" href="#">← Back to list</a>${opts.detailHtml(selected)}`
    : `<div class="detail-empty"><div class="glyph">†</div><div class="welcome-message">${opts.welcomeHtml || defaultWelcome}</div></div>`;

  const searchHtml = opts.search ? `
    <div class="feed-tools">
      <div class="feed-search-wrap">
        <input type="search" id="feedSearch" class="feed-search" value="${escapeHtml(state.searchTerm)}" placeholder="Search published articles...">
      </div>
      <button type="button" id="clearFeedSearch" class="clear-search" ${(state.searchTerm || state.categoryFilter || state.subcategoryFilter || state.authorFilter) ? '' : 'disabled'}>Clear</button>
    </div>
    <div class="feed-filters">
      <select id="categoryFilter" class="filter-select">
        <option value="">All categories</option>
        ${state.categories.map(c => `<option value="${c.id}" ${state.categoryFilter===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
      </select>
      <select id="subcategoryFilter" class="filter-select">
        <option value="">All topics</option>
        ${state.subcategories.map(s => `<option value="${s.id}" ${state.subcategoryFilter===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}
      </select>
      <select id="authorFilter" class="filter-select">
        <option value="">All authors</option>
        ${getFeedAuthors().map(n => `<option value="${escapeHtml(n)}" ${state.authorFilter===n?'selected':''}>${escapeHtml(n)}</option>`).join('')}
      </select>
    </div>` : '';

  // Preserve scroll position across re-renders (e.g. posting a comment,
  // or simply selecting an article) — a fresh innerHTML rebuild resets
  // scrollTop on any brand-new DOM node, which otherwise looks like the
  // page jumping back to the top of the article or the list.
  const prevDetail = main.querySelector('.split-detail');
  const prevArticleId = prevDetail ? prevDetail.dataset.articleId : null;
  const prevDetailScrollTop = prevDetail ? prevDetail.scrollTop : 0;

  const prevList = main.querySelector('.split-list');
  const prevListScrollTop = prevList ? prevList.scrollTop : 0;

  main.innerHTML = `
    <div class="split ${state.selectedId ? 'has-selection' : ''}">
      <div class="split-list">${searchHtml}${listBody}</div>

  if(selected && prevArticleId === selected.id){
    const newDetail = main.querySelector('.split-detail');
    if(newDetail) newDetail.scrollTop = prevDetailScrollTop;
  }
  const newList = main.querySelector('.split-list');
  if(newList) newList.scrollTop = prevListScrollTop;

  if(opts.search){
    const feedSearch = document.getElementById('feedSearch');
    const clearFeedSearch = document.getElementById('clearFeedSearch');

    if(feedSearch){
      feedSearch.addEventListener('keydown', (event) => {

        state.categoryFilter = '';
        state.subcategoryFilter = '';
        state.authorFilter = '';
        render();

    const subcategoryFilterEl = document.getElementById('subcategoryFilter');
    if(subcategoryFilterEl) subcategoryFilterEl.onchange = e => { state.subcategoryFilter = e.target.value; render(); };

    const authorFilterEl = document.getElementById('authorFilter');
    if(authorFilterEl) authorFilterEl.onchange = e => { state.authorFilter = e.target.value; render(); };
  }
}

            <div class="comment-meta"><b>${escapeHtml(c.author_name || c.author_email)}</b> · ${fmtDate(c.created_at)}
              ${(state.session && (c.author_email === state.session.user.email || isStaff())) ? `<a href="javascript:void(0)" class="toggle-link" onclick="deleteComment('${c.id}','${a.id}');return false;">Delete</a>` : ''}
            </div>
            <div class="comment-body">${escapeHtml(c.body)}</div>
            ${canInteract ? `<div class="comment-actions"><a href="javascript:void(0)" class="toggle-link" onclick="startReply('${c.id}');return false;">Reply</a></div>` : ''}
            ${state.replyTargetId === c.id ? `
              <div class="comment-reply">
                <textarea id="replyInput-${c.id}" placeholder="Reply to ${escapeHtml(c.author_name || c.author_email)}..." style="margin-top:6px;">${escapeHtml(state.replyDrafts[c.id] || '@' + (c.author_name || c.author_email) + ' ')}</textarea>
                <div class="reply-actions">
                  <button class="btn btn-ghost btn-small" onclick="cancelReply()">Cancel</button>
                  <button class="btn btn-gold btn-small" onclick="postReply('${a.id}','${c.id}')">Post reply</button>
                </div>
              </div>` : ''}
          </div>`).join('')}
        ${canInteract ? `
          <div class="comment-form">
            <textarea id="commentDraft" placeholder="Add a comment...">${escapeHtml(state.commentDraft || '')}</textarea>
            <button class="btn btn-gold btn-small" onclick="postComment('${a.id}')">Post comment</button>
          </div>` : `<div class="hint" style="text-align:left;margin-top:10px;">Sign in above to like or comment.</div>`}
      </div>
    </article>`;
}

function deskDetailHtml(a){
  if(a.status === 'draft'){
    return `
      <article class="detail-article">
        <h2>${escapeHtml(a.title || "(untitled draft)")}</h2>
        <div class="byline">Draft · started ${fmtDate(a.created_at)}</div>
        ${categoryTagsHtml(a)}
        <div class="body-text" style="margin-top:18px;">${a.body ? escapeHtml(a.body) : '<em>No text yet.</em>'}</div>
        <div class="article-actions">
          <button class="btn btn-gold btn-small" onclick="editDraft('${a.id}')">Continue editing</button>
          <button class="btn btn-rust btn-small" onclick="deleteDraft('${a.id}')">Discard</button>
        </div>
      </article>`;
  }
  return `
    <article class="detail-article">
      <div class="article-head" style="margin-bottom:6px;">
        <h2 style="margin:0;">${escapeHtml(a.title)}</h2>
        ${stampHtml(a.status)}
      </div>
      <div class="byline">${fmtDate(a.created_at)}</div>
      ${categoryTagsHtml(a)}
      ${a.review_note ? `<div class="review-note-box"><div class="review-note-label">Note from the review${a.status === 'rejected' ? '' : ' — thanks!'}</div><div>${escapeHtml(a.review_note)}</div></div>` : ''}
      <div class="body-text" style="margin-top:18px;">${escapeHtml(a.body)}</div>
    </article>`;
}

function reviewDetailHtml(a){
  const actions = a.status === 'pending'
    ? `<div class="review-note-field">
         <label>Note to the author (optional)</label>
         <textarea id="reviewNoteDraft" placeholder="e.g. Great message — please add a Scripture citation for the second point before we can publish.">${escapeHtml(state.reviewNoteDraft || '')}</textarea>
       </div>
       <div class="article-actions">
         <button class="btn btn-gold" onclick="setStatus('${a.id}','approved')">Approve & publish</button>
         <button class="btn btn-rust" onclick="setStatus('${a.id}','rejected')">Decline</button>
       </div>`
    : a.status === 'approved'
      ? `<div class="article-actions">
           <button class="btn btn-ghost" onclick="editDraft('${a.id}')">Edit</button>
           <button class="btn btn-rust" onclick="setStatus('${a.id}','pending')">Unpublish</button>
         </div>`
      : '';
  const existingNote = a.review_note
    ? `<div class="review-note-box"><div class="review-note-label">Note left with this decision</div><div>${escapeHtml(a.review_note)}</div></div>`
    : '';
  return `
    <article class="detail-article">
      <div class="article-head" style="margin-bottom:6px;">
        <h2 style="margin:0;">${escapeHtml(a.title)}</h2>
        ${stampHtml(a.status)}
      </div>
      <div class="byline"><b>${escapeHtml(a.author_name || a.author_email)}</b> · ${fmtDate(a.created_at)}</div>
      ${categoryTagsHtml(a)}
      ${existingNote}
      <div class="body-text" style="margin-top:18px;">${escapeHtml(a.body)}</div>
      ${actions}
    </article>`;
}

function renderAuthBox(){
  const box = document.getElementById('authBox');
  if(!state.session){
    const tabs = `
      <div class="auth-tabs">
        <button class="auth-tab ${state.authMode==='link'?'active':''}" onclick="setAuthMode('link')">Email link</button>
        <button class="auth-tab ${state.authMode==='password'?'active':''}" onclick="setAuthMode('password')">Password</button>
      </div>`;

    if(state.authMode === 'link'){
      if(state.magicLinkSent){
        box.innerHTML = tabs + `<div class="hint" style="text-align:right;max-width:240px;">Check your inbox for a sign-in link.</div>`;
        return;
      }
      box.innerHTML = tabs + `
        <div class="login-form">
          <div class="row">
            <input type="email" id="loginEmail" placeholder="you@email.com" value="${escapeHtml(state.loginEmail)}">
            <button class="btn btn-gold" onclick="sendMagicLink()">Email me a link</button>
          </div>
          ${state.err ? `<div class="hint" style="color:var(--rust)">${escapeHtml(state.err)}</div>` : `<div class="hint">No password — we email you a one-time sign-in link.</div>`}
        </div>`;
      document.getElementById('loginEmail').oninput = e => state.loginEmail = e.target.value;
      document.getElementById('loginEmail').onkeydown = e => { if(e.key==='Enter') sendMagicLink(); };

    }

    // password mode
    if(state.resetSent){
      box.innerHTML = tabs + `<div class="hint" style="text-align:right;max-width:240px;">Check your inbox for a password reset link.</div>`;
      return;
    }
    if(state.magicLinkSent){
      box.innerHTML = tabs + `<div class="hint" style="text-align:right;max-width:240px;">Check your inbox to confirm your account, then come back and sign in.</div>`;
      return;
    }
    box.innerHTML = tabs + `
      <div class="login-form">
        <div class="row">
          <input type="email" id="loginEmail" placeholder="you@email.com" value="${escapeHtml(state.loginEmail)}">
        </div>
        <div class="row">
          <input type="password" id="loginPassword" placeholder="password" value="${escapeHtml(state.loginPassword)}">
        </div>
        <div class="row">
          <button class="btn btn-ghost btn-small" onclick="signUpWithPassword()">Create account</button>
          <button class="btn btn-gold btn-small" onclick="signInWithPassword()">Sign in</button>
        </div>
        <div class="hint"><a href="#" onclick="sendPasswordReset();return false;" style="color:var(--slate);">Forgot password?</a></div>
        ${state.err ? `<div class="hint" style="color:var(--rust)">${escapeHtml(state.err)}</div>` : ''}
      </div>`;
    document.getElementById('loginEmail').oninput = e => state.loginEmail = e.target.value;
    document.getElementById('loginPassword').oninput = e => state.loginPassword = e.target.value;
    document.getElementById('loginPassword').onkeydown = e => { if(e.key==='Enter') signInWithPassword(); };
    return;
  }
  if(!displayName()){
    box.innerHTML = `
      <div class="login-form">
        <div class="row">
          <input type="text" id="nameDraft" placeholder="Name for your byline" value="${escapeHtml(state.nameDraft)}">
          <button class="btn btn-gold" onclick="saveName()">Save</button>
        </div>
        ${state.err ? `<div class="hint" style="color:var(--rust)">${escapeHtml(state.err)}</div>` : ''}
      </div>`;
    document.getElementById('nameDraft').oninput = e => state.nameDraft = e.target.value;
    document.getElementById('nameDraft').onkeydown = e => { if(e.key==='Enter') saveName(); };
    return;
  }
  const roleLabel = isEditor() ? 'Editor' : isModerator() ? 'Moderator' : 'Contributor';
  const roleClass = isEditor() ? 'role-admin' : isModerator() ? 'role-mod' : 'role-user';
  let passwordBlock = '';
  if(state.showPasswordSet){
    passwordBlock = `
      <div class="login-form" style="margin-top:8px;align-items:stretch;">
        <div class="row">
          <input type="password" id="passwordDraft" placeholder="new password" value="${escapeHtml(state.passwordDraft)}">
          <button class="btn btn-gold btn-small" onclick="savePassword()">Save</button>
        </div>
        ${state.passwordSaved ? `<div class="hint" style="color:var(--green)">Password set — you can sign in with it next time.</div>` : ''}
        ${state.err ? `<div class="hint" style="color:var(--rust)">${escapeHtml(state.err)}</div>` : `<div class="hint">At least 6 characters.</div>`}
      </div>`;
  }
  box.innerHTML = `
    <div>
      <div class="who">
        <div class="seal">${initials(displayName())}</div>
        <div>
          <div class="name">${escapeHtml(displayName())}</div>
          <div class="${roleClass}">${roleLabel}</div>
        </div>
        <button class="signout" onclick="toggleSetPassword()" style="margin-left:12px;">${state.showPasswordSet ? 'Cancel' : 'Set password'}</button>
        <button class="signout" onclick="handleSignOut()">Sign out</button>
      </div>
      ${passwordBlock}
    </div>`;
  if(state.showPasswordSet){
    document.getElementById('passwordDraft').oninput = e => state.passwordDraft = e.target.value;
    document.getElementById('passwordDraft').onkeydown = e => { if(e.key==='Enter') savePassword(); };
  }
}

function getFilteredPublishedArticles(){
  let list = state.articles.filter(a => a.status === 'approved');

  if(state.categoryFilter){
    list = list.filter(a => a.category_id === state.categoryFilter);
  }
  if(state.subcategoryFilter){
    list = list.filter(a => a.subcategory_id === state.subcategoryFilter);
  }
  if(state.authorFilter){
    list = list.filter(a => (a.author_name || a.author_email) === state.authorFilter);
  }

  const q = state.searchTerm.trim().toLowerCase();
  if(!q) return list;
  return list.filter(a => {
    const haystack = [
      a.title,
      a.author_name,
      a.author_email,
      a.body
    ].join(' ').toLowerCase();
    return haystack.includes(q);
  });
}

function getFeedAuthors(){
  const names = new Set();
  state.articles.filter(a => a.status === 'approved').forEach(a => {
    const n = a.author_name || a.author_email;
    if(n) names.add(n);
  });
  return Array.from(names).sort((a, b) => a.localeCompare(b));
}

function categoryName(id){
  const c = state.categories.find(x => x.id === id);
  return c ? c.name : '';
}
function subcategoryName(id){
  const s = state.subcategories.find(x => x.id === id);
  return s ? s.name : '';
}

async function loadCategories(){
  const [{ data: cats, error: catErr }, { data: subs, error: subErr }] = await Promise.all([
    sb.from('categories').select('*').order('sort_order', { ascending: true }),
    sb.from('subcategories').select('*').order('sort_order', { ascending: true })
  ]);
  if(!catErr) state.categories = cats || [];
  if(!subErr) state.subcategories = subs || [];
  state.categoriesLoaded = true;
}

async function addCategory(){
  const name = (document.getElementById('newCategoryName').value || '').trim();
  if(!name) return;
  const { error } = await sb.from('categories').insert({ name, sort_order: state.categories.length });
  if(error){ state.err = error.message; }
  await loadCategories();
  render();
}
async function deleteCategory(id){
  const { error } = await sb.from('categories').delete().eq('id', id);
  if(error){ state.err = error.message; }
  await loadCategories();
  render();
}
async function addSubcategory(){
  const name = (document.getElementById('newSubcategoryName').value || '').trim();
  if(!name) return;
  const { error } = await sb.from('subcategories').insert({ name, sort_order: state.subcategories.length });
  if(error){ state.err = error.message; }
  await loadCategories();
  render();
}
async function deleteSubcategory(id){
  const { error } = await sb.from('subcategories').delete().eq('id', id);
  if(error){ state.err = error.message; }
  await loadCategories();
  render();
}

function renderNav(){
  const nav = document.getElementById('nav');
  const feedCount = getFilteredPublishedArticles().length;
  if(!state.session || !displayName()){
    nav.innerHTML = `<button class="active">Feed (${feedCount})</button>`;
    return;
  }
  const staff = isStaff();
  const pendingCount = state.articles.filter(a => a.status === 'pending').length;
  const tabs = [
    {id:'feed', label:`Feed (${feedCount})`},
    {id:'submit', label:'Submit'},
    {id:'desk', label:'My desk'},
    {id:'messages', label:'Messages', count: state.unreadTotal}
  ];
  if(staff){
    tabs.push({id:'review', label:'Review desk', count: pendingCount});
  }
  if(isEditor()){
    tabs.push({id:'users', label:'User Desk'});
  }
  nav.innerHTML = tabs.map(t => `
    <button class="${state.view===t.id?'active':''}" onclick="setView('${t.id}')">
      ${t.label}${t.count ? `<span class="count">${t.count}</span>` : ''}
    </button>`).join('');
}

function goHome(){
  if(window.location.hash){
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }
  setView('feed');
}

function setView(v){
  if(v === 'submit'){
    state.editingArticleId = null;
    state.submitTitle = "";
    state.submitBody = "";
    state.submitCategoryId = "";
    state.submitSubcategoryId = "";
    state.draftSaved = false;
  }
  state.view = v;
  state.selectedId = null;
  state.err = "";
  state.suspendMenuFor = null;
  state.selectedThreadId = null;
  state.deskGroupFilter = null;
  state.reviewGroupFilter = null;
  render();
  if(v === 'users' && isEditor()){
    loadUsers().then(render);
  }
  if(v === 'messages' && state.session){
    if(isStaff()){
      loadThreads().then(render);
    } else {
      loadThread(state.session.user.id).then(render);
    }
  }
}

function toggleGroupFilter(scope, key){
  const field = scope + 'GroupFilter';
  state[field] = state[field] === key ? null : key;
  render();
}

function renderBanner(){
  const banner = document.getElementById('banner');
  const parts = [];
  if(accountLocked()){
    parts.push(`<div class="banner-note" style="color:var(--rust);background:var(--rust-dim);">${escapeHtml(lockedMessage())}</div>`);
  }
  if(state.err && state.session && displayName() && state.view !== 'submit'){
    parts.push(`<div class="banner-note" style="color:var(--rust);background:var(--rust-dim);">${escapeHtml(state.err)}</div>`);
  }
  banner.innerHTML = parts.join('');
}

function renderMain(){
  const main = document.getElementById('main');

  if(state.view === 'feed'){
    const q = state.searchTerm.trim().toLowerCase();
    const filtered = getFilteredPublishedArticles();
    const filtersActive = !!(q || state.categoryFilter || state.subcategoryFilter || state.authorFilter);

    renderSplit(main, filtered, {
      emptyTitle: filtersActive ? "No published articles match your filters." : "No articles published yet.",
      emptySub: filtersActive ? "Try clearing a filter or a different keyword." : "The first approved article of faith will appear here.",
      rowHtml: (a, active) => listRowHtml(a, active),
      detailHtml: feedDetailHtml,
      search: true
    });
    const cd = document.getElementById('commentDraft');
    if(cd) cd.oninput = e => state.commentDraft = e.target.value;

    document.querySelectorAll('[id^="replyInput-"]').forEach((replyInput) => {
      const id = replyInput.id.replace('replyInput-', '');
      replyInput.oninput = e => {
        state.replyDrafts[id] = e.target.value;
      };
    });
    return;
  }

  if(!state.session){
    main.innerHTML = `<div class="scroll-panel"><div class="narrow"><div class="locked-msg"><div class="glyph">†</div><p>Sign in above with your email to write, and (if you're the editor) publish.</p></div></div></div>`;
    return;
  }
  if(!displayName()){
    main.innerHTML = `<div class="scroll-panel"><div class="narrow"><div class="locked-msg"><div class="glyph">†</div><p>Add a name above for your byline to continue.</p></div></div></div>`;
    return;
  }

  if(state.view === 'submit'){
    const editingArticle = state.editingArticleId ? state.articles.find(x => x.id === state.editingArticleId) : null;
    const editingLive = editingArticle && editingArticle.status !== 'draft';
    main.innerHTML = `
      <div class="scroll-panel"><div class="narrow">
      ${!state.editingArticleId ? `
      <div class="submit-intro">
        <p class="welcome-copy" style="margin-bottom:8px;">Write from conviction, cite Scripture where you can, and keep the focus on the truth being taught rather than on any one personality or ministry.</p>
        <p class="welcome-copy" style="margin-bottom:0;">Picking a category and topic below helps readers find your piece through the Feed's filters — it's optional, but recommended. You can save a draft any time and come back to finish it later from My Desk.</p>
      </div>` : ''}
      <div class="panel">
        ${state.editingArticleId
          ? (editingLive
              ? `<div class="field-note" style="margin-bottom:14px;">Editing a ${editingArticle.status} article — changes save in place, status stays the same. <a href="#" onclick="newSubmission();return false;" style="color:var(--gold);">Start a new article instead</a></div>`
              : `<div class="field-note" style="margin-bottom:14px;">Editing a saved draft. <a href="#" onclick="newSubmission();return false;" style="color:var(--gold);">Start a new article instead</a></div>`)
          : ''}
        <div class="field">
          <label>Headline</label>
          <input type="text" id="submitTitle" placeholder="A working title" value="${escapeHtml(state.submitTitle)}">
        </div>
        <div class="field">
          <label>Article</label>
          <textarea id="submitBody" placeholder="Write the piece here.">${escapeHtml(state.submitBody)}</textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label>Category</label>
            <select id="submitCategory">
              <option value="">— None —</option>
              ${state.categories.map(c => `<option value="${c.id}" ${state.submitCategoryId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Topic</label>
            <select id="submitSubcategory">
              <option value="">— None —</option>
              ${state.subcategories.map(s => `<option value="${s.id}" ${state.submitSubcategoryId===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="submit-row">
          <div class="field-note">${editingLive ? "Saves in place — no re-approval needed." : (isStaff() ? "Publishes immediately — you have review privileges." : "Goes to the editor for approval before it's published.")}</div>
          <div style="display:flex;gap:8px;">
            ${!editingLive ? `<button class="btn btn-ghost" onclick="saveDraft()">Save draft</button>` : ''}
            <button class="btn btn-gold" onclick="${editingLive ? 'saveArticleEdit()' : 'submitArticle()'}">${editingLive ? 'Save changes' : (isStaff() ? 'Publish' : 'Send for approval')}</button>
          </div>

        ${state.draftSaved ? `<div class="hint" style="color:var(--green);margin-top:10px;text-align:left;">Draft saved — only visible to you until you submit it.</div>` : ''}

    document.getElementById('submitCategory').onchange = e => { state.submitCategoryId = e.target.value; state.draftSaved = false; };
    document.getElementById('submitSubcategory').onchange = e => { state.submitSubcategoryId = e.target.value; state.draftSaved = false; };
    return;
  }

  if(state.view === 'desk'){
    const mine = state.articles.filter(a => a.author_email === state.session.user.email);
    renderSplit(main, mine, {
      emptyTitle: "Nothing submitted yet.",
      emptySub: "Head to Submit to write your first article of faith.",
      rowHtml: (a, active) => listRowHtml(a, active),
      detailHtml: deskDetailHtml,
      groupBy: a => a.status,
      groupOrder: ['draft', 'pending', 'approved', 'rejected'],
      groupLabels: { draft: 'Drafts', pending: 'Under Review', approved: 'Published', rejected: 'Declined' },
      activeGroup: state.deskGroupFilter,
      onGroupClick: (k) => `toggleGroupFilter('desk','${k}')`,
      welcomeHtml: `
        <p class="welcome-heading">My Desk</p>

      return;
    }
    const pending = state.articles.filter(a => a.status === 'pending');
    const published = state.articles.filter(a => a.status === 'approved');
    renderSplit(main, [...pending, ...published], {
      emptyTitle: "Nothing to review yet.",
      rowHtml: (a, active) => listRowHtml(a, active),
      detailHtml: reviewDetailHtml,
      groupBy: a => a.status,
      groupOrder: ['pending', 'approved'],
      groupLabels: { pending: 'For Review', approved: 'Published' },
      activeGroup: state.reviewGroupFilter,
      onGroupClick: (k) => `toggleGroupFilter('review','${k}')`,
      welcomeHtml: `

    return;
  }

  if(state.view === 'messages'){

      return;
    }
    if(isStaff()){
      renderMessagesInbox(main);
    } else {
      renderMyThread(main);
    }
    return;
  }

  if(state.view === 'users'){
    if(!isEditor()){
      main.innerHTML = `<div class="scroll-panel"><div class="narrow"><div class="locked-msg"><div class="glyph">†</div><p>This desk is for the editor only.</p></div></div></div>`;
      return;
    }
    renderUsersDashboard(main);
    return;
  }
}

function render(){
  renderAuthBox();
  renderNav();
  renderBanner();
  renderMain();
}

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  await loadOwnProfile();
  await loadArticles();
  await loadUnreadTotal();
  await loadCategories();
  openArticleFromHash();
  render();

  window.addEventListener('hashchange', openArticleFromHash);

  sb.auth.onAuthStateChange(async (_event, session) => {
    state.session = session;
    state.magicLinkSent = false;
    await loadOwnProfile();
    await loadArticles();
    await loadUnreadTotal();
    render();
    if(state.view === 'feed' && state.selectedId){
      await loadArticleExtras(state.selectedId);
    }
  });

  sb.channel('articles-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'articles' }, async () => {
      await loadArticles();
      render();
    })
    .subscribe();

  sb.channel('messages-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, async () => {
      await loadUnreadTotal();
      if(state.view === 'messages' && state.session){
        if(isStaff()){
          await loadThreads();
          if(state.selectedThreadId) await loadThread(state.selectedThreadId);
        } else {
          await loadThread(state.session.user.id);
        }
      }
      render();
    })
    .subscribe();
}

init();
</script>
</body>
</html>
