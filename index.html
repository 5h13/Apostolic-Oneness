<style>
  :root{
    --ink-900:#14161c;
    --ink-800:#1b1e27;
    --ink-700:#242833;
    --ink-line:#333846;
    --paper:#ecedf2;
    --slate:#8890a2;
    --gold:#cda45e;
    --gold-dim:rgba(205,164,94,0.14);
    --green:#6fae82;
    --green-dim:rgba(111,174,130,0.14);
    --amber:#d9a441;
    --amber-dim:rgba(217,164,65,0.14);
    --rust:#b85c4f;
    --rust-dim:rgba(184,92,79,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink-900);color:var(--paper);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  html,body{height:100vh;height:100dvh;}
  body{display:flex;flex-direction:column;overflow:hidden;}
  a{color:inherit;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;flex:1 1 auto;min-height:0;}
  .masthead{padding:40px 0 0;flex:0 0 auto;}
  .masthead-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;flex-direction:row;align-items:center;gap:14px;}
  .brand-link{cursor:pointer;}
  .brand-link:hover{opacity:0.85;}
  .brand-logo{width:44px;height:44px;border-radius:6px;object-fit:cover;flex-shrink:0;}
  .brand h1{font-family:'Fraunces',serif;font-weight:600;font-size:40px;letter-spacing:-0.01em;margin:0;}
  .brand .tagline{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--slate);}
  .rule-thick{border:none;border-top:2px solid var(--paper);margin:24px 0 0;}
  .auth-box{min-width:240px;}
  .auth-tabs{display:flex;gap:4px;justify-content:flex-end;margin-bottom:6px;}
  .auth-tab{background:none;border:none;color:var(--slate);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;padding:4px 8px;cursor:pointer;border-bottom:2px solid transparent;}
  .auth-tab.active{color:var(--paper);border-bottom-color:var(--gold);}
  .auth-tab:hover{color:var(--paper);}
  .auth-box .who{display:flex;align-items:center;gap:10px;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:8px;padding:8px 12px;font-size:13px;}
  .auth-box .who .seal{width:22px;height:22px;border-radius:50%;background:var(--gold-dim);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;flex-shrink:0;}
  .auth-box .name{font-weight:500;}
  .auth-box .role-admin{color:var(--gold);font-size:11px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.06em;}
  .auth-box .role-mod{color:var(--green);font-size:11px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.06em;}
  .auth-box .role-user{color:var(--slate);font-size:11px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.06em;}
  .auth-box .signout{margin-left:auto;background:none;border:none;color:var(--slate);cursor:pointer;font-size:12px;text-decoration:underline;padding:0;font-family:'Inter',sans-serif;}
  .auth-box .signout:hover{color:var(--paper);}
  .login-form{display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .login-form .row{display:flex;gap:8px;}
  input[type=text],input[type=email]{background:var(--ink-800);border:1px solid var(--ink-line);color:var(--paper);border-radius:6px;padding:8px 10px;font-size:13px;font-family:'Inter',sans-serif;outline:none;}
  input[type=text]:focus,input[type=email]:focus,textarea:focus{border-color:var(--gold);}
  .login-form input{width:190px;}
  .btn{background:var(--paper);color:var(--ink-900);border:none;border-radius:6px;padding:8px 14px;font-family:'Inter',sans-serif;font-weight:500;font-size:13px;cursor:pointer;}
  .btn:hover{opacity:0.88;}
  .btn-ghost{background:none;border:1px solid var(--ink-line);color:var(--paper);}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
  .btn-gold{background:var(--gold);color:#241a08;}
  .btn-rust{background:none;border:1px solid var(--rust);color:var(--rust);}
  .btn-small{padding:5px 10px;font-size:12px;}
  .hint{font-size:11px;color:var(--slate);margin-top:2px;text-align:right;}
  .nav{display:flex;gap:2px;margin-top:28px;flex-wrap:wrap;flex:0 0 auto;}
  .nav button{background:none;border:none;color:var(--slate);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;}
  .nav button.active{color:var(--paper);border-bottom-color:var(--gold);}
  .nav button:hover{color:var(--paper);}
  .nav .count{display:inline-block;margin-left:6px;background:var(--amber-dim);color:var(--amber);border-radius:10px;padding:1px 6px;font-size:10px;}
  #main{flex:1 1 auto;min-height:0;overflow:hidden;}
  .scroll-panel{height:100%;overflow-y:auto;}
  .narrow{max-width:640px;margin:0 auto;padding:24px 20px 60px;}
  .narrow-wide{max-width:920px;margin:0 auto;padding:24px 20px 60px;}
  .submit-layout{display:flex;gap:20px;align-items:flex-start;}
  .submit-main{flex:1;min-width:0;}
  .submit-sidebar{width:300px;flex-shrink:0;position:sticky;top:20px;}
  @media (max-width:820px){
    .submit-layout{flex-direction:column;}
    .submit-sidebar{width:100%;position:static;}
  }
  .split{display:flex;height:100%;}
  .split-list{width:340px;flex:0 0 340px;overflow-y:auto;min-height:0;border-right:1px solid var(--ink-line);}
  .split-detail{flex:1 1 auto;overflow-y:auto;min-height:0;padding:28px 40px 60px;}
  .list-row{padding:14px 20px;border-bottom:1px solid var(--ink-line);cursor:pointer;border-left:3px solid transparent;}
  .list-group-header{position:sticky;top:0;z-index:1;background:var(--ink-900);border-bottom:1px solid var(--ink-line);padding:8px 20px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--slate);}
  .list-group-header-clickable{cursor:pointer;}
  .list-group-header-clickable:hover{color:var(--paper);}
  .list-subheader{padding-left:32px;}
  .list-group-header.active{color:var(--gold);background:var(--ink-800);}
  .desk-subtabs{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--ink-line);background:var(--ink-900);}
  .desk-subtabs button{background:none;border:1px solid var(--ink-line);color:var(--slate);font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.05em;text-transform:uppercase;padding:6px 10px;border-radius:6px;cursor:pointer;}
  .desk-subtabs button.active{color:var(--paper);border-color:var(--gold);background:var(--ink-800);}
  .reading-list-control{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .list-manager-card{border:1px solid var(--ink-line);border-radius:8px;padding:14px;margin-top:12px;}
  .list-manager-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .list-manager-title{font-weight:600;}
  .list-manager-body{margin-top:12px;border-top:1px solid var(--ink-line);padding-top:12px;}
  .list-manager-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--ink-line);}
  .list-manager-item:last-child{border-bottom:none;}
  .list-manager-item-title{flex:1;font-size:13px;}
  .list-manager-search-result{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--ink-line);}
  .list-row:hover{background:var(--ink-800);}
  .list-row.active{background:var(--ink-800);border-left-color:var(--gold);}
  .list-row-title{font-family:'Fraunces',serif;font-size:15px;font-weight:600;line-height:1.3;margin-bottom:5px;}
  .list-row-meta{font-size:11px;color:var(--slate);font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .stamp-mini{display:inline-block;padding:1px 7px;border-radius:8px;font-size:9px;letter-spacing:0.04em;text-transform:uppercase;}
  .stamp-mini.approved{color:var(--green);background:var(--green-dim);}
  .stamp-mini.pending{color:var(--amber);background:var(--amber-dim);}
  .stamp-mini.rejected{color:var(--rust);background:var(--rust-dim);}
  .stamp-mini.draft{color:var(--slate);background:rgba(136,144,162,0.14);}
  .detail-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:18px;color:var(--slate);text-align:center;overflow-y:auto;}
  .welcome-message{max-width:560px;line-height:1.7;color:var(--slate);text-align:left;}
  .welcome-heading{margin:0 0 10px;color:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;}
  .welcome-copy{margin:0 0 14px;color:var(--paper);}
  .dash-section{margin-top:26px;}
  .dash-section-title{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);border-bottom:1px solid var(--ink-line);padding-bottom:8px;margin-bottom:4px;}
  .dash-row{padding:10px 0;border-bottom:1px solid var(--ink-line);cursor:pointer;}
  .dash-row:hover .dash-row-title{color:var(--gold);}
  .dash-row-title{font-weight:500;}
  .dash-row-meta{font-size:12px;color:var(--slate);margin-top:2px;}
  .word-count{font-size:11px;color:var(--slate);text-align:right;margin-top:4px;font-family:'IBM Plex Mono',monospace;}
  .verse-lookup{background:var(--ink-900);border:1px solid var(--ink-line);border-radius:8px;padding:12px;margin-bottom:10px;}
  .verse-result{margin-top:10px;padding:10px 14px;border-left:2px solid var(--gold);background:var(--ink-800);border-radius:0 6px 6px 0;}
  .verse-text{font-family:'Fraunces',serif;font-style:italic;font-size:14px;line-height:1.5;color:var(--paper);}
  .verse-ref{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold);margin-top:6px;}
  .feed-tools{padding:14px 16px;border-bottom:1px solid var(--ink-line);background:var(--ink-900);display:flex;align-items:center;gap:8px;}
  .feed-search-wrap{flex:1 1 auto;}
  .feed-search{width:100%;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:8px;padding:10px 12px;color:var(--paper);font-size:13px;font-family:'Inter',sans-serif;outline:none;}
  .feed-search:focus{border-color:var(--gold);}
  .clear-search{background:none;border:1px solid var(--ink-line);color:var(--slate);border-radius:6px;padding:8px 10px;font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;}
  .clear-search:hover:not(:disabled){border-color:var(--gold);color:var(--paper);}
  .clear-search:disabled{opacity:0.4;cursor:not-allowed;}
  .detail-article h2{font-family:'Fraunces',serif;font-weight:600;font-size:26px;line-height:1.25;margin:0 0 8px;}
  .engage-row{display:flex;gap:10px;margin-top:24px;align-items:center;}
  .reaction-bar{display:flex;gap:12px;margin:16px 0;}
  .reaction-btn{background:transparent;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;gap:4px;opacity:0.8;transition:transform 0.15s ease,opacity 0.15s ease;}
  .reaction-btn:hover{opacity:1;transform:scale(1.1);}
  .reaction-btn.active{color:#d9534f;transform:scale(1.2);opacity:1;}
  .comments-section{margin-top:34px;padding-top:22px;border-top:1px solid var(--ink-line);}
  .comment{padding:12px 0;border-bottom:1px solid var(--ink-line);}
  .comment-meta{font-size:12px;color:var(--slate);font-family:'IBM Plex Mono',monospace;display:flex;gap:8px;align-items:center;}
  .comment-meta b{color:var(--paper);font-weight:500;font-family:'Inter',sans-serif;}
  .comment-body{margin-top:6px;font-size:14px;color:#d6d8de;line-height:1.55;white-space:pre-wrap;}
  .comment-actions{margin-top:8px;display:flex;gap:10px;align-items:center;}
  .comment-reply{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
  .comment-reply textarea{min-height:70px;}
  .reply-actions{display:flex;justify-content:flex-end;gap:8px;}
  .comment-form{margin-top:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .comment-form textarea{min-height:70px;}
  .comment-meta-actions{margin-left:auto;display:flex;gap:10px;}
  .comments-heading{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--slate);margin-bottom:6px;}
  .comment-composer{display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .comment-composer textarea{width:100%;min-height:70px;background:var(--ink-900);border:1px solid var(--ink-line);color:var(--paper);border-radius:6px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;resize:vertical;box-sizing:border-box;}
  .forum-answer{padding:14px 0;border-bottom:1px solid var(--ink-line);}
  .forum-answer.accepted{background:rgba(139,178,110,0.06);padding:14px 16px;border-radius:8px;border-bottom:1px solid var(--ink-line);}
  .accepted-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--green);margin-bottom:8px;}
  .back-link{display:none;color:var(--gold);text-decoration:none;font-size:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;margin-bottom:18px;}
  .article{padding:26px 0;border-bottom:1px solid var(--ink-line);}
  .article:first-child{padding-top:0;}
  .article-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
  .article h2{font-family:'Fraunces',serif;font-weight:600;font-size:24px;line-height:1.25;margin:0 0 8px;cursor:pointer;}
  .article h2:hover{color:var(--gold);}
  .byline{font-size:12px;color:var(--slate);font-family:'IBM Plex Mono',monospace;}
  .byline b{color:var(--paper);font-weight:500;font-family:'Inter',sans-serif;}
  .excerpt{margin-top:12px;color:#c3c6cf;font-size:15px;line-height:1.65;}
  .body-text{margin-top:16px;color:#d6d8de;font-size:16px;line-height:1.75;white-space:pre-wrap;}
  .toggle-link{color:var(--gold);text-decoration:none;font-size:0.9em;white-space:nowrap;cursor:pointer;}
  .toggle-link:hover{text-decoration:underline;}
  .article-actions{margin-top:14px;display:flex;gap:8px;}
  .stamp{flex-shrink:0;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;border:1.5px solid currentColor;transform:rotate(-8deg);line-height:1.2;}
  .stamp.approved{color:var(--green);background:var(--green-dim);}
  .stamp.pending{color:var(--amber);background:var(--amber-dim);}
  .stamp.rejected{color:var(--rust);background:var(--rust-dim);}
  .empty{padding:60px 0;text-align:center;color:var(--slate);}
  .empty .glyph{font-family:'Fraunces',serif;font-size:32px;color:var(--ink-line);margin-bottom:10px;}
  .empty p{margin:4px 0;font-size:14px;}
  .panel{background:var(--ink-800);border:1px solid var(--ink-line);border-radius:10px;padding:24px;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .stat-card{background:var(--ink-800);border:1px solid var(--ink-line);border-radius:10px;padding:16px;text-align:center;}
  .stat-value{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--gold);}
  .stat-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--slate);margin-top:4px;}
  .user-table{width:100%;border-collapse:collapse;}
  .user-table th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--slate);padding:8px 10px;border-bottom:1px solid var(--ink-line);}
  .user-table td{padding:10px;border-bottom:1px solid var(--ink-line);vertical-align:top;font-size:13px;}
  .user-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .suspend-menu{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .msg-header{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--slate);margin-bottom:14px;}
  .msg-thread{display:flex;flex-direction:column;gap:10px;max-height:50vh;overflow-y:auto;padding-bottom:10px;}
  .msg-bubble{max-width:70%;padding:10px 14px;border-radius:10px;border:1px solid var(--ink-line);}
  .msg-bubble.mine{align-self:flex-end;background:var(--ink-800);border-color:var(--gold-dim,var(--ink-line));}
  .msg-bubble.theirs{align-self:flex-start;background:transparent;}
  .msg-body{font-size:14px;line-height:1.5;white-space:pre-wrap;}
  .msg-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--slate);margin-top:4px;}
  .msg-composer{display:flex;gap:10px;margin-top:16px;align-items:flex-end;}
  .msg-composer textarea{flex:1;min-height:60px;background:var(--ink-800);border:1px solid var(--ink-line);color:var(--paper);border-radius:8px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;resize:vertical;}
  @media (max-width:700px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .user-table thead{display:none;}
    .user-table tr{display:block;border-bottom:1px solid var(--ink-line);padding:10px 0;}
    .user-table td{display:block;border-bottom:none;padding:4px 0;}
  }
  .panel label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--slate);margin-bottom:6px;}
  .field{margin-bottom:18px;}
  .field input[type=text]{width:100%;font-size:15px;padding:10px 12px;}
  .field-row{display:flex;gap:16px;flex-wrap:wrap;}
  .field-row .field{flex:1;min-width:180px;}
  .field select{width:100%;background:var(--ink-900);border:1px solid var(--ink-line);color:var(--paper);border-radius:6px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:14px;outline:none;}
  .field select:focus{border-color:var(--gold);}
  .submit-intro{padding:16px 20px;margin-bottom:16px;border-left:2px solid var(--gold);background:var(--ink-800);border-radius:0 8px 8px 0;}
  .category-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .category-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold);border:1px solid var(--ink-line);border-radius:20px;padding:3px 10px;}
  .category-tag-sub{color:var(--slate);}
  .feed-filters{display:flex;gap:8px;padding:0 16px 12px;flex-wrap:wrap;border-bottom:1px solid var(--ink-line);background:var(--ink-900);}
  .filter-select{background:var(--ink-800);border:1px solid var(--ink-line);color:var(--paper);border-radius:6px;padding:6px 8px;font-family:'Inter',sans-serif;font-size:12px;flex:1;min-width:110px;}
  .translate-bar{display:flex;justify-content:flex-end;margin-bottom:10px;}
  .row{display:flex;}
  .category-pill-list{display:flex;flex-wrap:wrap;gap:8px;}
  .category-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:20px;padding:5px 6px 5px 12px;}
  .category-pill-remove{color:var(--rust);text-decoration:none;font-size:15px;line-height:1;padding:0 6px;}
  .category-pill-remove:hover{color:var(--paper);}
  textarea{width:100%;min-height:220px;resize:vertical;background:var(--ink-900);border:1px solid var(--ink-line);color:var(--paper);border-radius:6px;padding:12px;font-family:'Inter',sans-serif;font-size:15px;line-height:1.6;outline:none;}
  textarea:focus{border-color:var(--gold);}
  .submit-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:16px;flex-wrap:wrap;}

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
const EDITOR_EMAIL = window.EDITOR_EMAIL;

let state = {
  session: null,
  view: "feed",
  articles: [],
  selectedId: null,
  likeCount: 0,
  userLiked: false,
  comments: [],
  commentDraft: "",
  shareCopied: null,
  loginEmail: "",
  loginPassword: "",
  authMode: "link",
  magicLinkSent: false,
  resetSent: false,
  nameDraft: "",
  showPasswordSet: false,
  passwordDraft: "",
  passwordSaved: false,
  submitTitle: "",
  submitBody: "",
  editingArticleId: null,
  draftSaved: false,
  err: "",
  loading: true,
  searchTerm: "",
  replyTargetId: null,
  replyDrafts: {},
  profile: null,
  users: [],
  usersLoaded: false,
  userSearchTerm: "",
  userStatusFilter: "all",
  suspendMenuFor: null,
  messages: [],
  threads: [],
  threadsLoaded: false,
  selectedThreadId: null,
  messageDraft: "",
  unreadTotal: 0,
  categories: [],
  subcategories: [],
  categoriesLoaded: false,
  categoryFilter: "",
  subcategoryFilter: "",
  authorFilter: "",
  deskSearchTerm: "",
  deskCategoryFilter: "",
  deskSubcategoryFilter: "",
  deskAuthorFilter: "",
  reviewSearchTerm: "",
  reviewCategoryFilter: "",
  reviewSubcategoryFilter: "",
  reviewAuthorFilter: "",
  submitCategoryId: "",
  submitSubcategoryId: "",
  deskGroupFilter: null,
  reviewGroupFilter: null,
  groupCollapsed: {},
  reviewSubView: 'articles',
  academyEssaySubmissions: [],
  academyEssaySubmissionsLoaded: false,

  forumQuestionsLoaded: false,

  forumComposerOpen: false,
  forumTitleDraft: "",
  forumBodyDraft: "",
  forumAnswerDraft: "",
  forumSearchTerm: "",
  translationLang: "",
  translationCache: {},
  prayerRequests: [],
  prayerRequestsLoaded: false,
  selectedPrayerId: null,
  prayerComposerOpen: false,
  prayerBodyDraft: "",
  prayerResponseStatus: {},
  verseLookupOpen: false,
  verseRefDraft: "",
  verseResult: null,
  academyView: 'home',
  academySubjects: [],
  academyCourses: [],
  academyLessons: [],
  academySections: [],
  academySectionOpen: {},
  academyCourseIntroOpen: {},
  academyLiveLinkedArticle: null,
  academyChapterCourseCompleted: false,
  academyProgress: {},
  academyEnrollments: {},
  academyCertificates: {},
  academySelectedCourseId: null,
  academySelectedLessonId: null,
  academyQuizQuestions: [],
  academyQuizAnswers: {},
  academyQuizResult: null,
  academyEssayDraft: "",
  academyEssayResult: null,
  academyTranslationLang: "",
  academyTranslationCache: {},
  academyDeskScreen: 'catalog',
  academyDeskCourseId: null,
  academyDeskSubjects: [],
  academyDeskCourses: [],
  academyDeskSections: [],
  academyDeskLessons: [],
  academyDeskEnrollmentCount: 0,
  academyDeskSectionOpen: {},
  academyDeskRenamingSectionId: null,
  academyDeskSectionRenameDraft: "",
  academyDeskSectionIntroDraft: "",
  academyDeskCourseDraft: null,
  academyDeskLessonEditor: null,
  academyDeskRoster: [],
  academyDeskRosterLoaded: false,
  academyDeskStuckThresholdDays: 7,
  lists: [],
  listsLoaded: false,
  listManagerOpenId: null,
  listArticleSearchTerm: "",
  listArticleCategoryFilter: "",
  readingList: [],
  readingListMap: {},
  readingListLoaded: false,
  deskSubView: 'articles',
  feedListsOpen: true,
  feedArticlesOpen: true,
  feedListToggle: {},
  announcements: [],
  announcementsLoaded: false,
  announcementDraftMessage: "",
  announcementDraftLevel: "info",
  announcementDismissed: (typeof localStorage !== 'undefined' && localStorage.getItem('flint_announcement_dismissed')) || ""
};

// Keep this in sync with DESIRED_LANGUAGES in scripts/generate-translations.mjs
// — this is only the display list for the dropdown; the actual
// translating happens in that script, not here.
const LANGUAGES = [
  { code: 'tl',  label: 'Filipino' },
  { code: 'vi',  label: 'Vietnamese' },
  { code: 'id',  label: 'Indonesian' },
  { code: 'th',  label: 'Thai' },
  { code: 'hi',  label: 'Hindi' },
  { code: 'es',  label: 'Spanish' }
];

const PRAYER_REACTIONS = [
  { type: 'praying', emoji: '🙏', label: 'Praying' },
  { type: 'love',    emoji: '❤️', label: 'Love' },
  { type: 'comfort', emoji: '🤍', label: 'Comfort' },
  { type: 'faith',   emoji: '🔥', label: 'Faith' },
  { type: 'peace',   emoji: '🌿', label: 'Peace' }
];

function isEditor(){
  return !!state.session && state.session.user.email === EDITOR_EMAIL;
}
function isModerator(){
  return !!state.session && !!state.profile && state.profile.role === 'moderator';
}
// "Staff" = editor or moderator — everything a moderator can do, an
// editor can do too. Use isEditor() specifically only for things a
// moderator should NOT get (User Desk / profile management).
function isStaff(){
  return isEditor() || isModerator();
}

// Editors are never locked out by their own moderation actions — avoids
// a self-suspend/self-block accident bricking the only admin account.
function accountLocked(){
  if(isEditor()) return false;
  return !!state.profile && state.profile.status !== 'active';
}
function lockedMessage(){
  if(!state.profile) return "";
  if(state.profile.status === 'suspended'){
    const until = state.profile.suspended_until
      ? ` until ${fmtDate(state.profile.suspended_until)}`
      : '';
    return `Your account is suspended${until}. You can still read published articles, but you can't submit, comment, or react.`;
  }
  return "";
}

async function loadOwnProfile(){
  if(!state.session){
    state.profile = null;
    return;
  }
  const { data, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', state.session.user.id)
    .maybeSingle();

  if(error || !data){
    state.profile = null;
    return;
  }
  state.profile = data;

  // Revoked accounts ("blocked" in the DB) are force-signed-out on
  // every load, not just once. Since a static site with only the anon
  // key can't stop the sign-in call itself (that needs the service-role
  // Admin API), this is the closest equivalent to "can no longer sign
  // in": Supabase issues them a session, and we immediately kill it
  // again before they can do anything with it, every single time,
  // until an editor reinstates them.
  if(data.status === 'blocked'){
    await sb.auth.signOut();
    state.session = null;
    state.profile = null;
    state.err = "Your access has been revoked by the editor.";
  }
}

function displayName(){
  if(!state.session) return "";
  return state.session.user.user_metadata && state.session.user.user_metadata.full_name || "";
}
function initials(name){
  if(!name) return "?";
  const parts = name.trim().split(/\s+/);
  return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
}
function fmtDate(iso){
  return new Date(iso).toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'});
}
function fmtDateLong(iso){
  return new Date(iso).toLocaleDateString(undefined, {year:'numeric', month:'long', day:'numeric'});
}
function wordCount(text){
  const trimmed = (text || '').trim();
  return trimmed ? trimmed.split(/\s+/).length : 0;
}

function escapeHtml(s){
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function sendMagicLink(){
  const email = state.loginEmail.trim().toLowerCase();
  if(!email || !email.includes("@")){
    state.err = "Enter a valid email.";
    render();
    return;
  }
  state.err = "";
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.origin + window.location.pathname }
  });
  if(error){
    state.err = error.message;
  } else {
    state.magicLinkSent = true;
  }
  render();
}

function setAuthMode(mode){
  state.authMode = mode;
  state.err = "";
  state.resetSent = false;
  render();
}

async function signInWithPassword(){
  const email = state.loginEmail.trim().toLowerCase();
  const password = state.loginPassword;
  if(!email || !email.includes("@")){
    state.err = "Enter a valid email.";
    render();
    return;
  }
  if(!password){
    state.err = "Enter your password.";
    render();
    return;
  }
  state.err = "";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    state.err = error.message;
    render();
  }
  // On success, onAuthStateChange handles the redraw.
}

async function signUpWithPassword(){
  const email = state.loginEmail.trim().toLowerCase();
  const password = state.loginPassword;
  if(!email || !email.includes("@")){
    state.err = "Enter a valid email.";
    render();
    return;
  }
  if(!password || password.length < 6){
    state.err = "Choose a password with at least 6 characters.";
    render();
    return;
  }
  state.err = "";
  const { data, error } = await sb.auth.signUp({
    email,
    password,
    options: { emailRedirectTo: window.location.origin + window.location.pathname }
  });
  if(error){
    state.err = error.message;
    render();
    return;
  }
  if(data.session){
    // Email confirmation is off; signed in immediately, onAuthStateChange handles redraw.
    return;
  }
  state.err = "";
  state.magicLinkSent = true; // reuse the "check your inbox" notice for the confirmation email
  render();
}

async function sendPasswordReset(){
  const email = state.loginEmail.trim().toLowerCase();
  if(!email || !email.includes("@")){
    state.err = "Enter your email above first.";
    render();
    return;
  }
  state.err = "";
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });
  if(error){
    state.err = error.message;
  } else {
    state.resetSent = true;
  }
  render();
}

function toggleSetPassword(){
  state.showPasswordSet = !state.showPasswordSet;
  state.passwordDraft = "";
  state.passwordSaved = false;
  state.err = "";
  render();
}

async function savePassword(){
  const password = state.passwordDraft;
  if(!password || password.length < 6){
    state.err = "Choose a password with at least 6 characters.";
    render();
    return;
  }
  state.err = "";
  const { error } = await sb.auth.updateUser({ password });
  if(error){
    state.err = error.message;
  } else {
    state.passwordSaved = true;
    state.passwordDraft = "";
  }
  render();
}

async function saveName(){
  const name = state.nameDraft.trim();
  if(!name){
    state.err = "Enter a name for your byline.";
    render();
    return;
  }
  state.err = "";
  const { error } = await sb.auth.updateUser({ data: { full_name: name } });
  if(error){
    state.err = error.message;
  } else {
    await sb.auth.refreshSession();
    if(state.session){
      await sb.from('profiles').update({ display_name: name }).eq('id', state.session.user.id);
      state.profile = { ...(state.profile || {}), display_name: name };
    }
  }
  render();
}

async function handleSignOut(){
  await sb.auth.signOut();
  state.session = null;
  state.view = "feed";
  state.loginEmail = "";
  state.loginPassword = "";
  state.magicLinkSent = false;
  state.resetSent = false;
  state.showPasswordSet = false;
  state.passwordDraft = "";
  state.passwordSaved = false;
  state.nameDraft = "";
  state.submitTitle = "";
  state.submitBody = "";
  state.editingArticleId = null;
  state.draftSaved = false;
  state.selectedId = null;
  state.likeCount = 0;
  state.userLiked = false;
  state.comments = [];
  state.commentDraft = "";
  state.replyTargetId = null;
  state.replyDrafts = {};
  state.err = "";
  await loadArticles();
  render();
}

async function loadArticles(){
  let query = sb.from('articles').select('*').order('created_at', { ascending: false });
  const { data, error } = await query;
  if(!error){
    state.articles = data || [];
  }
}

async function saveDraft(){
  if(accountLocked()){
    state.err = lockedMessage();
    render();
    return;
  }
  const title = state.submitTitle.trim();
  const body = state.submitBody.trim();
  if(!title && !body){
    state.err = "Write something before saving a draft.";
    render();
    return;
  }
  state.err = "";
  const categoryPatch = {
    category_id: state.submitCategoryId || null,
    subcategory_id: state.submitSubcategoryId || null
  };
  if(state.editingArticleId){
    const { error } = await sb.from('articles')
      .update({ title, body, ...categoryPatch })
      .eq('id', state.editingArticleId);
    if(error){
      state.err = error.message;
      render();
      return;
    }
  } else {
    const { data, error } = await sb.from('articles')
      .insert({
        title,
        body,
        author_email: state.session.user.email,
        author_name: displayName(),
        status: 'draft',
        ...categoryPatch
      })
      .select()
      .single();
    if(error){
      state.err = error.message;
      render();
      return;
    }
    state.editingArticleId = data.id;
  }
  state.draftSaved = true;
  await loadArticles();
  render();
}

// ===== KJV verse lookup (bible-api.com — free, no key required) =====

function toggleVerseLookup(){
  state.verseLookupOpen = !state.verseLookupOpen;
  if(!state.verseLookupOpen) state.verseResult = null;
  render();
}

async function lookupVerse(){
  const ref = (state.verseRefDraft || '').trim();
  if(!ref) return;
  state.verseResult = 'loading';
  render();
  try {
    const res = await fetch(`https://bible-api.com/${encodeURIComponent(ref)}?translation=kjv`);
    const data = await res.json();
    if(!res.ok || !data || !data.text || data.error){
      state.verseResult = 'error';
      render();
      return;
    }
    state.verseResult = {
      reference: data.reference,
      text: data.text.trim().replace(/\s+/g, ' ')
    };
  } catch(e){
    state.verseResult = 'error';
  }
  render();
}

function insertVerse(){
  if(!state.verseResult || state.verseResult === 'loading' || state.verseResult === 'error') return;
  const quote = `"${state.verseResult.text}" — ${state.verseResult.reference} (KJV)`;
  const ta = document.getElementById('submitBody');

  if(ta){
    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const before = state.submitBody.slice(0, start);
    const after = state.submitBody.slice(end);
    const lead = before && !before.endsWith('\n\n') ? (before.endsWith('\n') ? '\n' : '\n\n') : '';
    state.submitBody = before + lead + quote + '\n\n' + after;
  } else {
    state.submitBody = (state.submitBody ? state.submitBody + '\n\n' : '') + quote + '\n\n';
  }

  state.verseLookupOpen = false;
  state.verseRefDraft = '';
  state.verseResult = null;
  state.draftSaved = false;
  render();
}

async function submitArticle(){

  const title = state.submitTitle.trim();
  const body = state.submitBody.trim();
  if(!title || !body){

    return;

  state.err = "";
  const categoryPatch = {
    category_id: state.submitCategoryId || null,

  };

  if(state.editingArticleId){
    const patch = { title, body, status: isStaff() ? 'approved' : 'pending', ...categoryPatch };
    if(isStaff()) patch.approved_at = new Date().toISOString();
    ({ error } = await sb.from('articles').update(patch).eq('id', state.editingArticleId));
  } else {
    ({ error } = await sb.from('articles').insert({
      title,

  }
  state.submitTitle = "";
  state.submitBody = "";
  state.submitCategoryId = "";
  state.submitSubcategoryId = "";
  state.editingArticleId = null;
  state.draftSaved = false;
  state.selectedId = null;
  state.view = isStaff() ? "feed" : "desk";
  await loadArticles();
  render();
}

async function setStatus(id, status){

// ===== User management dashboard (editor only) =====

async function loadUsers(){
  if(!isEditor()) return;
  const { data, error } = await sb
    .from('profiles')
    .select('*')
    .order('created_at', { ascending: false });
  if(error){
    state.err = error.message;
    return;
  }
  state.users = data || [];
  state.usersLoaded = true;
}

function getFilteredUsers(){
  const q = state.userSearchTerm.trim().toLowerCase();
  return state.users.filter(u => {
    if(state.userStatusFilter !== 'all' && u.status !== state.userStatusFilter) return false;
    if(!q) return true;
    const haystack = [u.email, u.display_name].join(' ').toLowerCase();
    return haystack.includes(q);
  });
}

function toggleSuspendMenu(userId){
  state.suspendMenuFor = state.suspendMenuFor === userId ? null : userId;
  render();
}

async function suspendUser(userId, hours){
  const suspended_until = hours ? new Date(Date.now() + hours * 3600 * 1000).toISOString() : null;
  const { error } = await sb.from('profiles')
    .update({ status: 'suspended', suspended_until })
    .eq('id', userId);
  if(error){ state.err = error.message; }
  state.suspendMenuFor = null;
  await loadUsers();
  render();
}

async function reinstateUser(userId){
  const { error } = await sb.from('profiles')
    .update({ status: 'active', suspended_until: null, force_logout_at: null })
    .eq('id', userId);
  if(error){ state.err = error.message; }
  state.suspendMenuFor = null;
  await loadUsers();
  render();
}

// "Revoke access" — the hard action. Sets status to 'blocked' (kept as
// the DB value for backward compatibility with existing policies) and
// stamps force_logout_at so any currently-open session is kicked out
// immediately. loadOwnProfile() then force-signs-out on every future
// load while status stays 'blocked' — the closest we can get to
// "can no longer sign in" without a service-role Admin API.
async function revokeUser(userId){
  const { error } = await sb.from('profiles')
    .update({ status: 'blocked', suspended_until: null, force_logout_at: new Date().toISOString() })
    .eq('id', userId);
  if(error){ state.err = error.message; }
  state.suspendMenuFor = null;
  await loadUsers();
  render();
}

// Only the true editor can change this (enforced both by not showing
// the button anywhere else, and — the real boundary — the DB trigger
// that clamps role/status changes back unless the caller is the editor).
async function setUserRole(userId, role){
  const { error } = await sb.from('profiles').update({ role }).eq('id', userId);
  if(error){ state.err = error.message; }
  await loadUsers();
  render();
}

function userRoleBadge(role){
  if(role === 'moderator') return `<span class="stamp-mini pending">Moderator</span>`;
  return `<span class="hint" style="margin:0;">Contributor</span>`;
}

function userStatusBadge(status){
  const label = status === 'active' ? 'Active' : status === 'suspended' ? 'Suspended' : 'Revoked';
  const cls = status === 'active' ? 'approved' : status === 'suspended' ? 'pending' : 'rejected';
  return `<span class="stamp-mini ${cls}">${label}</span>`;
}

function userActionsHtml(u){
  if(u.email === EDITOR_EMAIL){
    return `<span class="hint" style="margin:0;">You (editor)</span>`;
  }
  const menuOpen = state.suspendMenuFor === u.id;
  const buttons = [];
  buttons.push(`<button class="btn btn-ghost btn-small" onclick="messageUser('${u.id}')">Message</button>`);

  if(u.role === 'moderator'){
    buttons.push(`<button class="btn btn-ghost btn-small" onclick="setUserRole('${u.id}','user')">Remove moderator</button>`);
  } else {
    buttons.push(`<button class="btn btn-ghost btn-small" onclick="setUserRole('${u.id}','moderator')">Make moderator</button>`);
  }

  if(u.status !== 'active'){
    buttons.push(`<button class="btn btn-ghost btn-small" onclick="reinstateUser('${u.id}')">Reinstate</button>`);
  }
  if(u.status !== 'suspended'){
    buttons.push(`<button class="btn btn-ghost btn-small" onclick="toggleSuspendMenu('${u.id}')">Suspend${menuOpen ? ' ▴' : ' ▾'}</button>`);
  }
  if(u.status !== 'blocked'){
    buttons.push(`<button class="btn btn-rust btn-small" onclick="revokeUser('${u.id}')" title="Signs them out immediately and blocks sign-in until reinstated">Revoke access</button>`);
  }

  const menu = menuOpen ? `
    <div class="suspend-menu">
      <button class="btn btn-ghost btn-small" onclick="suspendUser('${u.id}', 24)">24 hours</button>
      <button class="btn btn-ghost btn-small" onclick="suspendUser('${u.id}', 24*7)">7 days</button>
      <button class="btn btn-ghost btn-small" onclick="suspendUser('${u.id}', 24*30)">30 days</button>
      <button class="btn btn-ghost btn-small" onclick="suspendUser('${u.id}', null)">Indefinitely</button>
    </div>` : '';

  return `<div class="user-actions">${buttons.join('')}</div>${menu}`;
}

function listManagerCardHtml(l){
  const items = l.items || [];
  const isOpen = state.listManagerOpenId === l.id;
  const itemRows = items.map((it, idx) => `
    <div class="list-manager-item">
      <div class="list-manager-item-title">${escapeHtml(it.articles.title || '(untitled)')}</div>
      <button class="btn btn-ghost btn-small" ${idx === 0 ? 'disabled' : ''} onclick="moveListItem('${l.id}','${it.id}','up')">↑</button>
      <button class="btn btn-ghost btn-small" ${idx === items.length - 1 ? 'disabled' : ''} onclick="moveListItem('${l.id}','${it.id}','down')">↓</button>
      <button class="btn btn-rust btn-small" onclick="removeArticleFromListItem('${it.id}')">Remove</button>
    </div>`).join('');

  const existingIds = new Set(items.map(it => it.article_id));
  const term = state.listArticleSearchTerm.trim().toLowerCase();
  const catFilter = state.listArticleCategoryFilter;
  const filterActive = isOpen && (term || catFilter);
  const matches = filterActive
    ? state.articles.filter(a =>
        a.status === 'approved' &&
        !existingIds.has(a.id) &&
        (!catFilter || a.category_id === catFilter) &&
        (!term || (a.title || '').toLowerCase().includes(term))
      ).slice(0, 8)
    : [];
  const searchResults = matches.map(a => `
    <div class="list-manager-search-result">
      <div class="list-manager-item-title">${escapeHtml(a.title)}</div>

// ===== Internal messaging (editor <-> contributor, one thread each) =====

async function loadUnreadTotal(){
  if(!state.session){ state.unreadTotal = 0; return; }
  const { count, error } = await sb
    .from('messages')
    .select('id', { count: 'exact', head: true })
    .is('read_at', null)
    .neq('sender_id', state.session.user.id);
  if(!error) state.unreadTotal = count || 0;
}

async function loadThreads(){
  if(!isStaff()) return;
  const { data, error } = await sb
    .from('messages')
    .select('*')
    .order('created_at', { ascending: false });
  if(error){ state.err = error.message; return; }

  const byContributor = new Map();
  (data || []).forEach(m => {
    if(!byContributor.has(m.contributor_id)){
      byContributor.set(m.contributor_id, {
        id: m.contributor_id,
        lastBody: m.body,
        lastAt: m.created_at,
        unread: 0
      });
    }
    const t = byContributor.get(m.contributor_id);
    if(m.sender_id !== state.session.user.id && !m.read_at) t.unread++;
  });

  const ids = Array.from(byContributor.keys());
  if(ids.length){
    const { data: profiles } = await sb.from('profiles').select('id,email,display_name').in('id', ids);
    (profiles || []).forEach(p => {
      const t = byContributor.get(p.id);
      if(t){ t.email = p.email; t.name = p.display_name || p.email; }
    });
  }

  state.threads = Array.from(byContributor.values())
    .sort((a, b) => new Date(b.lastAt) - new Date(a.lastAt));
  state.threadsLoaded = true;
}

async function loadThread(contributorId){
  if(!contributorId || !state.session) return;
  const { data, error } = await sb
    .from('messages')
    .select('*')
    .eq('contributor_id', contributorId)
    .order('created_at', { ascending: true });
  if(error){ state.err = error.message; return; }
  state.messages = data || [];

  const selfId = state.session.user.id;
  const unreadIds = state.messages.filter(m => m.sender_id !== selfId && !m.read_at).map(m => m.id);
  if(unreadIds.length){
    const nowIso = new Date().toISOString();
    await sb.from('messages').update({ read_at: nowIso }).in('id', unreadIds);
    state.messages.forEach(m => { if(unreadIds.includes(m.id)) m.read_at = nowIso; });
  }
  await loadUnreadTotal();
  if(isStaff()) await loadThreads();
}

function selectThread(contributorId){
  state.selectedThreadId = contributorId;
  render();
  loadThread(contributorId).then(render);
}

function messageUser(contributorId){
  state.view = 'messages';
  loadThreads().then(() => selectThread(contributorId));
}

function messageStudentAboutProgress(userId, studentName, lessonTitle){
  const firstName = (studentName || '').split(' ')[0] || 'there';
  state.messageDraft = `Hi ${firstName}, just checking in — noticed you're on ${lessonTitle} in the course. Let me know if you have any questions!`;
  messageUser(userId);
}

function clearThreadSelection(){
  state.selectedThreadId = null;

}

async function sendMessage(){
  if(!state.session) return;
  const body = (state.messageDraft || "").trim();
  if(!body) return;

  const selfId = state.session.user.id;
  const contributorId = isStaff() ? state.selectedThreadId : selfId;
  if(!contributorId) return;

  state.messageDraft = "";
  const { error } = await sb.from('messages').insert({
    contributor_id: contributorId,
    sender_id: selfId,
    body
  });
  if(error){
    state.err = error.message;
    render();
    return;
  }
  await loadThread(contributorId);
  render();
}

function messageThreadHtml(withWhom){
  const selfId = state.session.user.id;
  const bubbles = state.messages.length
    ? state.messages.map(m => `

function wireMessageComposer(){

    : `<div class="empty"><div class="glyph">†</div><p>No conversations yet.</p><p>Message a contributor from User Desk to start one.</p></div>`;

async function loadForumQuestions(){
  const { data, error } = await sb
    .from('forum_questions')
    .select('*, forum_answers!forum_answers_question_id_fkey(id)')
    .order('created_at', { ascending: false });
  if(error){ state.err = error.message; return; }
  state.forumQuestions = (data || []).map(q => ({
    ...q,
    answer_count: (q.forum_answers || []).length
  }));
  state.forumQuestionsLoaded = true;
}

async function loadForumAnswers(questionId){
  const { data, error } = await sb
    .from('forum_answers')
    .select('*')
    .eq('question_id', questionId)
    .order('created_at', { ascending: true });
  if(error){ state.err = error.message; return; }
  state.forumAnswers = data || [];
}

function getFilteredForumQuestions(){
  const q = state.forumSearchTerm.trim().toLowerCase();
  if(!q) return state.forumQuestions;
  return state.forumQuestions.filter(item => {
    const haystack = [item.title, item.body, item.author_name, item.author_email].join(' ').toLowerCase();
    return haystack.includes(q);
  });
}

function openForumComposer(){
  state.forumComposerOpen = true;
  state.selectedQuestionId = null;
  state.forumTitleDraft = "";
  state.forumBodyDraft = "";
  state.err = "";
  render();
}
function closeForumComposer(){
  state.forumComposerOpen = false;
  render();
}

async function selectQuestion(id){
  state.selectedQuestionId = id;
  state.forumComposerOpen = false;
  state.forumAnswerDraft = "";
  state.err = "";
  render();
  await loadForumAnswers(id);
  render();
}
function clearQuestionSelection(){
  state.selectedQuestionId = null;
  render();
}

async function postQuestion(){
  if(!state.session){
    state.err = "Sign in above to ask a question.";
    render();
    return;
  }
  if(accountLocked()){
    state.err = lockedMessage();
    render();
    return;
  }
  const title = state.forumTitleDraft.trim();
  const body = state.forumBodyDraft.trim();
  if(!title || !body){
    state.err = "Both a title and question text are required.";
    render();
    return;
  }
  state.err = "";
  const { data, error } = await sb.from('forum_questions').insert({
    title,
    body,
    author_email: state.session.user.email,
    author_name: displayName()
  }).select().single();
  if(error){
    state.err = error.message;
    render();
    return;
  }
  state.forumComposerOpen = false;
  state.forumTitleDraft = "";
  state.forumBodyDraft = "";
  await loadForumQuestions();
  if(data) await selectQuestion(data.id);
  render();
}

async function postAnswer(questionId){
  if(!state.session){
    state.err = "Sign in above to answer.";
    render();
    return;
  }
  if(accountLocked()){
    state.err = lockedMessage();
    render();
    return;
  }
  const body = (state.forumAnswerDraft || '').trim();
  if(!body){
    state.err = "Write an answer before posting.";
    render();
    return;
  }
  state.err = "";
  const { error } = await sb.from('forum_answers').insert({
    question_id: questionId,
    body,
    author_email: state.session.user.email,
    author_name: displayName()
  });
  if(error){
    state.err = error.message;
    render();
    return;
  }
  state.forumAnswerDraft = "";
  await loadForumAnswers(questionId);
  await loadForumQuestions();
  render();
}

async function deleteQuestion(id){
  const { error } = await sb.from('forum_questions').delete().eq('id', id);
  if(error){ state.err = error.message; }
  if(state.selectedQuestionId === id) state.selectedQuestionId = null;
  await loadForumQuestions();
  render();
}

async function deleteAnswer(id, questionId){
  const { error } = await sb.from('forum_answers').delete().eq('id', id);
  if(error){ state.err = error.message; }
  await loadForumAnswers(questionId);
  await loadForumQuestions();
  render();
}

  if(error){ state.err = error.message; }

  const isAccepted = question.accepted_answer_id === ans.id;

  return `

function forumQuestionDetailHtml(q){
  const sortedAnswers = [...state.forumAnswers].sort((a, b) => {

  const canModerateQuestion = state.session && (q.author_email === state.session.user.email || isStaff());
  const answersHtml = sortedAnswers.length
    ? sortedAnswers.map(ans => forumAnswerHtml(ans, q)).join('')
    : `<p class="hint" style="text-align:left;">No answers yet — be the first to help.</p>`;

  const composer = state.session
    ? (accountLocked()
        ? `<div class="field-note" style="margin-top:16px;">${escapeHtml(lockedMessage())}</div>`
        : `<div class="comment-composer" style="margin-top:20px;">
             <textarea id="forumAnswerDraft" placeholder="Write an answer...">${escapeHtml(state.forumAnswerDraft || '')}</textarea>
             <button class="btn btn-gold btn-small" onclick="postAnswer('${q.id}')">Post answer</button>

    : `<p class="hint" style="text-align:left;margin-top:16px;">Sign in above to answer.</p>`;

  return `
    <article class="detail-article">
      <h2>${escapeHtml(q.title)}</h2>
      <div class="byline"><b>${escapeHtml(q.author_name || q.author_email)}</b> · ${fmtDate(q.created_at)}${canModerateQuestion ? ` · <a href="javascript:void(0)" class="toggle-link" onclick="deleteQuestion('${q.id}')">Delete</a>` : ''}</div>
      <div class="body-text" style="margin-top:18px;">${escapeHtml(q.body)}</div>
      <div class="comments-heading" style="margin-top:28px;">${sortedAnswers.length} ${sortedAnswers.length === 1 ? 'Answer' : 'Answers'}</div>
      ${answersHtml}
      ${composer}
    </article>`;
}

    ? forumComposerHtml()

      : `<div class="detail-empty"><div class="glyph">†</div><div class="welcome-message">
          <p class="welcome-heading">Forum</p>
          <p class="welcome-copy">Ask a question about doctrine, Scripture, or anything you're wrestling with, and let the community weigh in. Anyone can read; signing in lets you ask and answer.</p>
          <p class="welcome-copy" style="margin-bottom:0;">Select a question on the left, or ask your own.</p>
        </div></div>`;

  main.innerHTML = `
    <div class="split ${(state.selectedQuestionId || state.forumComposerOpen) ? 'has-selection' : ''}">
      <div class="split-list">
        <div class="feed-tools">
          ${askButton}

          </div>

  const fs = document.getElementById('forumSearch');

  const fa = document.getElementById('forumAnswerDraft');

// ===== Prayer requests =====

async function loadPrayerRequests(){
  const { data, error } = await sb
    .from('prayer_requests')
    .select('*, prayer_responses(reaction_type)')
    .order('created_at', { ascending: false });
  if(error){ state.err = error.message; return; }
  state.prayerRequests = (data || []).map(r => {
    const counts = {};
    (r.prayer_responses || []).forEach(resp => {
      counts[resp.reaction_type] = (counts[resp.reaction_type] || 0) + 1;
    });
    const total = (r.prayer_responses || []).length;
    return { ...r, reaction_counts: counts, reaction_total: total };
  });
  state.prayerRequestsLoaded = true;
}

async function loadPrayerResponseStatus(requestId){
  if(!state.session) return;
  const { data } = await sb
    .from('prayer_responses')
    .select('reaction_type')
    .eq('request_id', requestId)
    .eq('user_id', state.session.user.id)
    .maybeSingle();
  state.prayerResponseStatus[requestId] = data ? data.reaction_type : null;
}

async function reactToPrayer(requestId, reactionType){
  if(!state.session){
    state.err = "Sign in above to respond.";
    render();
    return;
  }
  if(accountLocked()){
    state.err = lockedMessage();
    render();
    return;
  }
  const selfId = state.session.user.id;
  const current = state.prayerResponseStatus[requestId];

  if(current === reactionType){
    // Clicking the same reaction again removes it.
    await sb.from('prayer_responses').delete().eq('request_id', requestId).eq('user_id', selfId);
    state.prayerResponseStatus[requestId] = null;
  } else {
    const { error } = await sb.from('prayer_responses')
      .upsert({ request_id: requestId, user_id: selfId, reaction_type: reactionType }, { onConflict: 'request_id,user_id' });
    if(error){ state.err = error.message; render(); return; }
    state.prayerResponseStatus[requestId] = reactionType;
  }
  await loadPrayerRequests();
  render();
}

// ===== The Flint Academy =====

async function loadAcademyCatalog(){
  const { data: subjects } = await sb.from('academy_subjects').select('*').order('sort_order');
  const { data: courses } = await sb.from('academy_courses').select('*').eq('status', 'published').order('sort_order');
  state.academySubjects = subjects || [];
  state.academyCourses = courses || [];

  if(state.session){
    const { data: enrollments } = await sb.from('academy_enrollments').select('*').eq('user_id', state.session.user.id);
    state.academyEnrollments = {};
    (enrollments || []).forEach(e => { state.academyEnrollments[e.course_id] = e; });

    const { data: certs } = await sb.from('academy_certificates').select('*').eq('user_id', state.session.user.id);
    state.academyCertificates = {};
    (certs || []).forEach(c => { state.academyCertificates[c.course_id] = c; });
  }
}

async function loadAcademyCourseDetail(courseId){
  const { data: sections } = await sb.from('academy_sections').select('*').eq('course_id', courseId).order('sort_order');
  state.academySections = sections || [];

  const { data: lessons } = await sb.from('academy_lessons').select('*').eq('course_id', courseId).order('sort_order');
  state.academyLessons = lessons || [];

  if(state.session){
    const lessonIds = state.academyLessons.map(l => l.id);
    if(lessonIds.length){
      const { data: progress } = await sb.from('academy_lesson_progress')
        .select('*').eq('user_id', state.session.user.id).in('lesson_id', lessonIds);
      state.academyProgress = {};
      (progress || []).forEach(p => { state.academyProgress[p.lesson_id] = p; });
    }
  }
}

function academyLessonStatus(lessonId){
  const p = state.academyProgress[lessonId];
  return p ? p.status : 'locked';
}

async function enrollInAcademyCourse(courseId){
  if(!state.session){
    state.err = "Sign in above to enroll.";

  await openAcademyCourse(courseId);

function goToAcademyHome(){

function backToAcademyCourse(){

async function openAcademyLesson(lessonId){
  const status = academyLessonStatus(lessonId);
  if(status === 'locked'){
    state.err = "Complete the previous lesson first.";
    render();
    return;
  }
  state.academySelectedLessonId = lessonId;
  state.academyView = 'lesson';
  state.academyQuizAnswers = {};
  state.academyQuizResult = null;
  state.academyEssayDraft = "";
  state.academyEssayResult = null;
  state.academyLiveLinkedArticle = null;
  state.academyChapterCourseCompleted = false;
  state.err = "";
  render();

  const lesson = state.academyLessons.find(l => l.id === lessonId);
  if(lesson && (lesson.type === 'summary_quiz' || lesson.type === 'section_quiz')){
    const { data } = await sb.from('academy_quiz_questions').select('*').eq('lesson_id', lessonId).order('sort_order');
    state.academyQuizQuestions = data || [];
    render();
  } else {
    state.academyQuizQuestions = [];
  }
  if(lesson && lesson.type === 'chapter' && lesson.link_mode === 'live' && lesson.source_article_id){
    state.academyLiveLinkedArticle = { lessonId, article: undefined };
    render();
    const { data: article } = await sb.from('articles').select('*').eq('id', lesson.source_article_id).eq('status', 'approved').maybeSingle();
    if(state.academyLiveLinkedArticle && state.academyLiveLinkedArticle.lessonId === lessonId){
      state.academyLiveLinkedArticle.article = article || null;
      render();
    }
  }
  await loadAcademyTranslationsForView();
  render();
}

async function submitAcademyQuiz(){
  const lessonId = state.academySelectedLessonId;
  const answers = {};
  state.academyQuizQuestions.forEach(q => {
    if(state.academyQuizAnswers[q.id]) answers[q.id] = state.academyQuizAnswers[q.id];
  });
  if(Object.keys(answers).length < state.academyQuizQuestions.length){
    state.err = "Answer every question before submitting.";
    render();
    return;
  }
  state.err = "";
  const { data, error } = await sb.rpc('academy_submit_quiz', { p_lesson_id: lessonId, p_answers: answers });
  if(error){ state.err = error.message; render(); return; }
  state.academyQuizResult = data;
  await loadAcademyCourseDetail(state.academySelectedCourseId);
  render();
}

async function submitAcademyChapterRead(){
  const lessonId = state.academySelectedLessonId;
  const { error } = await sb.rpc('academy_complete_chapter', { p_lesson_id: lessonId });
  if(error){ state.err = error.message; render(); return; }
  const { data: completionData } = await sb.rpc('academy_check_course_completion', { p_lesson_id: lessonId });
  await loadAcademyCatalog();
  await loadAcademyCourseDetail(state.academySelectedCourseId);
  if(completionData && completionData.course_completed){
    state.academyChapterCourseCompleted = true;
    render();
  } else {
    backToAcademyCourse();
  }
}

async function submitAcademyEssay(){
  const lessonId = state.academySelectedLessonId;
  const body = state.academyEssayDraft.trim();
  if(!body){
    state.err = "Write your reflection before submitting.";
    render();
    return;
  }
  state.err = "";
  const { data, error } = await sb.rpc('academy_submit_essay', { p_lesson_id: lessonId, p_body: body });
  if(error){ state.err = error.message; render(); return; }
  if(data && data.error){
    state.academyEssayResult = data;
    render();
    return;
  }
  // The RPC above only validates word count and marks the lesson complete —
  // it doesn't persist the essay text anywhere. This upsert is what makes
  // the writing itself reviewable; RLS only allows a student to write their
  // own row as 'pending', so this can never self-approve.
  await sb.from('academy_essay_submissions').upsert({
    lesson_id: lessonId,
    user_id: state.session.user.id,
    student_name: displayName(),
    student_email: state.session.user.email,
    body,
    word_count: academyWordCount(body),
    status: 'pending',
    reviewed_by: null,
    reviewed_at: null,
    updated_at: new Date().toISOString()
  }, { onConflict: 'lesson_id,user_id' });
  await sb.rpc('academy_check_course_completion', { p_lesson_id: lessonId });
  state.academyEssayResult = data;
  await loadAcademyCatalog();
  await loadAcademyCourseDetail(state.academySelectedCourseId);
  render();
}

function academyClosingDownloadHtml(course){

function academyWordCount(text){

async function loadAcademyEssaySubmissions(){
  const { data } = await sb.from('academy_essay_submissions').select('*').order('created_at', { ascending: false });
  const subs = data || [];

  // Review Desk doesn't otherwise load Academy lesson/course data — fetch
  // just enough context (lesson + course title) to show each submission
  // meaningfully, without pulling in the whole Academy Desk dataset.
  const lessonIds = [...new Set(subs.map(s => s.lesson_id))];
  let lessonMap = {};
  if(lessonIds.length){
    const { data: lessons } = await sb.from('academy_lessons').select('id, title, course_id').in('id', lessonIds);
    const courseIds = [...new Set((lessons || []).map(l => l.course_id))];
    let courseMap = {};
    if(courseIds.length){
      const { data: courses } = await sb.from('academy_courses').select('id, title').in('id', courseIds);
      (courses || []).forEach(c => { courseMap[c.id] = c.title; });
    }
    (lessons || []).forEach(l => { lessonMap[l.id] = { title: l.title, courseTitle: courseMap[l.course_id] || '' }; });
  }

  state.academyEssaySubmissions = subs.map(s => ({
    ...s,
    lessonTitle: (lessonMap[s.lesson_id] && lessonMap[s.lesson_id].title) || '(lesson not found)',
    courseTitle: (lessonMap[s.lesson_id] && lessonMap[s.lesson_id].courseTitle) || ''
  }));
  state.academyEssaySubmissionsLoaded = true;
}

async function findOrCreateAcademyEssayArticle(lessonId, lessonTitle){
  const { data: existing } = await sb.from('articles').select('*').eq('academy_lesson_id', lessonId).maybeSingle();

  const { data: created, error } = await sb.from('articles').insert({

    body: '',
    author_name: displayName(),
    author_email: state.session.user.email,
    status: 'approved',
    academy_lesson_id: lessonId
  }).select().single();
