<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apostolic Oneness — Articles of Faith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#14161c;
    --ink-800:#1b1e27;
    --ink-700:#242833;
    --ink-line:#333846;
    --paper:#ecedf2;
    --slate:#8890a2;
    --gold:#cda45e;
    --gold-dim:rgba(205,164,94,0.14);
    --green:#6fae82;
    --green-dim:rgba(111,174,130,0.14);
    --amber:#d9a441;
    --amber-dim:rgba(217,164,65,0.14);
    --rust:#b85c4f;
    --rust-dim:rgba(184,92,79,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink-900);color:var(--paper);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  html,body{height:100vh;height:100dvh;}
  body{display:flex;flex-direction:column;overflow:hidden;}
  a{color:inherit;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;flex:1 1 auto;min-height:0;}
  .masthead{padding:40px 0 0;flex:0 0 auto;}
  .masthead-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;flex-direction:column;gap:6px;}
  .brand h1{font-family:'Fraunces',serif;font-weight:600;font-size:40px;letter-spacing:-0.01em;margin:0;}
  .brand .tagline{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--slate);}
  .rule-thick{border:none;border-top:2px solid var(--paper);margin:24px 0 0;}
  .auth-box{min-width:240px;}
  .auth-tabs{display:flex;gap:4px;justify-content:flex-end;margin-bottom:6px;}
  .auth-tab{background:none;border:none;color:var(--slate);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;padding:4px 8px;cursor:pointer;border-bottom:2px solid transparent;}
  .auth-tab.active{color:var(--paper);border-bottom-color:var(--gold);}
  .auth-tab:hover{color:var(--paper);}
  .auth-box .who{display:flex;align-items:center;gap:10px;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:8px;padding:8px 12px;font-size:13px;}
  .auth-box .who .seal{width:22px;height:22px;border-radius:50%;background:var(--gold-dim);color:var(--gold);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;flex-shrink:0;}
  .auth-box .name{font-weight:500;}
  .auth-box .role-admin{color:var(--gold);font-size:11px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.06em;}
  .auth-box .role-user{color:var(--slate);font-size:11px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.06em;}
  .auth-box .signout{margin-left:auto;background:none;border:none;color:var(--slate);cursor:pointer;font-size:12px;text-decoration:underline;padding:0;font-family:'Inter',sans-serif;}
  .auth-box .signout:hover{color:var(--paper);}
  .login-form{display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .login-form .row{display:flex;gap:8px;}
  input[type=text],input[type=email]{background:var(--ink-800);border:1px solid var(--ink-line);color:var(--paper);border-radius:6px;padding:8px 10px;font-size:13px;font-family:'Inter',sans-serif;outline:none;}
  input[type=text]:focus,input[type=email]:focus,textarea:focus{border-color:var(--gold);}
  .login-form input{width:190px;}
  .btn{background:var(--paper);color:var(--ink-900);border:none;border-radius:6px;padding:8px 14px;font-family:'Inter',sans-serif;font-weight:500;font-size:13px;cursor:pointer;}
  .btn:hover{opacity:0.88;}
  .btn-ghost{background:none;border:1px solid var(--ink-line);color:var(--paper);}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
  .btn-gold{background:var(--gold);color:#241a08;}
  .btn-rust{background:none;border:1px solid var(--rust);color:var(--rust);}
  .btn-small{padding:5px 10px;font-size:12px;}
  .hint{font-size:11px;color:var(--slate);margin-top:2px;text-align:right;}
  .nav{display:flex;gap:2px;margin-top:28px;flex-wrap:wrap;flex:0 0 auto;}
  .nav button{background:none;border:none;color:var(--slate);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;}
  .nav button.active{color:var(--paper);border-bottom-color:var(--gold);}
  .nav button:hover{color:var(--paper);}
  .nav .count{display:inline-block;margin-left:6px;background:var(--amber-dim);color:var(--amber);border-radius:10px;padding:1px 6px;font-size:10px;}
  #main{flex:1 1 auto;min-height:0;overflow:hidden;}
  .scroll-panel{height:100%;overflow-y:auto;}
  .narrow{max-width:640px;margin:0 auto;padding:24px 20px 60px;}
  .split{display:flex;height:100%;}
  .split-list{width:340px;flex:0 0 340px;overflow-y:auto;min-height:0;border-right:1px solid var(--ink-line);}
  .split-detail{flex:1 1 auto;overflow-y:auto;min-height:0;padding:28px 40px 60px;}
  .list-row{padding:14px 20px;border-bottom:1px solid var(--ink-line);cursor:pointer;border-left:3px solid transparent;}
  .list-row:hover{background:var(--ink-800);}
  .list-row.active{background:var(--ink-800);border-left-color:var(--gold);}
  .list-row-title{font-family:'Fraunces',serif;font-size:15px;font-weight:600;line-height:1.3;margin-bottom:5px;}
  .list-row-meta{font-size:11px;color:var(--slate);font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .stamp-mini{display:inline-block;padding:1px 7px;border-radius:8px;font-size:9px;letter-spacing:0.04em;text-transform:uppercase;}
  .stamp-mini.approved{color:var(--green);background:var(--green-dim);}
  .stamp-mini.pending{color:var(--amber);background:var(--amber-dim);}
  .stamp-mini.rejected{color:var(--rust);background:var(--rust-dim);}
  .stamp-mini.draft{color:var(--slate);background:rgba(136,144,162,0.14);}
  .detail-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:18px;color:var(--slate);text-align:center;overflow-y:auto;}
  .welcome-message{max-width:560px;line-height:1.7;color:var(--slate);text-align:left;}
  .welcome-heading{margin:0 0 10px;color:var(--paper);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;}
  .welcome-copy{margin:0 0 14px;}
  .feed-tools{padding:14px 16px;border-bottom:1px solid var(--ink-line);background:var(--ink-900);display:flex;align-items:center;gap:8px;}
  .feed-search-wrap{flex:1 1 auto;}
  .feed-search{width:100%;background:var(--ink-800);border:1px solid var(--ink-line);border-radius:8px;padding:10px 12px;color:var(--paper);font-size:13px;font-family:'Inter',sans-serif;outline:none;}
  .feed-search:focus{border-color:var(--gold);}
  .clear-search{background:none;border:1px solid var(--ink-line);color:var(--slate);border-radius:6px;padding:8px 10px;font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;}
  .clear-search:hover:not(:disabled){border-color:var(--gold);color:var(--paper);}
  .clear-search:disabled{opacity:0.4;cursor:not-allowed;}
  .detail-article h2{font-family:'Fraunces',serif;font-weight:600;font-size:26px;line-height:1.25;margin:0 0 8px;}
  .engage-row{display:flex;gap:10px;margin-top:24px;align-items:center;}
  .comments-section{margin-top:34px;padding-top:22px;border-top:1px solid var(--ink-line);}
  .comment{padding:12px 0;border-bottom:1px solid var(--ink-line);}
  .comment-meta{font-size:12px;color:var(--slate);font-family:'IBM Plex Mono',monospace;display:flex;gap:8px;align-items:center;}
  .comment-meta b{color:var(--paper);font-weight:500;font-family:'Inter',sans-serif;}
  .comment-body{margin-top:6px;font-size:14px;color:#d6d8de;line-height:1.55;white-space:pre-wrap;}
  .comment-actions{margin-top:8px;display:flex;gap:10px;align-items:center;}
  .comment-reply{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
  .comment-reply textarea{min-height:70px;}
  .reply-actions{display:flex;justify-content:flex-end;gap:8px;}
  .comment-form{margin-top:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .comment-form textarea{min-height:70px;}
  .back-link{display:none;color:var(--gold);text-decoration:none;font-size:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;margin-bottom:18px;}
  .article{padding:26px 0;border-bottom:1px solid var(--ink-line);}
  .article:first-child{padding-top:0;}
  .article-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
  .article h2{font-family:'Fraunces',serif;font-weight:600;font-size:24px;line-height:1.25;margin:0 0 8px;cursor:pointer;}
  .article h2:hover{color:var(--gold);}
  .byline{font-size:12px;color:var(--slate);font-family:'IBM Plex Mono',monospace;}
  .byline b{color:var(--paper);font-weight:500;font-family:'Inter',sans-serif;}
  .excerpt{margin-top:12px;color:#c3c6cf;font-size:15px;line-height:1.65;}
  .body-text{margin-top:16px;color:#d6d8de;font-size:16px;line-height:1.75;white-space:pre-wrap;}
  .toggle-link{color:var(--gold);text-decoration:none;font-size:0.9em;white-space:nowrap;cursor:pointer;}
  .toggle-link:hover{text-decoration:underline;}
  .article-actions{margin-top:14px;display:flex;gap:8px;}
  .stamp{flex-shrink:0;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:0.04em;text-transform:uppercase;border:1.5px solid currentColor;transform:rotate(-8deg);line-height:1.2;}
  .stamp.approved{color:var(--green);background:var(--green-dim);}
  .stamp.pending{color:var(--amber);background:var(--amber-dim);}
  .stamp.rejected{color:var(--rust);background:var(--rust-dim);}
  .empty{padding:60px 0;text-align:center;color:var(--slate);}
  .empty .glyph{font-family:'Fraunces',serif;font-size:32px;color:var(--ink-line);margin-bottom:10px;}
  .empty p{margin:4px 0;font-size:14px;}
  .panel{background:var(--ink-800);border:1px solid var(--ink-line);border-radius:10px;padding:24px;}
  .panel label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--slate);margin-bottom:6px;}
  .field{margin-bottom:18px;}
  .field input[type=text]{width:100%;font-size:15px;padding:10px 12px;}
  textarea{width:100%;min-height:220px;resize:vertical;background:var(--ink-900);border:1px solid var(--ink-line);color:var(--paper);border-radius:6px;padding:12px;font-family:'Inter',sans-serif;font-size:15px;line-height:1.6;outline:none;}
  textarea:focus{border-color:var(--gold);}
  .submit-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:16px;flex-wrap:wrap;}
  .field-note{font-size:12px;color:var(--slate);}
  .queue-item{background:var(--ink-800);border:1px solid var(--ink-line);border-radius:10px;padding:20px;margin-bottom:14px;}
  .queue-item h3{font-family:'Fraunces',serif;font-size:19px;margin:0 0 6px;font-weight:600;}
  .queue-actions{display:flex;gap:8px;margin-top:14px;}
  .locked-msg{padding:40px 0;text-align:center;color:var(--slate);font-size:14px;}
  .locked-msg .glyph{font-family:'Fraunces',serif;font-size:28px;color:var(--ink-line);margin-bottom:8px;}
  .banner-note{font-size:13px;border-radius:6px;padding:10px 12px;margin-bottom:18px;}
  @media(max-width:520px){
    .brand h1{font-size:30px;}
    .masthead-top{flex-direction:column;}
    .login-form{align-items:stretch;}
  }
  @media(max-width:760px){
    .split-detail{display:none;padding:20px 20px 60px;}
    .split.has-selection .split-list{display:none;}
    .split.has-selection .split-detail{display:block;}
    .back-link{display:inline-block;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="masthead-top">
      <div class="brand">
        <h1>Apostolic Oneness</h1>
        <div class="tagline">articles of faith · reviewed and published</div>
      </div>
      <div class="auth-box" id="authBox"></div>
    </div>
    <hr class="rule-thick">
  </div>
  <div class="nav" id="nav"></div>
  <div id="banner"></div>
  <main id="main"></main>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
const EDITOR_EMAIL = window.EDITOR_EMAIL;

let state = {
  session: null,
  view: "feed",
  articles: [],
  selectedId: null,
  likeCount: 0,
  userLiked: false,
  comments: [],
  commentDraft: "",
  shareCopied: null,
  loginEmail: "",
  loginPassword: "",
  authMode: "link",
  magicLinkSent: false,
  resetSent: false,
  nameDraft: "",
  showPasswordSet: false,
  passwordDraft: "",
  passwordSaved: false,
  submitTitle: "",
  submitBody: "",
  editingArticleId: null,
  draftSaved: false,
  err: "",
  loading: true,
  searchTerm: "",
  replyTargetId: null,
  replyDrafts: {}
};

function isEditor(){
  return !!state.session && state.session.user.email === EDITOR_EMAIL;
}
function displayName(){
  if(!state.session) return "";
  return state.session.user.user_metadata && state.session.user.user_metadata.full_name || "";
}
function initials(name){
  if(!name) return "?";
  const parts = name.trim().split(/\s+/);
  return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
}
function fmtDate(iso){
  return new Date(iso).toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'});
}
function escapeHtml(s){
  const d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}

async function sendMagicLink(){
  const email = state.loginEmail.trim().toLowerCase();
  if(!email || !email.includes("@")){
    state.err = "Enter a valid email.";
    render();
    return;
  }
  state.err = "";
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.origin + window.location.pathname }
  });
  if(error){
    state.err = error.message;
  } else {
    state.magicLinkSent = true;
  }
  render();
}

function setAuthMode(mode){
  state.authMode = mode;
  state.err = "";
  state.resetSent = false;
  render();
}

async function signInWithPassword(){
  const email = state.loginEmail.trim().toLowerCase();
  const password = state.loginPassword;
  if(!email || !email.includes("@")){
    state.err = "Enter a valid email.";
    render();
    return;
  }
  if(!password){
    state.err = "Enter your password.";
    render();
    return;
  }
  state.err = "";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    state.err = error.message;
    render();
  }
  // On success, onAuthStateChange handles the redraw.
}

async function signUpWithPassword(){
  const email = state.loginEmail.trim().toLowerCase();
  const password = state.loginPassword;
  if(!email || !email.includes("@")){
    state.err = "Enter a valid email.";
    render();
    return;
  }
  if(!password || password.length < 6){
    state.err = "Choose a password with at least 6 characters.";
    render();
    return;
  }
  state.err = "";
  const { data, error } = await sb.auth.signUp({
    email,
    password,
    options: { emailRedirectTo: window.location.origin + window.location.pathname }
  });
  if(error){
    state.err = error.message;
    render();
    return;
  }
  if(data.session){
    // Email confirmation is off; signed in immediately, onAuthStateChange handles redraw.
    return;
  }
  state.err = "";
  state.magicLinkSent = true; // reuse the "check your inbox" notice for the confirmation email
  render();
}

async function sendPasswordReset(){
  const email = state.loginEmail.trim().toLowerCase();
  if(!email || !email.includes("@")){
    state.err = "Enter your email above first.";
    render();
    return;
  }
  state.err = "";
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });
  if(error){
    state.err = error.message;
  } else {
    state.resetSent = true;
  }
  render();
}

function toggleSetPassword(){
  state.showPasswordSet = !state.showPasswordSet;
  state.passwordDraft = "";
  state.passwordSaved = false;
  state.err = "";
  render();
}

async function savePassword(){
  const password = state.passwordDraft;
  if(!password || password.length < 6){
    state.err = "Choose a password with at least 6 characters.";
    render();
    return;
  }
  state.err = "";
  const { error } = await sb.auth.updateUser({ password });
  if(error){
    state.err = error.message;
  } else {
    state.passwordSaved = true;
    state.passwordDraft = "";
  }
  render();
}

async function saveName(){
  const name = state.nameDraft.trim();
  if(!name){
    state.err = "Enter a name for your byline.";
    render();
    return;
  }
  state.err = "";
  const { error } = await sb.auth.updateUser({ data: { full_name: name } });
  if(error){
    state.err = error.message;
  } else {
    await sb.auth.refreshSession();
  }
  render();
}

async function handleSignOut(){
  await sb.auth.signOut();
  state.session = null;
  state.view = "feed";
  state.loginEmail = "";
  state.loginPassword = "";
  state.magicLinkSent = false;
  state.resetSent = false;
  state.showPasswordSet = false;
  state.passwordDraft = "";
  state.passwordSaved = false;
  state.nameDraft = "";
  state.submitTitle = "";
  state.submitBody = "";
  state.editingArticleId = null;
  state.draftSaved = false;
  state.selectedId = null;
  state.likeCount = 0;
  state.userLiked = false;
  state.comments = [];
  state.commentDraft = "";
  state.replyTargetId = null;
  state.replyDrafts = {};
  state.err = "";
  await loadArticles();
  render();
}

async function loadArticles(){
  let query = sb.from('articles').select('*').order('created_at', { ascending: false });
  const { data, error } = await query;
  if(!error){
    state.articles = data || [];
  }
}

async function saveDraft(){
  const title = state.submitTitle.trim();
  const body = state.submitBody.trim();
  if(!title && !body){
    state.err = "Write something before saving a draft.";
    render();
    return;
  }
  state.err = "";
  if(state.editingArticleId){
    const { error } = await sb.from('articles')
      .update({ title, body })
      .eq('id', state.editingArticleId);
    if(error){
      state.err = error.message;
      render();
      return;
    }
  } else {
    const { data, error } = await sb.from('articles')
      .insert({
        title,
        body,
        author_email: state.session.user.email,
        author_name: displayName(),
        status: 'draft'
      })
      .select()
      .single();
    if(error){
      state.err = error.message;
      render();
      return;
    }
    state.editingArticleId = data.id;
  }
  state.draftSaved = true;
  await loadArticles();
  render();
}

function newSubmission(){
  state.editingArticleId = null;
  state.submitTitle = "";
  state.submitBody = "";
  state.draftSaved = false;
  state.err = "";
  render();
}

function editDraft(id){
  const a = state.articles.find(x => x.id === id);
  if(!a) return;
  state.editingArticleId = id;
  state.submitTitle = a.title;
  state.submitBody = a.body;
  state.draftSaved = false;
  state.selectedId = null;
  state.err = "";
  state.view = "submit";
  render();
}

async function deleteDraft(id){
  const { error } = await sb.from('articles').delete().eq('id', id);
  if(error){
    state.err = error.message;
  }
  if(state.editingArticleId === id) newSubmission();
  state.selectedId = null;
  await loadArticles();
  render();
}

async function submitArticle(){
  const title = state.submitTitle.trim();
  const body = state.submitBody.trim();
  if(!title || !body){
    state.err = "Both a title and article text are required.";
    render();
    return;
  }
  state.err = "";
  let error;
  if(state.editingArticleId){
    const patch = { title, body, status: isEditor() ? 'approved' : 'pending' };
    if(isEditor()) patch.approved_at = new Date().toISOString();
    ({ error } = await sb.from('articles').update(patch).eq('id', state.editingArticleId));
  } else {
    ({ error } = await sb.from('articles').insert({
      title,
      body,
      author_email: state.session.user.email,
      author_name: displayName()
    }));
  }
  if(error){
    state.err = error.message;
    render();
    return;
  }
  state.submitTitle = "";
  state.submitBody = "";
  state.editingArticleId = null;
  state.draftSaved = false;
  state.selectedId = null;
  state.view = isEditor() ? "feed" : "desk";
  await loadArticles();
  render();
}

async function saveArticleEdit(){
  const title = state.submitTitle.trim();
  const body = state.submitBody.trim();
  if(!title || !body){
    state.err = "Both a title and article text are required.";
    render();
    return;
  }
  state.err = "";
  const { error } = await sb.from('articles').update({ title, body }).eq('id', state.editingArticleId);
  if(error){
    state.err = error.message;
    render();
    return;
  }
  state.submitTitle = "";
  state.submitBody = "";
  state.editingArticleId = null;
  state.draftSaved = false;
  state.selectedId = null;
  state.view = "review";
  await loadArticles();
  render();
}

async function setStatus(id, status){
  const patch = { status };
  if(status === 'approved') patch.approved_at = new Date().toISOString();
  const { error } = await sb.from('articles').update(patch).eq('id', id);
  if(error){
    state.err = error.message;
  }
  state.selectedId = null;
  await loadArticles();
  render();
}

function stampHtml(status){
  const label = status === "approved" ? "Approved" : status === "pending" ? "Pending" : "Declined";
  return `<div class="stamp ${status}">${label}</div>`;
}

function stampMini(status){
  const label = status === "approved" ? "Published" : status === "pending" ? "Pending" : status === "draft" ? "Draft" : "Declined";
  return `<span class="stamp-mini ${status}">${label}</span>`;
}

function slugify(str){
  return (str || '')
    .toString()
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 60);
}

function shortCode(id){
  return (id || '').replace(/-/g, '').slice(0, 8);
}

function articleSlug(a){
  const parts = [slugify(a.author_name || a.author_email), slugify(a.title)].filter(Boolean);
  return parts.join('-') + (parts.length ? '-' : '') + shortCode(a.id);
}

function selectArticle(id){
  state.selectedId = id;
  state.likeCount = 0;
  state.userLiked = false;
  state.comments = [];
  state.commentDraft = "";
  state.replyTargetId = null;
  state.replyDrafts = {};
  state.err = "";
  render();
  if(state.view === 'feed'){
    const a = state.articles.find(x => x.id === id);
    const slug = a ? articleSlug(a) : id;
    if(window.location.hash !== '#article-' + slug) window.location.hash = 'article-' + slug;
    loadArticleExtras(id);
  }
}

function clearSelection(){
  state.selectedId = null;
  state.err = "";
  if(state.view === 'feed' && window.location.hash){
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }
  render();
}

function openArticleFromHash(){
  const m = window.location.hash.match(/^#article-(.+)$/);
  if(!m) return;
  const raw = m[1];
  const code = raw.split('-').pop();
  const a = state.articles.find(x => shortCode(x.id) === code) || state.articles.find(x => x.id === raw);
  if(!a) return;
  if(state.selectedId === a.id && state.view === 'feed') return;
  state.view = 'feed';
  state.selectedId = a.id;
  state.likeCount = 0;
  state.userLiked = false;
  state.comments = [];
  state.commentDraft = "";
  render();
  loadArticleExtras(a.id);
}

async function loadArticleExtras(articleId){
  const [likesRes, commentsRes] = await Promise.all([
    sb.from('article_likes').select('user_email').eq('article_id', articleId),
    sb.from('article_comments').select('*').eq('article_id', articleId).order('created_at', { ascending: true })
  ]);
  const likeRows = likesRes.data || [];
  state.likeCount = likeRows.length;
  state.userLiked = state.session ? likeRows.some(r => r.user_email === state.session.user.email) : false;
  state.comments = commentsRes.data || [];
  render();
}

async function toggleLike(articleId){
  if(!state.session){
    state.err = "Sign in above to like this article.";
    render();
    return;
  }
  const email = state.session.user.email;
  if(state.userLiked){
    state.userLiked = false;
    state.likeCount = Math.max(0, state.likeCount - 1);
    render();
    await sb.from('article_likes').delete().eq('article_id', articleId).eq('user_email', email);
  } else {
    state.userLiked = true;
    state.likeCount += 1;
    render();
    await sb.from('article_likes').insert({ article_id: articleId, user_email: email });
  }
  await loadArticleExtras(articleId);
}

async function shareArticle(id){
  const a = state.articles.find(x => x.id === id);
  const slug = a ? articleSlug(a) : id;
  const url = window.location.origin + window.location.pathname + '#article-' + slug;
  if(navigator.share){
    try { await navigator.share({ title: a ? a.title : 'Article', url }); }
    catch(e) { /* user cancelled — ignore */ }
    return;
  }
  try {
    await navigator.clipboard.writeText(url);
    state.shareCopied = id;
    render();
    setTimeout(() => { if(state.shareCopied === id){ state.shareCopied = null; render(); } }, 2000);
  } catch(e) {
    state.err = "Couldn't copy the link — copy it from the address bar instead.";
    render();
  }
}

async function postComment(articleId){
  if(!state.session){
    state.err = "Sign in above to comment.";
    render();
    return;
  }
  const body = (state.commentDraft || "").trim();
  if(!body){
    state.err = "Write something before posting.";
    render();
    return;
  }
  state.err = "";
  const { error } = await sb.from('article_comments').insert({
    article_id: articleId,
    author_email: state.session.user.email,
    author_name: displayName(),
    body
  });
  if(error){
    state.err = error.message;
    render();
    return;
  }
  state.commentDraft = "";
  await loadArticleExtras(articleId);
}

async function deleteComment(commentId, articleId){
  const { error } = await sb.from('article_comments').delete().eq('id', commentId);
  if(error){ state.err = error.message; }
  await loadArticleExtras(articleId);
}

function startReply(commentId){
  const comment = state.comments.find(c => c.id === commentId);
  if(!comment){ return; }
  const name = comment.author_name || comment.author_email || 'user';
  const tagged = '@' + name + ' ';
  state.replyTargetId = comment.id;
  state.replyDrafts[comment.id] = state.replyDrafts[comment.id] && state.replyDrafts[comment.id].trim() ? state.replyDrafts[comment.id] : tagged;
  state.err = "";
  render();
  const input = document.getElementById('replyInput-' + comment.id);
  if(input){
    input.focus();
    const target = tagged;
    const open = input.value.startsWith(target) ? target.length : 0;
    const end = input.value.length;
    input.setSelectionRange(open, end);
  }
}

function cancelReply(){
  state.replyTargetId = null;
  render();
}

async function postReply(articleId, commentId){
  if(!state.session){
    state.err = "Sign in above to reply.";
    render();
    return;
  }
  const parent = state.comments.find(c => c.id === commentId);
  if(!parent){
    state.err = "That comment is no longer available.";
    render();
    return;
  }
  const raw = (state.replyDrafts[commentId] || "").trim();
  if(!raw){
    state.err = "Write a reply before posting.";
    render();
    return;
  }
  const mention = '@' + (parent.author_name || parent.author_email || 'user');
  const body = raw.startsWith(mention) ? raw : mention + ' ' + raw;
  state.err = "";
  const { error } = await sb.from('article_comments').insert({
    article_id: articleId,
    author_email: state.session.user.email,
    author_name: displayName(),
    body
  });
  if(error){
    state.err = error.message;
    render();
    return;
  }
  state.replyDrafts[commentId] = "";
  state.replyTargetId = null;
  await loadArticleExtras(articleId);
}

function getFilteredPublishedArticles(){
  const approved = state.articles.filter(a => a.status === 'approved');
  const q = state.searchTerm.trim().toLowerCase();
  if(!q) return approved;
  return approved.filter(a => {
    const haystack = [
      a.title,
      a.author_name,
      a.author_email,
      a.body
    ].join(' ').toLowerCase();
    return haystack.includes(q);
  });
}

function renderNav(){
  const nav = document.getElementById('nav');
  const feedCount = getFilteredPublishedArticles().length;
  if(!state.session || !displayName()){
    nav.innerHTML = `<button class="active">Feed (${feedCount})</button>`;
    return;
  }
  const admin = isEditor();
  const pendingCount = state.articles.filter(a => a.status === 'pending').length;
  const tabs = [
    {id:'feed', label:`Feed (${feedCount})`},
    {id:'submit', label:'Submit'},
    {id:'desk', label:'My desk'}
  ];
  if(admin) tabs.push({id:'review', label:'Review desk', count: pendingCount});
  nav.innerHTML = tabs.map(t => `
    <button class="${state.view===t.id?'active':''}" onclick="setView('${t.id}')">
      ${t.label}${t.count ? `<span class="count">${t.count}</span>` : ''}
    </button>`).join('');
}

function setView(v){
  if(v === 'submit'){
    state.editingArticleId = null;
    state.submitTitle = "";
    state.submitBody = "";
    state.draftSaved = false;
  }
  state.view = v;
  state.selectedId = null;
  state.err = "";
  render();
}

function renderBanner(){
  const banner = document.getElementById('banner');
  if(state.err && state.session && displayName() && state.view !== 'submit'){

    banner.innerHTML = '';

}

function renderMain(){
  const main = document.getElementById('main');

  if(state.view === 'feed'){
    const q = state.searchTerm.trim().toLowerCase();
    const filtered = getFilteredPublishedArticles();

    renderSplit(main, filtered, {
      emptyTitle: q ? "No published articles match your search." : "No articles published yet.",
      emptySub: q ? "Try another keyword, author name, or phrase." : "The first approved article of faith will appear here.",
      rowHtml: (a, active) => listRowHtml(a, active),
      detailHtml: feedDetailHtml,
      search: true
    });
    const cd = document.getElementById('commentDraft');
    if(cd) cd.oninput = e => state.commentDraft = e.target.value;

    document.querySelectorAll('[id^="replyInput-"]').forEach((replyInput) => {
      const id = replyInput.id.replace('replyInput-', '');
      replyInput.oninput = e => {
        state.replyDrafts[id] = e.target.value;
      };
    });
    return;
  }

  if(!state.session){
    main.innerHTML = `<div class="scroll-panel"><div class="narrow"><div class="locked-msg"><div class="glyph">†</div><p>Sign in above with your email to write, and (if you're the editor) publish.</p></div></div></div>`;
    return;
  }
  if(!displayName()){
    main.innerHTML = `<div class="scroll-panel"><div class="narrow"><div class="locked-msg"><div class="glyph">†</div><p>Add a name above for your byline to continue.</p></div></div></div>`;
    return;
  }

  if(state.view === 'submit'){
    const editingArticle = state.editingArticleId ? state.articles.find(x => x.id === state.editingArticleId) : null;
    const editingLive = editingArticle && editingArticle.status !== 'draft';
    main.innerHTML = `
      <div class="scroll-panel"><div class="narrow">
      <div class="panel">
        ${state.editingArticleId
          ? (editingLive
              ? `<div class="field-note" style="margin-bottom:14px;">Editing a ${editingArticle.status} article — changes save in place, status stays the same. <a href="#" onclick="newSubmission();return false;" style="color:var(--gold);">Start a new article instead</a></div>`
              : `<div class="field-note" style="margin-bottom:14px;">Editing a saved draft. <a href="#" onclick="newSubmission();return false;" style="color:var(--gold);">Start a new article instead</a></div>`)
          : ''}
        <div class="field">
          <label>Headline</label>
          <input type="text" id="submitTitle" placeholder="A working title" value="${escapeHtml(state.submitTitle)}">
        </div>
        <div class="field">
          <label>Article</label>
          <textarea id="submitBody" placeholder="Write the piece here.">${escapeHtml(state.submitBody)}</textarea>
        </div>
        <div class="submit-row">
          <div class="field-note">${editingLive ? "Saves in place — no re-approval needed." : (isEditor() ? "Publishes immediately — you're the editor." : "Goes to the editor for approval before it's published.")}</div>
          <div style="display:flex;gap:8px;">
            ${!editingLive ? `<button class="btn btn-ghost" onclick="saveDraft()">Save draft</button>` : ''}
            <button class="btn btn-gold" onclick="${editingLive ? 'saveArticleEdit()' : 'submitArticle()'}">${editingLive ? 'Save changes' : (isEditor() ? 'Publish' : 'Send for approval')}</button>
          </div>
        </div>
        ${state.draftSaved ? `<div class="hint" style="color:var(--green);margin-top:10px;text-align:left;">Draft saved — only visible to you until you submit it.</div>` : ''}
        ${state.err ? `<div class="hint" style="color:var(--rust);margin-top:10px;text-align:left;">${escapeHtml(state.err)}</div>` : ''}
      </div>
      </div></div>`;
    document.getElementById('submitTitle').oninput = e => { state.submitTitle = e.target.value; state.draftSaved = false; };
    document.getElementById('submitBody').oninput = e => { state.submitBody = e.target.value; state.draftSaved = false; };
    return;
  }

  if(state.view === 'desk'){
    const mine = state.articles.filter(a => a.author_email === state.session.user.email);
    renderSplit(main, mine, {
      emptyTitle: "Nothing submitted yet.",
      emptySub: "Head to Submit to write your first article of faith.",
      rowHtml: (a, active) => listRowHtml(a, active, stampMini(a.status) + ' · '),
      detailHtml: deskDetailHtml
    });
    return;
  }

  if(state.view === 'review'){
    if(!isEditor()){
      main.innerHTML = `<div class="scroll-panel"><div class="narrow"><div class="locked-msg"><div class="glyph">†</div><p>This desk is for the editor only.</p></div></div></div>`;
      return;
    }
    const pending = state.articles.filter(a => a.status === 'pending');
    const published = state.articles.filter(a => a.status === 'approved');
    renderSplit(main, [...pending, ...published], {
      emptyTitle: "Nothing to review yet.",
      rowHtml: (a, active) => listRowHtml(a, active, stampMini(a.status) + ' · '),
      detailHtml: reviewDetailHtml
    });
    return;
  }
}

function render(){
  renderAuthBox();
  renderNav();
  renderBanner();
  renderMain();
}

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  await loadArticles();
  openArticleFromHash();
  render();

  window.addEventListener('hashchange', openArticleFromHash);

  sb.auth.onAuthStateChange(async (_event, session) => {
    state.session = session;
    state.magicLinkSent = false;
    await loadArticles();
    render();
  });

  sb.channel('articles-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'articles' }, async () => {
      await loadArticles();
      render();
    })
    .subscribe();
}

init();
</script>
</body>
</html>
