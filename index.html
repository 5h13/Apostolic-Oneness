async function approveEssaySubmission(id){
  const sub = state.academyEssaySubmissions.find(s => s.id === id);
  if(!sub) return;
  const article = await findOrCreateAcademyEssayArticle(sub.lesson_id, sub.lessonTitle);
  if(!article){ render(); return; }
  const separator = article.body && article.body.trim() ? '\n\n' : '';
  const entry = `— ${sub.student_name || sub.student_email} —\n\n${sub.body}`;
  const { error: articleErr } = await sb.from('articles').update({ body: article.body + separator + entry }).eq('id', article.id);
  if(articleErr){ state.err = articleErr.message; render(); return; }
  const { error } = await sb.from('academy_essay_submissions').update({
    status: 'approved',
    compiled_article_id: article.id,
    reviewed_by: state.session.user.id,
    reviewed_at: new Date().toISOString()
  }).eq('id', id);
  if(error){ state.err = error.message; render(); return; }
  state.err = "";
  await loadAcademyEssaySubmissions();
  await loadArticles();
  render();
}

async function declineEssaySubmission(id){
  const { error } = await sb.from('academy_essay_submissions').update({
    status: 'rejected',
    reviewed_by: state.session.user.id,
    reviewed_at: new Date().toISOString()
  }).eq('id', id);
  if(error){ state.err = error.message; }
  else state.err = "";
  await loadAcademyEssaySubmissions();
  render();
}

// ===== Academy translations =====

function academyTrKey(type, id, lang){
  return `${type}:${id}:${lang}`;
}

async function loadAcademyTranslations(contentType, ids, lang){
  if(!lang || !ids.length) return;
  const missing = ids.filter(id => state.academyTranslationCache[academyTrKey(contentType, id, lang)] === undefined);
  if(!missing.length) return;
  const { data, error } = await sb.from('academy_translations')
    .select('content_id, data')
    .eq('content_type', contentType)
    .eq('language_code', lang)
    .in('content_id', missing);
  const found = new Set();
  (data || []).forEach(row => {
    state.academyTranslationCache[academyTrKey(contentType, row.content_id, lang)] = row.data;
    found.add(row.content_id);
  });
  if(!error){
    missing.forEach(id => {
      if(!found.has(id)) state.academyTranslationCache[academyTrKey(contentType, id, lang)] = null;
    });
  }
}

async function loadAcademyTranslationsForView(){
  const lang = state.academyTranslationLang;
  if(!lang) return;
  if(state.academyView === 'lesson' && state.academySelectedLessonId){
    await loadAcademyTranslations('lesson', [state.academySelectedLessonId], lang);
    const qIds = state.academyQuizQuestions.map(q => q.id);
    if(qIds.length) await loadAcademyTranslations('quiz_question', qIds, lang);
  } else if((state.academyView === 'course' || state.academyView === 'certificate') && state.academySelectedCourseId){
    await loadAcademyTranslations('course', [state.academySelectedCourseId], lang);
    const lessonIds = state.academyLessons.map(l => l.id);
    if(lessonIds.length) await loadAcademyTranslations('lesson', lessonIds, lang);
  } else {
    const subjIds = state.academySubjects.map(s => s.id);
    const courseIds = state.academyCourses.map(c => c.id);
    if(subjIds.length) await loadAcademyTranslations('subject', subjIds, lang);
    if(courseIds.length) await loadAcademyTranslations('course', courseIds, lang);
  }
}

async function setAcademyTranslationLang(lang){
  state.academyTranslationLang = lang;
  render(); // show "Loading translation…" immediately where relevant
  if(!lang) return;
  await loadAcademyTranslationsForView();
  render();
}

function academyTr(type, id){
  const lang = state.academyTranslationLang;
  if(!lang) return undefined;
  return state.academyTranslationCache[academyTrKey(type, id, lang)];
}

function academyTranslateBarHtml(){
  return `
    <div class="translate-bar">
      <select id="academyTranslationSelect" class="filter-select" style="flex:0 0 auto;min-width:150px;">
        <option value="">Original (English)</option>
        ${LANGUAGES.map(l => `<option value="${l.code}" ${state.academyTranslationLang === l.code ? 'selected' : ''}>${l.label}</option>`).join('')}
      </select>
    </div>`;
}

function academyTranslationNoteHtml(type, id){
  if(!state.academyTranslationLang) return '';
  const cached = academyTr(type, id);
  return cached === null
    ? `<div class="field-note" style="margin-top:8px;">Translation not ready yet for this language — showing the original below.</div>`
    : cached === undefined
      ? `<div class="field-note" style="margin-top:8px;">Loading translation…</div>`
      : `<div class="field-note" style="margin-top:8px;">Machine-translated — the original is in English.</div>`;
}

function renderAcademy(main){
  main.innerHTML = `<div class="scroll-panel academy-theme" id="academyRoot"></div>`;
  const root = document.getElementById('academyRoot');
  if(state.academyView === 'course' && state.academySelectedCourseId){
    renderAcademyCourse(root);
  } else if(state.academyView === 'lesson' && state.academySelectedLessonId){
    renderAcademyLesson(root);
  } else if(state.academyView === 'certificate' && state.academySelectedCourseId){
    renderAcademyCertificate(root);
  } else {
    renderAcademyHome(root);
  }
  const ats = document.getElementById('academyTranslationSelect');
  if(ats) ats.onchange = e => setAcademyTranslationLang(e.target.value);
}

function renderAcademyHome(root){
  const subjectsHtml = state.academySubjects.map(subj => {
    const subjTr = academyTr('subject', subj.id);
    const subjTitle = (subjTr && subjTr.title) || subj.title;
    const courses = state.academyCourses.filter(c => c.subject_id === subj.id);
    const courseCards = courses.map(c => {
      const courseTr = academyTr('course', c.id);
      const courseTitle = (courseTr && courseTr.title) || c.title;
      const courseDesc = (courseTr && courseTr.description) || c.description;
      const enrollment = state.academyEnrollments[c.id];
      const cert = state.academyCertificates[c.id];
      let actionHtml;
      if(cert){
        actionHtml = `
          <div class="academy-card-completed">🎉 Course completed!</div>
          ${c.closing_download_url ? `<a class="btn btn-ghost btn-small" href="${escapeHtml(c.closing_download_url)}" target="_blank" rel="noopener" download style="display:inline-block;margin-bottom:10px;">${escapeHtml(c.closing_download_label || 'Download PDF')}</a>` : ''}
          <div class="row" style="gap:8px;">
            <button class="btn btn-ghost btn-small" onclick="openAcademyCourse('${c.id}')">View Course</button>
            <button class="btn btn-gold btn-small" onclick="state.academySelectedCourseId='${c.id}';state.academyView='certificate';render();">View Certificate</button>
          </div>`;
      } else if(enrollment){
        actionHtml = `<button class="btn btn-gold btn-small" onclick="openAcademyCourse('${c.id}')">Continue</button>`;
      } else {
        actionHtml = `<button class="btn btn-gold btn-small" onclick="enrollInAcademyCourse('${c.id}')">Enroll</button>`;
      }
      return `
        <div class="academy-card">
          <div class="academy-card-title">${escapeHtml(courseTitle)}</div>
          <div class="academy-card-desc">${escapeHtml(courseDesc || '')}</div>
          ${actionHtml}
        </div>`;
    }).join('');

    return `
      <div class="academy-subject">
        <div class="academy-subject-title">${escapeHtml(subjTitle)}</div>
        <div class="academy-course-grid">${courseCards}</div>
      </div>`;
  }).join('');

  root.innerHTML = `
    <div class="academy-hero">
      ${academyTranslateBarHtml()}
      <div class="academy-hero-title">The Flint Academy</div>
      <div class="academy-hero-sub">Structured courses in apostolic doctrine and ministry formation.</div>
    </div>
    <div class="academy-body">
      ${state.session ? '' : `<div class="hint" style="text-align:left;margin-bottom:16px;">Sign in above to enroll and track your progress.</div>`}
      ${subjectsHtml || `<p class="hint">No courses published yet.</p>`}
    </div>`;
}

function renderAcademyCourse(root){
  const course = state.academyCourses.find(c => c.id === state.academySelectedCourseId);
  if(!course){ root.innerHTML = `<p class="hint">Course not found.</p>`; return; }
  const courseTr = academyTr('course', course.id);
  const courseTitle = (courseTr && courseTr.title) || course.title;
  const courseDesc = (courseTr && courseTr.description) || course.description;
  const courseIntro = (courseTr && courseTr.intro_text) || course.intro_text;

  const lessonsBySection = {};
  state.academyLessons.forEach(l => {
    const key = l.section_id || 'unsectioned';
    if(!lessonsBySection[key]) lessonsBySection[key] = [];
    lessonsBySection[key].push(l);
  });

  const orderedSections = state.academySections.slice().sort((a, b) => a.sort_order - b.sort_order);

  const typeLabel = (l) => l.type === 'chapter' ? `Chapter ${l.chapter_number}` : l.type === 'essay' ? 'Essay' : l.type === 'section_quiz' ? 'Section Quiz' : 'Quiz';
  const statusIcon = (status) => status === 'completed' ? '✓' : status === 'unlocked' ? '○' : '🔒';

  const introOpen = state.academyCourseIntroOpen[course.id] === undefined ? true : state.academyCourseIntroOpen[course.id];
  const courseIntroHtml = courseIntro ? `
    <div class="academy-section">
      <div class="academy-section-title academy-section-title-clickable" onclick="toggleAcademyCourseIntro('${course.id}')">
        ${introOpen ? '▾' : '▸'} Introduction
      </div>
      ${introOpen ? `<p class="body-text" style="margin-top:8px;">${escapeHtml(courseIntro)}</p>` : ''}
    </div>` : '';

  const sectionsHtml = orderedSections.map(sec => {
    const lessons = lessonsBySection[sec.id] || [];
    if(!lessons.length) return '';
    const isOpen = state.academySectionOpen[sec.id] === undefined ? true : state.academySectionOpen[sec.id];
    const secTr = academyTr('section', sec.id);
    const secTitle = (secTr && secTr.title) || sec.title;
    const secIntro = (secTr && secTr.intro_text) || sec.intro_text;
    const rows = isOpen ? lessons.map(l => {
      const status = academyLessonStatus(l.id);
      const clickable = status !== 'locked';
      const lessonTr = academyTr('lesson', l.id);
      const lessonTitle = (lessonTr && lessonTr.title) || l.title;
      const scoreTag = state.academyProgress[l.id] && state.academyProgress[l.id].score != null
        ? ` <span class="academy-score">${state.academyProgress[l.id].score}%</span>` : '';
      return `
        <div class="academy-lesson-row ${status} ${clickable ? '' : 'is-locked'}" ${clickable ? `onclick="openAcademyLesson('${l.id}')"` : ''}>
          <span class="academy-lesson-icon">${statusIcon(status)}</span>
          <span class="academy-lesson-title">${escapeHtml(lessonTitle)}</span>
          <span class="academy-lesson-type">${typeLabel(l)}${scoreTag}</span>
        </div>`;
    }).join('') : '';
    return `
      <div class="academy-section">
        <div class="academy-section-title academy-section-title-clickable" onclick="toggleAcademySection('${sec.id}')">
          ${isOpen ? '▾' : '▸'} ${escapeHtml(secTitle)}
        </div>
        ${isOpen && secIntro ? `<p class="academy-section-intro">${escapeHtml(secIntro)}</p>` : ''}
        ${rows}
      </div>`;
  }).join('');

  root.innerHTML = `
    <div class="academy-hero">
      <a class="academy-back" onclick="goToAcademyHome();return false;" href="#">← Academy Home</a>
      ${academyTranslateBarHtml()}
      <div class="academy-hero-title">${escapeHtml(courseTitle)}</div>
      <div class="academy-hero-sub">${escapeHtml(courseDesc || '')}</div>
      ${academyTranslationNoteHtml('course', course.id)}
    </div>
    <div class="academy-body">      ${state.err ? `<div class="hint" style="color:var(--rust);text-align:left;margin-bottom:14px;">${escapeHtml(state.err)}</div>` : ''}
      ${courseIntroHtml}
      ${sectionsHtml}
    </div>`;
}

function renderAcademyLesson(root){
  const lesson = state.academyLessons.find(l => l.id === state.academySelectedLessonId);
  if(!lesson){ root.innerHTML = `<p class="hint">Lesson not found.</p>`; return; }
  const lessonTr = academyTr('lesson', lesson.id);
  const lessonTitle = (lessonTr && lessonTr.title) || lesson.title;
  const course = state.academyCourses.find(c => c.id === state.academySelectedCourseId);

  let bodyHtml = '';

  if(lesson.type === 'chapter'){
    if(state.academyChapterCourseCompleted){
      bodyHtml = `
        <div class="academy-quiz-result passed academy-congrats">
          <div class="academy-congrats-glyph">🎉</div>
          <div class="academy-congrats-title">Congratulations!</div>
          <div class="academy-congrats-copy">You've completed the course. Your certificate is ready.</div>
          ${course && course.closing_note ? `<p class="body-text academy-closing-note">${escapeHtml(course.closing_note)}</p>` : ''}
            ${academyClosingDownloadHtml(course)}
        </div>
        <div style="margin-top:16px;display:flex;gap:8px;">
          <button class="btn btn-ghost" onclick="backToAcademyCourse()">View Course</button>
          <button class="btn btn-gold" onclick="state.academyView='certificate';render();">View Certificate</button>
        </div>`;
    } else if(lesson.link_mode === 'live'){
      const linked = state.academyLiveLinkedArticle;
      if(!linked || linked.lessonId !== lesson.id || linked.article === undefined){
        bodyHtml = `<p class="hint" style="text-align:left;">Loading linked article…</p>`;
      } else if(linked.article === null){
        bodyHtml = `
          <div class="hint" style="text-align:left;color:var(--rust);">This chapter's source article is no longer available. Please let the course editor know.</div>`;
      } else {
        bodyHtml = `
          <div class="hint" style="text-align:left;margin-bottom:10px;">Mirrors the article: <strong>${escapeHtml(linked.article.title)}</strong></div>
          <div class="body-text">${escapeHtml(linked.article.body)}</div>
          <button class="btn btn-gold" onclick="submitAcademyChapterRead()" style="margin-top:24px;">Mark as Read — Continue</button>`;
      }
    } else {
      const chapterContent = (lessonTr && lessonTr.content) || lesson.html_content;
      bodyHtml = `
        ${academyTranslationNoteHtml('lesson', lesson.id)}
        <div class="academy-lesson-content">${chapterContent}</div>
        <button class="btn btn-gold" onclick="submitAcademyChapterRead()" style="margin-top:24px;">Mark as Read — Continue</button>`;
    }
  } else if(lesson.type === 'summary_quiz' || lesson.type === 'section_quiz'){
    if(state.academyQuizResult){
      const r = state.academyQuizResult;
      if(r.passed && r.course_completed){
        bodyHtml = `
          <div class="academy-quiz-result passed academy-congrats">
            <div class="academy-congrats-glyph">🎉</div>
            <div class="academy-congrats-title">Congratulations!</div>
            <div class="academy-congrats-copy">You've completed the course. Your certificate is ready.</div>
            ${course && course.closing_note ? `<p class="body-text academy-closing-note">${escapeHtml(course.closing_note)}</p>` : ''}
            ${academyClosingDownloadHtml(course)}
          </div>
          <div style="margin-top:16px;display:flex;gap:8px;">
            <button class="btn btn-ghost" onclick="backToAcademyCourse()">View Course</button>
            <button class="btn btn-gold" onclick="state.academyView='certificate';render();">View Certificate</button>
          </div>`;
      } else {
        bodyHtml = `
          <div class="academy-quiz-result ${r.passed ? 'passed' : 'failed'}">
            <div class="academy-quiz-score">${r.correct} / ${r.total} (${r.percent}%)</div>
            <div>${r.passed ? 'You passed! The next lesson is now unlocked.' : `You need ${lesson.pass_percent}% to pass — review the chapter and try again.`}</div>
          </div>
          <div style="margin-top:16px;display:flex;gap:8px;">
            ${r.passed ? `<button class="btn btn-gold" onclick="backToAcademyCourse()">Back to Course</button>`
                       : `<button class="btn btn-ghost" onclick="openAcademyLesson('${lesson.id}')">Retry Quiz</button>`}
          </div>`;
      }
    } else {
      const questionsHtml = state.academyQuizQuestions.map((q, i) => {
        const qTr = academyTr('quiz_question', q.id);
        const qPrompt = (qTr && qTr.prompt) || q.prompt;
        const optTextMap = {};
        if(qTr && Array.isArray(qTr.options)){
          qTr.options.forEach(o => { optTextMap[o.key] = o.text; });
        }
        return `
        <div class="academy-quiz-question">
          <div class="academy-quiz-prompt">${i+1}. ${escapeHtml(qPrompt)}</div>
          ${q.options.map(opt => `
            <label class="academy-quiz-option">
              <input type="radio" name="academyq_${q.id}" onclick="state.academyQuizAnswers['${q.id}']='${opt.key}'">
              ${escapeHtml(optTextMap[opt.key] || opt.text)}
            </label>`).join('')}
        </div>`;
      }).join('');
      bodyHtml = `
        ${academyTranslationNoteHtml('lesson', lesson.id)}
        <form onsubmit="return false;">${questionsHtml}</form>
        ${state.err ? `<div class="hint" style="color:var(--rust);text-align:left;margin:10px 0;">${escapeHtml(state.err)}</div>` : ''}
        <button class="btn btn-gold" onclick="submitAcademyQuiz()" style="margin-top:10px;">Submit Quiz</button>`;
    }
  } else if(lesson.type === 'essay'){
    if(state.academyEssayResult && state.academyEssayResult.success){
      const cert = state.academyCertificates[state.academySelectedCourseId];
      if(cert){
        bodyHtml = `
          <div class="academy-quiz-result passed academy-congrats">
            <div class="academy-congrats-glyph">🎉</div>
            <div class="academy-congrats-title">Congratulations!</div>
            <div class="academy-congrats-copy">You've completed the course. Your certificate is ready.</div>
            ${course && course.closing_note ? `<p class="body-text academy-closing-note">${escapeHtml(course.closing_note)}</p>` : ''}
            ${academyClosingDownloadHtml(course)}
          </div>
          <div style="margin-top:16px;display:flex;gap:8px;">
            <button class="btn btn-ghost" onclick="backToAcademyCourse()">View Course</button>
            <button class="btn btn-gold" onclick="state.academyView='certificate';render();">View Certificate</button>
          </div>`;
      } else {
        bodyHtml = `
          <div class="academy-quiz-result passed">Essay submitted (${state.academyEssayResult.word_count} words).</div>
          <button class="btn btn-gold" onclick="backToAcademyCourse()" style="margin-top:16px;">Back to Course</button>`;
      }
    } else {
      const essayPrompt = (lessonTr && lessonTr.essay_prompt) || lesson.essay_prompt;
      bodyHtml = `
        ${academyTranslationNoteHtml('lesson', lesson.id)}
        <p class="body-text">${escapeHtml(essayPrompt)}</p>
        <textarea id="academyEssayInput" placeholder="Write your reflection here...">${escapeHtml(state.academyEssayDraft)}</textarea>
        <div class="word-count" id="academyWordCount">${academyWordCount(state.academyEssayDraft)} words (need ${lesson.essay_min_words}–${lesson.essay_max_words})</div>
        ${(state.academyEssayResult && state.academyEssayResult.error) ? `<div class="hint" style="color:var(--rust);text-align:left;margin:8px 0;">${escapeHtml(state.academyEssayResult.error)}</div>` : ''}
        ${state.err ? `<div class="hint" style="color:var(--rust);text-align:left;margin:8px 0;">${escapeHtml(state.err)}</div>` : ''}
        <button class="btn btn-gold" onclick="submitAcademyEssay()" style="margin-top:10px;">Submit Essay</button>`;
    }
  }

  root.innerHTML = `
    <div class="academy-hero">
      <a class="academy-back" onclick="backToAcademyCourse();return false;" href="#">← Back to Course</a>
      ${academyTranslateBarHtml()}
      <div class="academy-hero-title">${escapeHtml(lessonTitle)}</div>
    </div>
    <div class="academy-body">${bodyHtml}</div>`;

  const ta = document.getElementById('academyEssayInput');
  if(ta) ta.oninput = e => {
    state.academyEssayDraft = e.target.value;
    const wc = document.getElementById('academyWordCount');
    if(wc) wc.textContent = academyWordCount(state.academyEssayDraft) + ` words (need ${lesson.essay_min_words}–${lesson.essay_max_words})`;
  };
}

async function saveCertificateRecipientName(certId, name){
  const trimmed = (name || '').trim();
  if(!trimmed){ state.err = "Please enter a name."; render(); return; }
  const { error } = await sb.from('academy_certificates').update({ recipient_name: trimmed }).eq('id', certId);
  if(error){ state.err = error.message; render(); return; }
  state.err = "";
  const { data: certs } = await sb.from('academy_certificates').select('*').eq('user_id', state.session.user.id);
  state.academyCertificates = {};
  (certs || []).forEach(c => { state.academyCertificates[c.course_id] = c; });
  render();
}

function stampHtml(status){
  const label = status === "approved" ? "Approved" : status === "pending" ? "Pending" : "Declined";
  return `<div class="stamp ${status}">${label}</div>`;
}

// ===== Academy Desk (editor content management) =====

function renderAcademyDesk(main){
  // Preserve scroll position and the focused input's cursor across
  // re-renders — same fix as renderUsersDashboard. Without this, any
  // live-as-you-type search (e.g. the article importer) would rebuild
  // the whole panel on every keystroke, dropping focus and resetting
  // scroll to the top.
  const prevRoot = document.getElementById('academyDeskRoot');
  const prevScrollTop = prevRoot ? prevRoot.scrollTop : 0;
  const activeEl = document.activeElement;
  const activeId = activeEl && activeEl.id;
  const activeSelStart = activeEl && typeof activeEl.selectionStart === 'number' ? activeEl.selectionStart : null;
  const activeSelEnd = activeEl && typeof activeEl.selectionEnd === 'number' ? activeEl.selectionEnd : null;

  main.innerHTML = `<div class="scroll-panel" id="academyDeskRoot"></div>`;
  const root = document.getElementById('academyDeskRoot');
  if(state.academyDeskScreen === 'course' && state.academyDeskCourseId){
    renderAcademyDeskCourseEditor(root);
  } else if(state.academyDeskScreen === 'progress' && state.academyDeskCourseId){
    renderAcademyDeskProgress(root);
  } else {
    renderAcademyDeskCatalog(root);
  }

  root.scrollTop = prevScrollTop;
  if(activeId){
    const newActiveEl = document.getElementById(activeId);
    if(newActiveEl){
      newActiveEl.focus();
      if(activeSelStart !== null && newActiveEl.setSelectionRange){
        newActiveEl.setSelectionRange(activeSelStart, activeSelEnd);
      }
    }
  }
}

      ${subjectsHtml || `<div class="hint" style="text-align:left;">No subjects yet — add one below.</div>`}
      <div class="row" style="margin-top:20px;gap:8px;">
        <input type="text" id="newAcademySubjectName" placeholder="New subject, e.g. Life of Christ" style="flex:1;">

function renderAcademyDeskCourseEditor(root){
  const course = state.academyDeskCourses.find(c => c.id === state.academyDeskCourseId);
  if(!course){ root.innerHTML = `<div class="narrow" style="padding:28px 24px;"><p class="hint">Course not found.</p></div>`; return; }
  const locked = isAcademyDeskLocked();
  const draft = state.academyDeskCourseDraft;

  const courseFieldsHtml = draft ? `
    <div class="list-manager-card">
      <input type="text" id="academyDeskCourseTitleInput" value="${escapeHtml(draft.title)}" placeholder="Course title" style="width:100%;margin-bottom:8px;">
      <textarea id="academyDeskCourseDescInput" placeholder="Course description (short, shown on the course card and header)" style="width:100%;min-height:60px;margin-bottom:8px;">${escapeHtml(draft.description)}</textarea>
      <textarea id="academyDeskCourseIntroInput" placeholder="Course introduction (longer, shown as a collapsible intro above Section 1)" style="width:100%;min-height:100px;margin-bottom:8px;">${escapeHtml(draft.intro_text)}</textarea>
      <input type="text" id="academyDeskCourseCertBgInput" value="${escapeHtml(draft.certificate_bg_url)}" placeholder="Certificate background image URL (e.g. assets/certificate-my-course.jpg) — leave blank for the default design" style="width:100%;margin-bottom:8px;">
      <textarea id="academyDeskCourseClosingNoteInput" placeholder="Closing note (shown to a student when they complete the course, alongside the congratulations message)" style="width:100%;min-height:80px;margin-bottom:8px;">${escapeHtml(draft.closing_note)}</textarea>
      <div class="row" style="gap:8px;margin-bottom:8px;">
        <input type="text" id="academyDeskCourseDownloadUrlInput" value="${escapeHtml(draft.closing_download_url)}" placeholder="Download URL (e.g. assets/one-god-in-jesus-christ.pdf) — optional" style="flex:2;">
        <input type="text" id="academyDeskCourseDownloadLabelInput" value="${escapeHtml(draft.closing_download_label)}" placeholder="Button text (default: Download PDF)" style="flex:1;">
      </div>
      <div class="row" style="gap:8px;margin-bottom:8px;">
        <select id="academyDeskCourseSubjectInput" class="filter-select">
          ${state.academyDeskSubjects.map(s => `<option value="${s.id}" ${draft.subject_id === s.id ? 'selected' : ''}>${escapeHtml(s.title)}</option>`).join('')}
        </select>
        <select id="academyDeskCourseStatusInput" class="filter-select">
          <option value="draft" ${draft.status === 'draft' ? 'selected' : ''}>Draft</option>
          <option value="published" ${draft.status === 'published' ? 'selected' : ''}>Published</option>
        </select>
      </div>
      <div class="row" style="gap:8px;">
        <button class="btn btn-gold btn-small" onclick="saveAcademyCourseFields()">Save</button>
        <button class="btn btn-ghost btn-small" onclick="cancelEditAcademyCourseFields()">Cancel</button>
      </div>
    </div>` : `
    <div class="list-manager-card">
      <div class="list-manager-head">
        <div class="list-manager-title">${escapeHtml(course.title)} <span class="stamp-mini ${course.status === 'published' ? 'approved' : 'pending'}">${course.status}</span></div>
        <div class="row" style="gap:6px;">
          <button class="btn btn-ghost btn-small" onclick="startEditAcademyCourseFields()">Edit Course Info</button>
          <button class="btn btn-ghost btn-small" onclick="openAcademyDeskProgress('${course.id}')">Student Progress</button>
          ${locked ? '' : `<button class="btn btn-rust btn-small" onclick="deleteAcademyCourse('${course.id}')">Delete Course</button>`}
        </div>
      </div>
      <div class="hint" style="text-align:left;margin-top:6px;">${escapeHtml(course.description || 'No description yet.')}</div>
    </div>`;

  const lockedNotice = locked ? `
    <div class="hint" style="text-align:left;margin:12px 0;color:var(--amber);">
      🔒 ${state.academyDeskEnrollmentCount} student${state.academyDeskEnrollmentCount === 1 ? '' : 's'} enrolled — sections and lessons can't be deleted or reordered. Content edits and adding new material are still open.
    </div>` : '';

  const sortedSections = state.academyDeskSections.slice().sort((a, b) => a.sort_order - b.sort_order);
  const sectionsHtml = sortedSections.map((sec, secIdx) => {
    const isOpen = state.academyDeskSectionOpen[sec.id] === undefined ? true : state.academyDeskSectionOpen[sec.id];
    const lessons = state.academyDeskLessons.filter(l => l.section_id === sec.id).sort((a, b) => a.sort_order - b.sort_order);
    const isRenaming = state.academyDeskRenamingSectionId === sec.id;

    const titleHtml = isRenaming ? `
        <input type="text" id="academyDeskSectionRenameInput" value="${escapeHtml(state.academyDeskSectionRenameDraft)}" style="flex:1;">
        <button class="btn btn-gold btn-small" onclick="saveRenameAcademySection('${sec.id}')">Save</button>
        <button class="btn btn-ghost btn-small" onclick="cancelRenameAcademySection()">Cancel</button>`
      : `
        <div class="list-manager-title academy-section-title-clickable" style="flex:1;" onclick="toggleAcademyDeskSection('${sec.id}')">${isOpen ? '▾' : '▸'} ${escapeHtml(sec.title)} <span class="hint" style="margin:0;">(${lessons.length})</span></div>
        <button class="btn btn-ghost btn-small" onclick="startRenameAcademySection('${sec.id}')">Edit</button>
        ${locked ? '' : `
          <button class="btn btn-ghost btn-small" ${secIdx === 0 ? 'disabled' : ''} onclick="moveAcademySection('${sec.id}','up')">↑</button>
          <button class="btn btn-ghost btn-small" ${secIdx === sortedSections.length - 1 ? 'disabled' : ''} onclick="moveAcademySection('${sec.id}','down')">↓</button>
          <button class="btn btn-rust btn-small" onclick="deleteAcademySection('${sec.id}')">Delete</button>`}`;

    const introEditorHtml = isRenaming ? `
      <textarea id="academyDeskSectionIntroInput" placeholder="Section introduction (shown below the section name)" style="width:100%;min-height:70px;margin-top:8px;">${escapeHtml(state.academyDeskSectionIntroDraft)}</textarea>` : '';

    const lessonRows = isOpen ? lessons.map((l, lIdx) => {
      const linkedFromChapter = lessons.find(other => other.linked_quiz_lesson_id === l.id);
      const typeLabel = l.type === 'chapter' ? `Chapter${l.chapter_number != null ? ' ' + l.chapter_number : ''}`
        : l.type === 'essay' ? 'Essay'
        : l.type === 'section_quiz' ? 'Section Summary Quiz'
        : linkedFromChapter ? `Quiz — attached to "${linkedFromChapter.title}"` : 'Quiz';
      return `
        <div class="list-manager-item">
          <div class="list-manager-item-title">${escapeHtml(l.title)} <span class="hint" style="margin:0;">${typeLabel}</span></div>
          <button class="btn btn-ghost btn-small" onclick="openEditLessonEditor('${l.id}')">Edit</button>
          ${locked ? '' : `
            <button class="btn btn-ghost btn-small" ${lIdx === 0 ? 'disabled' : ''} onclick="moveAcademyLesson('${l.id}','up')">↑</button>
            <button class="btn btn-ghost btn-small" ${lIdx === lessons.length - 1 ? 'disabled' : ''} onclick="moveAcademyLesson('${l.id}','down')">↓</button>
            <button class="btn btn-rust btn-small" onclick="deleteAcademyLesson('${l.id}')">Delete</button>`}
        </div>`;
    }).join('') : '';

    const hasSectionQuiz = lessons.some(l => l.type === 'section_quiz');
    const addLessonRow = isOpen ? `
      <div class="row" style="margin-top:10px;gap:6px;flex-wrap:wrap;">
        <button class="btn btn-ghost btn-small" onclick="openNewLessonEditor('${sec.id}','chapter')">+ Chapter</button>
        <button class="btn btn-ghost btn-small" onclick="openNewLessonEditor('${sec.id}','essay')">+ Essay</button>
        <button class="btn btn-ghost btn-small" onclick="openNewLessonEditor('${sec.id}','summary_quiz')">+ Standalone Quiz</button>
        ${hasSectionQuiz ? '' : `<button class="btn btn-ghost btn-small" onclick="openNewLessonEditor('${sec.id}','section_quiz')">+ Section Summary Quiz</button>`}
      </div>` : '';

    return `
      <div class="list-manager-card">
        <div class="list-manager-head">${titleHtml}</div>
        ${introEditorHtml}
        ${!isRenaming && sec.intro_text ? `<div class="hint" style="text-align:left;margin-top:6px;">${escapeHtml(sec.intro_text)}</div>` : ''}
        <div class="list-manager-body">
          ${lessons.length ? lessonRows : (isOpen ? `<div class="hint" style="text-align:left;">No lessons in this section yet.</div>` : '')}
          ${addLessonRow}
        </div>
      </div>`;
  }).join('');

  const lessonEditorHtml = state.academyDeskLessonEditor ? academyLessonEditorHtml() : '';

  root.innerHTML = `
    <div class="narrow" style="padding:28px 24px;">
      <a href="javascript:void(0)" onclick="backToAcademyDeskCatalog()">← Academy Desk</a>
      <p class="welcome-heading">${escapeHtml(course.title)}</p>
      ${state.err ? `<div class="hint" style="color:var(--rust);text-align:left;margin-bottom:14px;">${escapeHtml(state.err)}</div>` : ''}
      ${courseFieldsHtml}
      ${lockedNotice}
      ${sectionsHtml}
      <div class="row" style="margin-top:14px;gap:8px;">
        <input type="text" id="newAcademySectionTitle" placeholder="New section title, e.g. Historical Background" style="flex:1;">
        <button class="btn btn-ghost btn-small" onclick="createAcademySection()">Add Section</button>
      </div>
      ${lessonEditorHtml}
    </div>`;

  const newSectionInput = document.getElementById('newAcademySectionTitle');
  if(newSectionInput) newSectionInput.onkeydown = e => { if(e.key === 'Enter') createAcademySection(); };

  if(draft){
    const titleEl = document.getElementById('academyDeskCourseTitleInput');
    if(titleEl) titleEl.oninput = e => { draft.title = e.target.value; };
    const descEl = document.getElementById('academyDeskCourseDescInput');
    if(descEl) descEl.oninput = e => { draft.description = e.target.value; };
    const introEl = document.getElementById('academyDeskCourseIntroInput');
    if(introEl) introEl.oninput = e => { draft.intro_text = e.target.value; };
    const certBgEl = document.getElementById('academyDeskCourseCertBgInput');
    if(certBgEl) certBgEl.oninput = e => { draft.certificate_bg_url = e.target.value; };
    const closingNoteEl = document.getElementById('academyDeskCourseClosingNoteInput');
    if(closingNoteEl) closingNoteEl.oninput = e => { draft.closing_note = e.target.value; };
    const downloadUrlEl = document.getElementById('academyDeskCourseDownloadUrlInput');
    if(downloadUrlEl) downloadUrlEl.oninput = e => { draft.closing_download_url = e.target.value; };
    const downloadLabelEl = document.getElementById('academyDeskCourseDownloadLabelInput');
    if(downloadLabelEl) downloadLabelEl.oninput = e => { draft.closing_download_label = e.target.value; };
    const subjEl = document.getElementById('academyDeskCourseSubjectInput');
    if(subjEl) subjEl.onchange = e => { draft.subject_id = e.target.value; };
    const statusEl = document.getElementById('academyDeskCourseStatusInput');
    if(statusEl) statusEl.onchange = e => { draft.status = e.target.value; };
  }

  if(state.academyDeskRenamingSectionId){
    const rn = document.getElementById('academyDeskSectionRenameInput');
    if(rn) rn.oninput = e => { state.academyDeskSectionRenameDraft = e.target.value; };
    const intro = document.getElementById('academyDeskSectionIntroInput');
    if(intro) intro.oninput = e => { state.academyDeskSectionIntroDraft = e.target.value; };
  }

  wireAcademyLessonEditorInputs();
}

function academyRosterRowHtml(r){
  const days = daysSince(r.lastActivity);
  const stuck = !r.completed && days !== null && days >= state.academyDeskStuckThresholdDays;
  const pct = r.totalLessons ? Math.round((r.completedCount / r.totalLessons) * 100) : 0;
  const activityLabel = r.lastActivity === null ? 'No activity recorded yet'
    : days === 0 ? 'Active today'
    : `${days} day${days === 1 ? '' : 's'} since last progress`;
  return `
    <div class="list-manager-item" style="align-items:flex-start;">
      <div style="flex:1;">
        <div class="list-manager-item-title">
          ${escapeHtml(r.name)}
          ${stuck ? `<span class="stamp-mini pending" style="margin-left:6px;">Stuck</span>` : ''}
          ${r.completed ? `<span class="stamp-mini approved" style="margin-left:6px;">Completed</span>` : ''}
        </div>
        <div class="hint" style="text-align:left;margin:2px 0;">${escapeHtml(r.email)}</div>
        <div class="hint" style="text-align:left;margin:2px 0;">${pct}% complete (${r.completedCount}/${r.totalLessons}) · Currently: ${escapeHtml(r.currentLessonTitle)}</div>
        <div class="hint" style="text-align:left;margin:2px 0;">${activityLabel}</div>
        ${r.certificateName ? `<div class="hint" style="text-align:left;margin:6px 0 0;">Certificate name: <strong>${escapeHtml(r.certificateName)}</strong> <a href="javascript:void(0)" class="toggle-link" onclick="resetCertificateName('${r.certificateId}','${state.academyDeskCourseId}')">Reset</a></div>` : ''}
      </div>
      <button class="btn btn-gold btn-small" onclick="messageStudentAboutProgress('${r.userId}', '${escapeHtml(r.name).replace(/'/g, "\\'")}', '${escapeHtml(r.currentLessonTitle).replace(/'/g, "\\'")}')">Message</button>
    </div>`;
}

function renderAcademyDeskProgress(root){
  const course = state.academyDeskCourses.find(c => c.id === state.academyDeskCourseId);
  const roster = state.academyDeskRoster;
  const stuckCount = roster.filter(r => !r.completed && daysSince(r.lastActivity) !== null && daysSince(r.lastActivity) >= state.academyDeskStuckThresholdDays).length;

  root.innerHTML = `
    <div class="narrow" style="padding:28px 24px;">
      <a href="javascript:void(0)" onclick="backToAcademyDeskCourseFromProgress()">← ${course ? escapeHtml(course.title) : 'Course'}</a>
      <p class="welcome-heading">Student Progress</p>
      ${state.err ? `<div class="hint" style="color:var(--rust);text-align:left;margin-bottom:14px;">${escapeHtml(state.err)}</div>` : ''}
      <div class="row" style="gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap;">
        <span class="hint" style="margin:0;">Flag as stuck after</span>
        <input type="number" id="academyDeskStuckThresholdInput" value="${state.academyDeskStuckThresholdDays}" style="width:80px;">
        <span class="hint" style="margin:0;">days with no progress</span>
        ${stuckCount ? `<span class="stamp-mini pending" style="margin-left:8px;">${stuckCount} stuck</span>` : ''}
      </div>
      ${roster.length ? roster.map(academyRosterRowHtml).join('') : `<div class="hint" style="text-align:left;">No one is enrolled in this course yet.</div>`}
    </div>`;

  const thresholdInput = document.getElementById('academyDeskStuckThresholdInput');
  if(thresholdInput) thresholdInput.oninput = e => { state.academyDeskStuckThresholdDays = parseInt(e.target.value, 10) || 0; render(); };
}

function academyLessonEditorHtml(){
  const ed = state.academyDeskLessonEditor;
  let typeFields = '';

  if(ed.type === 'chapter'){
    const importHtml = academyChapterImportHtml(ed);
    const contentFieldHtml = ed.linkMode === 'live' ? '' : `
      <textarea id="academyDeskLessonHtmlContent" placeholder="Chapter content (HTML)" style="width:100%;min-height:200px;margin-bottom:12px;">${escapeHtml(ed.html_content)}</textarea>`;
    typeFields = `
      <input type="number" id="academyDeskLessonChapterNumber" value="${ed.chapter_number != null ? ed.chapter_number : ''}" placeholder="Chapter number, e.g. 1" style="width:200px;margin-bottom:8px;">
      ${importHtml}
      ${contentFieldHtml}
      <div class="list-manager-card">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" id="academyDeskChapterQuizToggle" ${ed.quizEnabled ? 'checked' : ''}>
          <span>Enable a quiz for this chapter</span>
        </label>
        ${ed.quizEnabled ? `
          <div style="margin-top:12px;">
            <input type="number" id="academyDeskChapterQuizPassPercent" value="${ed.chapterQuizPassPercent}" placeholder="Pass %" style="width:140px;margin-bottom:12px;">
            <div>${ed.chapterQuizQuestions.map((q, idx) => academyDeskQuizQuestionRowHtml(q, idx, 'chapterQuiz')).join('')}</div>
            <button class="btn btn-ghost btn-small" onclick="addDraftQuizQuestion('chapterQuiz')">+ Add Question</button>
          </div>` : ''}
      </div>`;
  } else if(ed.type === 'essay'){
    typeFields = `
      <textarea id="academyDeskLessonEssayPrompt" placeholder="Essay prompt" style="width:100%;min-height:100px;margin-bottom:8px;">${escapeHtml(ed.essay_prompt)}</textarea>
      <div class="row" style="gap:8px;">
        <input type="number" id="academyDeskLessonEssayMin" value="${ed.essay_min_words}" placeholder="Min words" style="width:140px;">
        <input type="number" id="academyDeskLessonEssayMax" value="${ed.essay_max_words}" placeholder="Max words" style="width:140px;">
      </div>`;
  } else {
    const poolHtml = ed.type === 'section_quiz' ? academySectionQuizPoolHtml() : '';
    typeFields = `
      <input type="number" id="academyDeskLessonPassPercent" value="${ed.pass_percent}" placeholder="Pass %" style="width:140px;margin-bottom:12px;">
      ${poolHtml}
      <div id="academyDeskQuizQuestionsWrap">
        ${ed.questions.map((q, idx) => academyDeskQuizQuestionRowHtml(q, idx, 'main')).join('')}
      </div>
      <button class="btn btn-ghost btn-small" onclick="addDraftQuizQuestion('main')">+ Add Question</button>`;
  }

  const typeName = ed.type === 'chapter' ? 'Chapter' : ed.type === 'essay' ? 'Essay' : ed.type === 'section_quiz' ? 'Section Summary Quiz' : 'Quiz';

  return `
    <div class="list-manager-card" style="margin-top:16px;border-color:var(--gold);">
      <div class="list-manager-title" style="margin-bottom:10px;">${ed.mode === 'new' ? 'New' : 'Edit'} ${typeName}</div>
      <input type="text" id="academyDeskLessonTitle" value="${escapeHtml(ed.title)}" placeholder="Lesson title" style="width:100%;margin-bottom:8px;">
      ${typeFields}
      <div class="row" style="margin-top:14px;gap:8px;">
        <button class="btn btn-gold btn-small" onclick="saveAcademyLesson()">Save Lesson</button>
        <button class="btn btn-ghost btn-small" onclick="cancelAcademyLessonEditor()">Cancel</button>
      </div>
    </div>`;
}

function academyChapterImportHtml(ed){
  if(ed.linkMode === 'live' && ed.sourceArticleId){
    const article = state.articles.find(a => a.id === ed.sourceArticleId);
    return `
      <div class="list-manager-card" style="margin-bottom:12px;">
        <div class="list-manager-title" style="margin-bottom:6px;">Live-linked Article</div>
        <div class="hint" style="text-align:left;">This chapter always mirrors: <strong>${escapeHtml(article ? article.title : '(article not found)')}</strong>. If it's ever unpublished or deleted, students will see a "source unavailable" message instead of content.</div>
        <button class="btn btn-ghost btn-small" onclick="unlinkAcademyChapterImport()" style="margin-top:8px;">Unlink — switch back to manual content</button>
      </div>`;
  }

  const term = (ed.importSearchTerm || '').trim().toLowerCase();
  const matches = term
    ? state.articles.filter(a => a.status === 'approved' && (a.title || '').toLowerCase().includes(term)).slice(0, 6)
    : [];
  const resultsHtml = matches.map(a => `
    <div class="list-manager-search-result">
      <div class="list-manager-item-title">${escapeHtml(a.title)}</div>
      <div class="row" style="gap:6px;">
        <button class="btn btn-ghost btn-small" onclick="importAcademyChapterArticle('${a.id}','copy')">Copy In</button>
        <button class="btn btn-ghost btn-small" onclick="importAcademyChapterArticle('${a.id}','live')">Live-Link</button>
      </div>
    </div>`).join('');

  return `
    <div class="list-manager-card" style="margin-bottom:12px;">
      <div class="list-manager-title" style="margin-bottom:6px;">Import from Article</div>
      <input type="text" id="academyDeskImportSearch" value="${escapeHtml(ed.importSearchTerm || '')}" placeholder="Search published articles..." style="width:100%;">
      ${term ? (matches.length ? `<div style="margin-top:8px;">${resultsHtml}</div>` : `<div class="hint" style="text-align:left;margin-top:8px;">No matches.</div>`) : ''}
      ${ed.sourceArticleId && ed.linkMode === 'copy' ? `<div class="hint" style="text-align:left;margin-top:8px;">Originally imported from an article — the content below is now independent and safe to edit.</div>` : ''}
    </div>`;
}

function academySectionQuizPoolHtml(){
  const ed = state.academyDeskLessonEditor;
  if(!ed.poolCandidates || !ed.poolCandidates.length){
    return `<div class="hint" style="text-align:left;margin-bottom:12px;">No chapter-quiz questions found yet in this section to pool from — add some chapter quizzes first, or just write questions directly below.</div>`;
  }
  const rows = ed.poolCandidates.map(q => `
    <div class="list-manager-item">
      <label style="display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;">
        <input type="checkbox" ${ed.poolSelected[q.id] ? 'checked' : ''} onchange="togglePoolSelection('${q.id}')">
        <span class="list-manager-item-title" style="margin:0;">${escapeHtml(q.prompt)}</span>
      </label>
    </div>`).join('');
  return `
    <div class="list-manager-card" style="margin-bottom:12px;">
      <div class="list-manager-title" style="margin-bottom:8px;">Pool from this section's chapter quizzes</div>
      ${rows}
      <button class="btn btn-ghost btn-small" onclick="copySelectedPoolQuestions()" style="margin-top:8px;">Copy Selected Into This Quiz</button>
    </div>`;
}

function academyDeskQuizQuestionRowHtml(q, idx, scope){
  return `
    <div class="list-manager-item" style="flex-direction:column;align-items:stretch;gap:6px;">
      <input type="text" id="academyDeskQQPrompt-${scope}-${idx}" value="${escapeHtml(q.prompt)}" placeholder="Question prompt" style="width:100%;">
      ${q.options.map((opt, optIdx) => `
        <div class="row" style="gap:6px;align-items:center;">
          <input type="radio" name="academyDeskQQCorrect-${scope}-${idx}" ${q.correct_key === opt.key ? 'checked' : ''} onchange="setDraftQuizCorrect('${scope}', ${idx}, '${opt.key}')">
          <input type="text" id="academyDeskQQOpt-${scope}-${idx}-${optIdx}" value="${escapeHtml(opt.text)}" placeholder="Option ${opt.key.toUpperCase()}" style="flex:1;">
        </div>`).join('')}
      <button class="btn btn-rust btn-small" onclick="removeDraftQuizQuestion('${scope}', ${idx})" style="align-self:flex-end;">Remove Question</button>
    </div>`;
}

function wireQuizQuestionInputs(questions, scope){
  questions.forEach((q, idx) => {
    const pEl = document.getElementById(`academyDeskQQPrompt-${scope}-${idx}`);
    if(pEl) pEl.oninput = e => { q.prompt = e.target.value; };
    q.options.forEach((opt, optIdx) => {
      const oEl = document.getElementById(`academyDeskQQOpt-${scope}-${idx}-${optIdx}`);
      if(oEl) oEl.oninput = e => { opt.text = e.target.value; };
    });
  });
}

function wireAcademyLessonEditorInputs(){
  const ed = state.academyDeskLessonEditor;
  if(!ed) return;
  const titleEl = document.getElementById('academyDeskLessonTitle');
  if(titleEl) titleEl.oninput = e => { ed.title = e.target.value; };

  if(ed.type === 'chapter'){
    const chNum = document.getElementById('academyDeskLessonChapterNumber');
    if(chNum) chNum.oninput = e => { ed.chapter_number = e.target.value ? parseInt(e.target.value, 10) : null; };

    const importSearch = document.getElementById('academyDeskImportSearch');
    if(importSearch) importSearch.oninput = e => { ed.importSearchTerm = e.target.value; render(); };

    const html = document.getElementById('academyDeskLessonHtmlContent');
    if(html) html.oninput = e => { ed.html_content = e.target.value; };

    const quizToggle = document.getElementById('academyDeskChapterQuizToggle');
    if(quizToggle) quizToggle.onchange = e => { ed.quizEnabled = e.target.checked; render(); };

    if(ed.quizEnabled){
      const passEl = document.getElementById('academyDeskChapterQuizPassPercent');
      if(passEl) passEl.oninput = e => { ed.chapterQuizPassPercent = parseInt(e.target.value, 10) || 0; };
      wireQuizQuestionInputs(ed.chapterQuizQuestions, 'chapterQuiz');
    }
  } else if(ed.type === 'essay'){
    const prompt = document.getElementById('academyDeskLessonEssayPrompt');
    if(prompt) prompt.oninput = e => { ed.essay_prompt = e.target.value; };
    const min = document.getElementById('academyDeskLessonEssayMin');
    if(min) min.oninput = e => { ed.essay_min_words = parseInt(e.target.value, 10) || 0; };
    const max = document.getElementById('academyDeskLessonEssayMax');
    if(max) max.oninput = e => { ed.essay_max_words = parseInt(e.target.value, 10) || 0; };
  } else {
    const pass = document.getElementById('academyDeskLessonPassPercent');
    if(pass) pass.oninput = e => { ed.pass_percent = parseInt(e.target.value, 10) || 0; };
    wireQuizQuestionInputs(ed.questions, 'main');
  }
}

function stampMini(status){
  const label = status === "approved" ? "Published" : status === "pending" ? "Pending" : status === "draft" ? "Draft" : "Declined";
  return `<span class="stamp-mini ${status}">${label}</span>`;
}

function slugify(str){
  return (str || '')
    .toString()
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 60);
}

function shortCode(id){
  return (id || '').replace(/-/g, '').slice(0, 8);
}

function articleSlug(a){
  const parts = [slugify(a.author_name || a.author_email), slugify(a.title)].filter(Boolean);
  return parts.join('-') + (parts.length ? '-' : '') + shortCode(a.id);
}

function selectArticle(id){
  state.selectedId = id;
  state.likeCount = 0;
  state.userLiked = false;
  state.comments = [];
  state.commentDraft = "";
  state.replyTargetId = null;
  state.replyDrafts = {};
  state.reviewNoteDraft = "";
  state.translationLang = "";
  state.err = "";
  render();
  if(state.view === 'feed'){
    const a = state.articles.find(x => x.id === id);
    const slug = a ? articleSlug(a) : id;
    if(window.location.hash !== '#article-' + slug) window.location.hash = 'article-' + slug;
    loadArticleExtras(id);
  }
}

function clearSelection(){
  state.selectedId = null;
  state.err = "";
  if(state.view === 'feed' && window.location.hash){
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }
  render();
}

function openArticleFromHash(){
  const m = window.location.hash.match(/^#article-(.+)$/);
  if(!m) return;
  const raw = m[1];
  const code = raw.split('-').pop();
  const a = state.articles.find(x => shortCode(x.id) === code) || state.articles.find(x => x.id === raw);
  if(!a) return;
  if(state.selectedId === a.id && state.view === 'feed') return;
  state.view = 'feed';
  state.selectedId = a.id;
  state.likeCount = 0;
  state.userLiked = false;
  state.comments = [];
  state.commentDraft = "";
  render();
  loadArticleExtras(a.id);
}

async function loadArticleExtras(articleId){
  const [likesRes, commentsRes] = await Promise.all([
    sb.from('article_likes').select('user_email').eq('article_id', articleId),
    sb.from('article_comments').select('*').eq('article_id', articleId).order('created_at', { ascending: true })
  ]);
  const likeRows = likesRes.data || [];
  state.likeCount = likeRows.length;
  state.userLiked = state.session ? likeRows.some(r => r.user_email === state.session.user.email) : false;
  state.comments = commentsRes.data || [];
  render();
  loadReactionCounts(articleId);
  setupReactionHandlers();
  const { data: { user } } = await sb.auth.getUser();
  loadUserReaction(articleId, user);
}

async function loadReactionCounts(articleId) {
  // NOTE: PostgREST/supabase-js has no .group() aggregate method, so we pull
  // the raw rows for this article and tally reaction_type counts client-side.
  const { data, error } = await sb
    .from('reactions')
    .select('reaction_type')
    .eq('article_id', articleId);

  if (error) {
    console.error('Error loading reactions:', error);
    return;
  }

  const counts = {};
  (data || []).forEach(row => {
    counts[row.reaction_type] = (counts[row.reaction_type] || 0) + 1;
  });

  document.querySelectorAll('#reaction-bar .reaction-btn').forEach(btn => {
    const span = btn.querySelector('span');
    if (span) span.textContent = counts[btn.dataset.type] || 0;
  });
}


// Delegated handler: bound once, so it keeps working even after the
// #reaction-bar DOM gets replaced by a re-render (e.g. the realtime
// 'articles-changes' subscription firing render() for anyone's edit).
let reactionHandlerBound = false;
function setupReactionHandlers(){
  if(reactionHandlerBound) return;
  reactionHandlerBound = true;

  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('#reaction-bar .reaction-btn[data-type]');
    if(!btn) return;

    const articleId = state.selectedId;
    if(!articleId) return;

    if(!state.session){
      state.err = "Sign in above to react.";
      render();
      return;
    }

    if(accountLocked()){
      state.err = lockedMessage();
      render();
      return;
    }

    const { data: { user } } = await sb.auth.getUser();
    if(!user) return;

    const reactionType = btn.dataset.type;
    highlightUserReaction(reactionType);

    const { error } = await sb
      .from('reactions')
      .upsert({
        article_id: articleId,
        user_id: user.id,
        reaction_type: reactionType
      }, { onConflict: 'article_id,user_id' });

    if(error){
      console.error('Error saving reaction:', error);
      state.err = "Couldn't save that reaction — try again.";
      render();
      return;
    }

    loadReactionCounts(articleId);
  });
}

async function loadUserReaction(articleId, user){
  if(!user){
    highlightUserReaction(null);
    return;
  }

  const { data, error } = await sb
    .from('reactions')
    .select('reaction_type')
    .eq('article_id', articleId)
    .eq('user_id', user.id)
    .maybeSingle();

  if(error){
    highlightUserReaction(null);
    return;
  }

  highlightUserReaction(data ? data.reaction_type : null);
}

function highlightUserReaction(reactionType){
  document.querySelectorAll('#reaction-bar .reaction-btn')
    .forEach(btn => btn.classList.toggle('active', btn.dataset.type === reactionType));
}

async function toggleLike(articleId){
  if(!state.session){
    state.err = "Sign in above to like this article.";
    render();
    return;
  }
  const email = state.session.user.email;
  if(state.userLiked){
    state.userLiked = false;
    state.likeCount = Math.max(0, state.likeCount - 1);
    render();
    await sb.from('article_likes').delete().eq('article_id', articleId).eq('user_email', email);
  } else {
    state.userLiked = true;
    state.likeCount += 1;
    render();
    await sb.from('article_likes').insert({ article_id: articleId, user_email: email });
  }
  await loadArticleExtras(articleId);
}

async function setTranslationLang(articleId, lang){
  state.translationLang = lang;
  if(!lang){
    render();
    return;
  }
  const cacheKey = `${articleId}:${lang}`;
  if(state.translationCache[cacheKey] !== undefined){
    render();
    return;
  }
  render(); // show "Loading translation…" immediately
  const { data, error } = await sb
    .from('translations')
    .select('translated_title, translated_body')
    .eq('article_id', articleId)
    .eq('language_code', lang)
    .maybeSingle();
  state.translationCache[cacheKey] = (error || !data) ? null : data;
  render();
}

async function shareArticle(id){
  const a = state.articles.find(x => x.id === id);
  const slug = a ? articleSlug(a) : id;
  // Share the pre-rendered preview page (real og:title/description that
  // link-preview crawlers can read), not the bare #hash URL — crawlers
  // never see anything after '#', and never run JS to find out.
  const basePath = window.location.pathname.replace(/[^/]*$/, '');
  const url = window.location.origin + basePath + 'a/' + slug + '.html';
  if(navigator.share){
    try { await navigator.share({ title: a ? a.title : 'Article', url }); }
    catch(e) { /* user cancelled — ignore */ }
    return;
  }
  try {
    await navigator.clipboard.writeText(url);
    state.shareCopied = id;
    render();
    setTimeout(() => { if(state.shareCopied === id){ state.shareCopied = null; render(); } }, 2000);
  } catch(e) {
    state.err = "Couldn't copy the link — copy it from the address bar instead.";
    render();
  }
}

async function postComment(articleId){
  if(!state.session){
    state.err = "Sign in above to comment.";
    render();
    return;
  }
  if(accountLocked()){
    state.err = lockedMessage();
    render();
    return;
  }
  const body = (state.commentDraft || "").trim();
  if(!body){
    state.err = "Write something before posting.";
    render();
    return;
  }
  state.err = "";
  const { error } = await sb.from('article_comments').insert({
    article_id: articleId,
    author_email: state.session.user.email,
    author_name: displayName(),
    body
  });
  if(error){
    state.err = error.message;
    render();
    return;
  }
  state.commentDraft = "";
  await loadArticleExtras(articleId);
}

async function deleteComment(commentId, articleId){
  const { error } = await sb.from('article_comments').delete().eq('id', commentId);
  if(error){ state.err = error.message; }
  await loadArticleExtras(articleId);
}

function startReply(commentId){
  const comment = state.comments.find(c => c.id === commentId);
  if(!comment){ return; }
  const name = comment.author_name || comment.author_email || 'user';
  const tagged = '@' + name + ' ';
  state.replyTargetId = comment.id;
  state.replyDrafts[comment.id] = state.replyDrafts[comment.id] && state.replyDrafts[comment.id].trim() ? state.replyDrafts[comment.id] : tagged;
  state.err = "";
  render();
  const input = document.getElementById('replyInput-' + comment.id);
  if(input){
    input.focus();
    const target = tagged;
    const open = input.value.startsWith(target) ? target.length : 0;
    const end = input.value.length;
    input.setSelectionRange(open, end);
  }
}

function cancelReply(){
  state.replyTargetId = null;
  render();
}

async function postReply(articleId, commentId){
  if(!state.session){
    state.err = "Sign in above to reply.";
    render();
    return;
  }
  if(accountLocked()){
    state.err = lockedMessage();
    render();
    return;
  }
  const parent = state.comments.find(c => c.id === commentId);
  if(!parent){
    state.err = "That comment is no longer available.";
    render();
    return;
  }
  const raw = (state.replyDrafts[commentId] || "").trim();
  if(!raw){
    state.err = "Write a reply before posting.";
    render();
    return;
  }
  const mention = '@' + (parent.author_name || parent.author_email || 'user');
  const body = raw.startsWith(mention) ? raw : mention + ' ' + raw;
  state.err = "";
  const { error } = await sb.from('article_comments').insert({
    article_id: articleId,
    author_email: state.session.user.email,
    author_name: displayName(),
    body
  });
  if(error){
    state.err = error.message;
    render();
    return;
  }
  state.replyDrafts[commentId] = "";
  state.replyTargetId = null;
  await loadArticleExtras(articleId);
}

function feedListsAndArticlesHtml(items){

  const articlesOpen = state.feedArticlesOpen;

function renderSplit(main, items, opts){
  let listBody;
  if(opts.hideListBody){
    listBody = '';
  } else if(opts.groupBy){
    const groups = new Map();
    items.forEach(a => {
      const key = opts.groupBy(a);
      if(!groups.has(key)) groups.set(key, []);
      groups.get(key).push(a);
    });
    const order = opts.groupOrder || Array.from(groups.keys());
    const collapseScope = opts.groupCollapseScope || 'default';
    listBody = order
      .filter(k => groups.has(k) && groups.get(k).length)
      .map(k => {
        const groupItems = groups.get(k);
        const label = (opts.groupLabels && opts.groupLabels[k]) || k;
        const collapseKey = `${collapseScope}:${k}`;
        const isOpen = state.groupCollapsed[collapseKey] === undefined ? true : !state.groupCollapsed[collapseKey];
        return `<div class="list-group-header list-group-header-clickable" onclick="toggleGroupCollapse('${collapseKey}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleGroupCollapse('${collapseKey}');}">${isOpen ? '▾' : '▸'} ${escapeHtml(label)} (${groupItems.length})</div>` +
          (isOpen ? groupItems.map(a => opts.rowHtml(a, a.id === state.selectedId)).join('') : '');
      }).join('');
    if(!listBody){
      listBody = `<div class="empty"><div class="glyph">†</div><p>${opts.emptyTitle}</p>${opts.emptySub ? `<p>${opts.emptySub}</p>` : ''}</div>`;
    }
  } else {
    listBody = items.length
      ? items.map(a => opts.rowHtml(a, a.id === state.selectedId)).join('')
      : `<div class="empty"><div class="glyph">†</div><p>${opts.emptyTitle}</p>${opts.emptySub ? `<p>${opts.emptySub}</p>` : ''}</div>`;
  }

  const selected = items.find(a => a.id === state.selectedId) || null;
  const defaultWelcome = homeDashboardHtml();
  const detailHtml = selected
    ? `<a class="back-link" onclick="clearSelection();return false;" href="#">← Back to list</a>${opts.detailHtml(selected)}`
    : `<div class="detail-empty"><div class="glyph">†</div><div class="welcome-message">${opts.welcomeHtml || defaultWelcome}</div></div>`;

  const searchScope = opts.searchScope || 'feed';
  const sIds = searchScope === 'feed'
    ? { search: 'feedSearch', clear: 'clearFeedSearch', cat: 'categoryFilter', sub: 'subcategoryFilter', auth: 'authorFilter' }
    : { search: `${searchScope}Search`, clear: `${searchScope}ClearSearch`, cat: `${searchScope}CategoryFilter`, sub: `${searchScope}SubcategoryFilter`, auth: `${searchScope}AuthorFilter` };
  const termVal = state[scopedField(searchScope, 'searchTerm')] || '';
  const catVal = state[scopedField(searchScope, 'categoryFilter')] || '';
  const subVal = state[scopedField(searchScope, 'subcategoryFilter')] || '';
  const authVal = state[scopedField(searchScope, 'authorFilter')] || '';
  const authorOptions = opts.authorSourceList ? getAuthorsFromList(opts.authorSourceList) : getFeedAuthors();

  const searchHtml = opts.search ? `
    <div class="feed-tools">
      <div class="feed-search-wrap">
        <input type="search" id="${sIds.search}" class="feed-search" value="${escapeHtml(termVal)}" placeholder="${escapeHtml(opts.searchPlaceholder || 'Search published articles...')}">
      </div>
      <button type="button" id="${sIds.clear}" class="clear-search" ${(termVal || catVal || subVal || authVal) ? '' : 'disabled'}>Clear</button>
    </div>
    <div class="feed-filters">
      <select id="${sIds.cat}" class="filter-select">
        <option value="">All categories</option>
        ${state.categories.map(c => `<option value="${c.id}" ${catVal===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
      </select>
      <select id="${sIds.sub}" class="filter-select">
        <option value="">All topics</option>
        ${state.subcategories.map(s => `<option value="${s.id}" ${subVal===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}
      </select>
      <select id="${sIds.auth}" class="filter-select">
        <option value="">All authors</option>
        ${authorOptions.map(n => `<option value="${escapeHtml(n)}" ${authVal===n?'selected':''}>${escapeHtml(n)}</option>`).join('')}
      </select>
    </div>` : '';

  // Preserve scroll position across re-renders (e.g. posting a comment,
  // or simply selecting an article) — a fresh innerHTML rebuild resets
  // scrollTop on any brand-new DOM node, which otherwise looks like the
  // page jumping back to the top of the article or the list.
  const prevDetail = main.querySelector('.split-detail');
  const prevArticleId = prevDetail ? prevDetail.dataset.articleId : null;
  const prevDetailScrollTop = prevDetail ? prevDetail.scrollTop : 0;

  const prevList = main.querySelector('.split-list');
  const prevListScrollTop = prevList ? prevList.scrollTop : 0;

  main.innerHTML = `
    <div class="split ${state.selectedId ? 'has-selection' : ''}">
      <div class="split-list">${searchHtml}${opts.topHtml || ''}${listBody}</div>
      <div class="split-detail" data-article-id="${selected ? selected.id : ''}">${detailHtml}</div>
    </div>`;

  if(selected && prevArticleId === selected.id){
    const newDetail = main.querySelector('.split-detail');
    if(newDetail) newDetail.scrollTop = prevDetailScrollTop;
  }
  const newList = main.querySelector('.split-list');
  if(newList) newList.scrollTop = prevListScrollTop;

  if(opts.search){
    const termField = scopedField(searchScope, 'searchTerm');
    const catField = scopedField(searchScope, 'categoryFilter');
    const subField = scopedField(searchScope, 'subcategoryFilter');
    const authField = scopedField(searchScope, 'authorFilter');

    const feedSearch = document.getElementById(sIds.search);
    const clearFeedSearch = document.getElementById(sIds.clear);

    if(feedSearch){
      feedSearch.addEventListener('keydown', (event) => {
        if(event.key === 'Enter') {
          state[termField] = event.target.value;
          render();
        }
      });

      feedSearch.addEventListener('input', (event) => {
        state[termField] = event.target.value;
      });
    }

    if(clearFeedSearch){
      clearFeedSearch.addEventListener('click', () => {
        state[termField] = '';
        state[catField] = '';
        state[subField] = '';
        state[authField] = '';
        render();
      });
    }

    const categoryFilterEl = document.getElementById(sIds.cat);
    if(categoryFilterEl) categoryFilterEl.onchange = e => { state[catField] = e.target.value; render(); };

    const subcategoryFilterEl = document.getElementById(sIds.sub);
    if(subcategoryFilterEl) subcategoryFilterEl.onchange = e => { state[subField] = e.target.value; render(); };

    const authorFilterEl = document.getElementById(sIds.auth);
    if(authorFilterEl) authorFilterEl.onchange = e => { state[authField] = e.target.value; render(); };
  }
}

// Maps a filter's base name to this scope's actual state field.
// 'feed' keeps the original unprefixed field names (searchTerm, categoryFilter,
// etc.) so existing Feed behavior/state is untouched; other scopes ('desk',
// 'review') get their own independent fields, e.g. deskSearchTerm.
function scopedField(scope, base){
  if(scope === 'feed') return base;
  return scope + base.charAt(0).toUpperCase() + base.slice(1);
}

function applyArticleFilters(list, scope){
  const catField = scopedField(scope, 'categoryFilter');
  const subField = scopedField(scope, 'subcategoryFilter');
  const authField = scopedField(scope, 'authorFilter');
  const termField = scopedField(scope, 'searchTerm');

  let out = list;
  if(state[catField]) out = out.filter(a => a.category_id === state[catField]);
  if(state[subField]) out = out.filter(a => a.subcategory_id === state[subField]);
  if(state[authField]) out = out.filter(a => (a.author_name || a.author_email) === state[authField]);

  const q = (state[termField] || '').trim().toLowerCase();
  if(!q) return out;
  return out.filter(a => {
    const haystack = [
      a.title,
      a.author_name,
      a.author_email,
      a.body
    ].join(' ').toLowerCase();
    return haystack.includes(q);
  });
}

function getAuthorsFromList(list){
  const names = new Set();
  list.forEach(a => {
    const n = a.author_name || a.author_email;
    if(n) names.add(n);
  });
  return Array.from(names).sort((a, b) => a.localeCompare(b));
}

async function moveListItem(listId, itemId, direction){
  const list = state.lists.find(l => l.id === listId);
  if(!list || !list.items) return;
  const items = list.items;
  const idx = items.findIndex(it => it.id === itemId);
  const swapIdx = direction === 'up' ? idx - 1 : idx + 1;
  if(idx < 0 || swapIdx < 0 || swapIdx >= items.length) return;
  const a = items[idx], b = items[swapIdx];
  const [{ error: e1 }, { error: e2 }] = await Promise.all([
    sb.from('list_items').update({ sort_order: b.sort_order }).eq('id', a.id),
    sb.from('list_items').update({ sort_order: a.sort_order }).eq('id', b.id)
  ]);
  if(e1 || e2){ state.err = (e1 && e1.message) || (e2 && e2.message); }
  await loadLists();
  render();
}

async function loadAcademyDeskRoster(courseId){
  const { data: enrollments } = await sb.from('academy_enrollments').select('*').eq('course_id', courseId);
  const enr = enrollments || [];
  const userIds = enr.map(e => e.user_id);

  const { data: lessons } = await sb.from('academy_lessons').select('id, title').eq('course_id', courseId);
  const lessonList = lessons || [];
  const lessonIds = lessonList.map(l => l.id);
  const lessonTitleMap = {};
  lessonList.forEach(l => { lessonTitleMap[l.id] = l.title; });
  const totalLessons = lessonList.length;

  let profilesMap = {};
  if(userIds.length){
    const { data: profiles } = await sb.from('profiles').select('id, display_name, email').in('id', userIds);
    (profiles || []).forEach(p => { profilesMap[p.id] = p; });
  }

  let progressByUser = {};
  if(userIds.length && lessonIds.length){
    const { data: progress } = await sb.from('academy_lesson_progress').select('*').in('user_id', userIds).in('lesson_id', lessonIds);
    (progress || []).forEach(p => {
      if(!progressByUser[p.user_id]) progressByUser[p.user_id] = [];
      progressByUser[p.user_id].push(p);
    });
  }

  let essayByUser = {};
  if(userIds.length && lessonIds.length){
    const { data: essays } = await sb.from('academy_essay_submissions').select('*').in('user_id', userIds).in('lesson_id', lessonIds);
    (essays || []).forEach(s => {
      if(!essayByUser[s.user_id]) essayByUser[s.user_id] = [];
      essayByUser[s.user_id].push(s);
    });
  }

  let certByUser = {};
  if(userIds.length){
    const { data: certs } = await sb.from('academy_certificates').select('*').eq('course_id', courseId).in('user_id', userIds);
    (certs || []).forEach(c => { certByUser[c.user_id] = c; });
  }

  state.academyDeskRoster = enr.map(e => {
    const profile = profilesMap[e.user_id] || {};
    const myProgress = progressByUser[e.user_id] || [];
    const myEssays = essayByUser[e.user_id] || [];
    const completedCount = myProgress.filter(p => p.status === 'completed').length;
    const cert = certByUser[e.user_id] || null;

    const timestamps = [e.created_at];
    myProgress.forEach(p => { timestamps.push(p.updated_at); timestamps.push(p.completed_at); });
    myEssays.forEach(s => { timestamps.push(s.updated_at); timestamps.push(s.created_at); });
    const lastActivity = timestamps.filter(Boolean).sort().slice(-1)[0] || null;

    const currentLessonTitle = e.completed ? 'Completed' : (e.current_lesson_id ? (lessonTitleMap[e.current_lesson_id] || '—') : '—');

    return {
      userId: e.user_id,
      name: profile.display_name || profile.email || 'Unknown',
      email: profile.email || '',
      completed: !!e.completed,
      completedCount,
      totalLessons,
      currentLessonTitle,
      lastActivity,

async function saveQuizQuestionsFor(lessonId, questions, mode){
  const keepIds = [];
  for(const q of questions){
    if(!q.prompt || !q.prompt.trim()) continue;
    if(q.id){
      await sb.from('academy_quiz_questions').update({ prompt: q.prompt, options: q.options }).eq('id', q.id);
      await sb.from('academy_quiz_answers').update({ correct_key: q.correct_key }).eq('question_id', q.id);
      keepIds.push(q.id);
    } else {
      const { data: newQ } = await sb.from('academy_quiz_questions').insert({
        lesson_id: lessonId, prompt: q.prompt, options: q.options, sort_order: keepIds.length
      }).select().single();
      if(newQ){
        await sb.from('academy_quiz_answers').insert({ question_id: newQ.id, correct_key: q.correct_key });
        keepIds.push(newQ.id);
      }
    }
  }
  if(mode === 'edit'){
    const { data: existingQs } = await sb.from('academy_quiz_questions').select('id').eq('lesson_id', lessonId);
    const toDelete = (existingQs || []).map(q => q.id).filter(id => !keepIds.includes(id));
    if(toDelete.length){
      await sb.from('academy_quiz_answers').delete().in('question_id', toDelete);
      await sb.from('academy_quiz_questions').delete().in('id', toDelete);
    }
  }
}

async function saveAcademyLesson(){
  const ed = state.academyDeskLessonEditor;
  const title = (ed.title || '').trim();
  if(!title){ state.err = "Lesson needs a title."; render(); return; }

  const payload = { title, type: ed.type, section_id: ed.sectionId, course_id: state.academyDeskCourseId };
  if(ed.type === 'chapter'){
    payload.html_content = ed.html_content;
    payload.chapter_number = ed.chapter_number;
    payload.link_mode = ed.linkMode;
    payload.source_article_id = ed.sourceArticleId;
  } else if(ed.type === 'essay'){
    payload.essay_prompt = ed.essay_prompt;
    payload.essay_min_words = ed.essay_min_words;
    payload.essay_max_words = ed.essay_max_words;
  } else {
    payload.pass_percent = ed.pass_percent;
  }

  let lessonId = ed.id;
  if(ed.mode === 'new'){
    const sectionLessons = state.academyDeskLessons.filter(l => l.section_id === ed.sectionId);
    payload.sort_order = sectionLessons.length;
    const { data, error } = await sb.from('academy_lessons').insert(payload).select().single();
    if(error){ state.err = error.message; render(); return; }
    lessonId = data.id;
  } else {
    const { error } = await sb.from('academy_lessons').update(payload).eq('id', lessonId);
    if(error){ state.err = error.message; render(); return; }
  }

  if(ed.type === 'summary_quiz' || ed.type === 'section_quiz'){
    await saveQuizQuestionsFor(lessonId, ed.questions, ed.mode);
  }

  let lockedQuizRemovalBlocked = false;

  if(ed.type === 'chapter'){
    if(ed.quizEnabled){
      if(ed.linkedQuizLessonId){
        await sb.from('academy_lessons').update({ pass_percent: ed.chapterQuizPassPercent }).eq('id', ed.linkedQuizLessonId);
        await saveQuizQuestionsFor(ed.linkedQuizLessonId, ed.chapterQuizQuestions, 'edit');
      } else {
        const siblings = state.academyDeskLessons.filter(l => l.section_id === ed.sectionId).sort((a, b) => a.sort_order - b.sort_order);
        const chapterLesson = siblings.find(l => l.id === lessonId);
        const chapterSortOrder = chapterLesson ? chapterLesson.sort_order : siblings.length;
        const insertAt = chapterSortOrder + 1;
        const toShift = siblings.filter(l => l.id !== lessonId && l.sort_order >= insertAt);
        for(const l of toShift){
          await sb.from('academy_lessons').update({ sort_order: l.sort_order + 1 }).eq('id', l.id);
        }
        const { data: newQuiz, error: quizErr } = await sb.from('academy_lessons').insert({
          title: `${title} Quiz`,
          type: 'summary_quiz',
          section_id: ed.sectionId,
          course_id: state.academyDeskCourseId,
          pass_percent: ed.chapterQuizPassPercent,
          sort_order: insertAt
        }).select().single();
        if(quizErr){ state.err = quizErr.message; render(); return; }
        await saveQuizQuestionsFor(newQuiz.id, ed.chapterQuizQuestions, 'new');
        await sb.from('academy_lessons').update({ linked_quiz_lesson_id: newQuiz.id }).eq('id', lessonId);
      }
    } else if(ed.linkedQuizLessonId){
      if(isAcademyDeskLocked()){
        lockedQuizRemovalBlocked = true;
      } else {
        const { data: qs } = await sb.from('academy_quiz_questions').select('id').eq('lesson_id', ed.linkedQuizLessonId);
        const qIds = (qs || []).map(q => q.id);
        if(qIds.length){
          await sb.from('academy_quiz_answers').delete().in('question_id', qIds);
          await sb.from('academy_quiz_questions').delete().in('id', qIds);
        }
        await sb.from('academy_lessons').delete().eq('id', ed.linkedQuizLessonId);
      }
    }
  }

  state.academyDeskLessonEditor = null;
  state.err = lockedQuizRemovalBlocked
    ? "This course has enrolled students — the quiz can't be removed. Your other changes were saved; content edits stay open."
    : "";
  await loadAcademyDeskCourseDetail(state.academyDeskCourseId);
  render();
}

async function deleteAcademyLesson(id){
  if(isAcademyDeskLocked()){
    state.err = "This course has enrolled students — lessons can't be deleted.";

    return;
  }
  const lesson = state.academyDeskLessons.find(l => l.id === id);
  if(lesson && lesson.type === 'chapter' && lesson.linked_quiz_lesson_id){

  }
  const { data: qs } = await sb.from('academy_quiz_questions').select('id').eq('lesson_id', id);
  const qIds = (qs || []).map(q => q.id);

    await sb.from('academy_quiz_questions').delete().in('id', qIds);
  }
  const { error } = await sb.from('academy_lessons').delete().eq('id', id);

  await loadAcademyDeskCourseDetail(state.academyDeskCourseId);

async function moveAcademyLesson(lessonId, direction){
  if(isAcademyDeskLocked()){

  }
  const lesson = state.academyDeskLessons.find(l => l.id === lessonId);
  if(!lesson) return;
  const siblings = state.academyDeskLessons.filter(l => l.section_id === lesson.section_id).sort((a, b) => a.sort_order - b.sort_order);
  const idx = siblings.findIndex(l => l.id === lessonId);
  const swapIdx = direction === 'up' ? idx - 1 : idx + 1;
  if(idx < 0 || swapIdx < 0 || swapIdx >= siblings.length) return;
  const a = siblings[idx], b = siblings[swapIdx];
  await Promise.all([
    sb.from('academy_lessons').update({ sort_order: b.sort_order }).eq('id', a.id),
    sb.from('academy_lessons').update({ sort_order: a.sort_order }).eq('id', b.id)
  ]);

  return active.slice().sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

function announcementDismissKey(a){

}
