  state.announcements = data || [];
  state.announcementsLoaded = true;
}

async function publishAnnouncement(){
  const message = state.announcementDraftMessage.trim();
  if(!message) return;
  const level = state.announcementDraftLevel;
  const { error: deactivateErr } = await sb.from('announcements').update({ active: false }).eq('active', true);
  if(deactivateErr){ state.err = deactivateErr.message; render(); return; }
  const { error } = await sb.from('announcements').insert({ message, level, active: true });
  if(error){ state.err = error.message; render(); return; }
  state.announcementDraftMessage = "";
  state.announcementDraftLevel = "info";
  state.err = "";
  await loadAnnouncements();
  render();
}

async function deactivateAnnouncement(id){
  const { error } = await sb.from('announcements').update({ active: false, updated_at: new Date().toISOString() }).eq('id', id);
  if(error){ state.err = error.message; }
  await loadAnnouncements();
  render();
}

async function reactivateAnnouncement(id){
  const { error: deactivateErr } = await sb.from('announcements').update({ active: false }).eq('active', true);
  if(deactivateErr){ state.err = deactivateErr.message; render(); return; }
  const { error } = await sb.from('announcements').update({ active: true, updated_at: new Date().toISOString() }).eq('id', id);
  if(error){ state.err = error.message; }
  await loadAnnouncements();
  render();
}

async function deleteAnnouncement(id){
  const { error } = await sb.from('announcements').delete().eq('id', id);
  if(error){ state.err = error.message; }
  await loadAnnouncements();
  render();
}

function dismissAnnouncement(key){
  state.announcementDismissed = key;
  if(typeof localStorage !== 'undefined') localStorage.setItem('flint_announcement_dismissed', key);
  render();
}

function renderNav(){
  const nav = document.getElementById('nav');
  const feedCount = getFilteredPublishedArticles().length;
  if(!state.session || !displayName()){
    nav.innerHTML = `
      <button class="${state.view==='feed'?'active':''}" onclick="setView('feed')">Feed (${feedCount})</button>
      <button class="${state.view==='forum'?'active':''}" onclick="setView('forum')">Forum</button>
      <button class="${state.view==='prayers'?'active':''}" onclick="setView('prayers')">Prayers</button>`;
    return;
  }
  const staff = isStaff();
  const pendingCount = state.articles.filter(a => a.status === 'pending').length;
  const tabs = [
    {id:'feed', label:`Feed (${feedCount})`},
    {id:'forum', label:'Forum'},
    {id:'prayers', label:'Prayers'},
    {id:'academy', label:'Academy'},
    {id:'submit', label:'Submit'},
    {id:'desk', label:'My desk'},
    {id:'messages', label:'Messages', count: state.unreadTotal}
  ];
  if(staff){
    tabs.push({id:'review', label:'Review desk', count: pendingCount});
  }
  if(isEditor()){
    tabs.push({id:'users', label:'User Desk'});
    tabs.push({id:'academyDesk', label:'Academy Desk'});
  }
  nav.innerHTML = tabs.map(t => `
    <button class="${state.view===t.id?'active':''}" onclick="setView('${t.id}')">
      ${t.label}${t.count ? `<span class="count">${t.count}</span>` : ''}
    </button>`).join('');
}

function goHome(){
  if(window.location.hash){
    history.replaceState(null, '', window.location.pathname + window.location.search);
  }
  setView('feed');
}

function setView(v){
  if(v === 'submit'){
    state.editingArticleId = null;
    state.submitTitle = "";
    state.submitBody = "";
    state.submitCategoryId = "";
    state.submitSubcategoryId = "";
    state.draftSaved = false;
    state.verseLookupOpen = false;
    state.verseRefDraft = "";
    state.verseResult = null;
  }
  state.view = v;
  state.selectedId = null;
  state.err = "";
  state.suspendMenuFor = null;
  state.selectedThreadId = null;
  state.selectedQuestionId = null;
  state.deskGroupFilter = null;
  state.reviewGroupFilter = null;
  state.forumComposerOpen = false;
  state.selectedPrayerId = null;
  state.prayerComposerOpen = false;
  render();
  if(v === 'users' && isEditor()){
    loadUsers().then(render);
  }
  if(v === 'review' && isStaff()){
    loadAcademyEssaySubmissions().then(render);
  }
  if(v === 'messages' && state.session){
    if(isStaff()){
      loadThreads().then(render);
    } else {
      loadThread(state.session.user.id).then(render);
    }
  }
  if(v === 'forum'){
    loadForumQuestions().then(render);
  }
  if(v === 'prayers'){
    loadPrayerRequests().then(render);
  }
  if(v === 'academy'){
    state.academyView = 'home';
    state.academySelectedCourseId = null;
    state.academySelectedLessonId = null;
    loadAcademyCatalog().then(loadAcademyTranslationsForView).then(render);
  }
  if(v === 'academyDesk'){
    state.academyDeskScreen = 'catalog';
    state.academyDeskCourseId = null;
    state.academyDeskLessonEditor = null;
    state.academyDeskCourseDraft = null;
    loadAcademyDeskCatalog().then(render);
  }
}

function toggleGroupCollapse(collapseKey){
  const current = state.groupCollapsed[collapseKey];
  state.groupCollapsed[collapseKey] = current === undefined ? true : !current;
  render();
}

function renderBanner(){
  const banner = document.getElementById('banner');
  const parts = [];
  const ann = activeAnnouncement();
  if(ann){
    const key = announcementDismissKey(ann);
    if(state.announcementDismissed !== key){
      const levelClass = ann.level === 'urgent' ? 'banner-urgent' : ann.level === 'warning' ? 'banner-warning' : 'banner-info';
      parts.push(`
        <div class="banner-note ${levelClass} banner-announcement">
          <span>${escapeHtml(ann.message)}</span>
          <a href="javascript:void(0)" class="banner-dismiss" onclick="dismissAnnouncement('${key}')" title="Dismiss">×</a>
        </div>`);
    }
  }
  if(accountLocked()){
    parts.push(`<div class="banner-note" style="color:var(--rust);background:var(--rust-dim);">${escapeHtml(lockedMessage())}</div>`);
  }
  if(state.err && state.session && displayName() && state.view !== 'submit'){
    parts.push(`<div class="banner-note" style="color:var(--rust);background:var(--rust-dim);">${escapeHtml(state.err)}</div>`);
  }
  banner.innerHTML = parts.join('');
}

  if(state.view === 'review'){
    if(!isStaff()){

    if(state.reviewSubView === 'essays'){

        detailHtml: essaySubmissionDetailHtml,

        groupOrder: ['pending', 'approved', 'rejected'],

          <p class="welcome-heading">Essay Review</p>

    const pending = state.articles.filter(a => a.status === 'pending');
    const published = state.articles.filter(a => a.status === 'approved');
    const declined = state.articles.filter(a => a.status === 'rejected');
    const reviewBase = [...pending, ...published, ...declined];
    const reviewItems = applyArticleFilters(reviewBase, 'review');
    renderSplit(main, reviewItems, {
      emptyTitle: "Nothing to review yet.",
      rowHtml: (a, active) => listRowHtml(a, active),
      detailHtml: reviewDetailHtml,
      groupBy: a => a.status,

      topHtml: subTabsHtml,

    if(isStaff()){
      renderMessagesInbox(main);

      renderMyThread(main);
    }
    return;
  }

  if(state.view === 'users'){
    if(!isEditor()){
      main.innerHTML = `<div class="scroll-panel"><div class="narrow"><div class="locked-msg"><div class="glyph">†</div><p>This desk is for the editor only.</p></div></div></div>`;
      return;
    }
    renderUsersDashboard(main);
    return;
  }

function render(){
  renderAuthBox();
  renderNav();
  renderBanner();
  renderMain();
}

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  await loadOwnProfile();
  await loadArticles();
  await loadUnreadTotal();
  await loadCategories();
  await loadForumQuestions();
  await loadPrayerRequests();
  await loadLists();
  await loadReadingList();
  await loadAnnouncements();
  openArticleFromHash();
  render();

  window.addEventListener('hashchange', openArticleFromHash);

  sb.auth.onAuthStateChange(async (_event, session) => {
    state.session = session;
    state.magicLinkSent = false;
    await loadOwnProfile();
    await loadArticles();
    await loadUnreadTotal();
    await loadReadingList();
    render();
    if(state.view === 'feed' && state.selectedId){
      await loadArticleExtras(state.selectedId);
    }
  });

  sb.channel('articles-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'articles' }, async () => {
      await loadArticles();
      render();
    })
    .subscribe();

  sb.channel('lists-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'lists' }, async () => {
      await loadLists();
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'list_items' }, async () => {
      await loadLists();
      render();
    })
    .subscribe();

  sb.channel('announcements-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'announcements' }, async () => {
      await loadAnnouncements();
      render();
    })
    .subscribe();

  sb.channel('messages-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, async () => {
      await loadUnreadTotal();
      if(state.view === 'messages' && state.session){
        if(isStaff()){
          await loadThreads();
          if(state.selectedThreadId) await loadThread(state.selectedThreadId);
        } else {
          await loadThread(state.session.user.id);
        }
      }
      render();
    })
    .subscribe();

  sb.channel('forum-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'forum_questions' }, async () => {
      if(state.view === 'forum' || state.view === 'feed'){
        await loadForumQuestions();
        render();
      }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'forum_answers' }, async () => {
      if(state.view === 'forum' || state.view === 'feed'){
        await loadForumQuestions();
        if(state.selectedQuestionId) await loadForumAnswers(state.selectedQuestionId);
        render();
      }
    })
    .subscribe();

  sb.channel('prayer-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'prayer_requests' }, async () => {
      if(state.view === 'prayers' || state.view === 'feed'){
        await loadPrayerRequests();
        render();
      }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'prayer_responses' }, async () => {
      if(state.view === 'prayers' || state.view === 'feed'){
        await loadPrayerRequests();
        render();
      }
    })
    .subscribe();
}

init();
</script>
</body>
</html>
